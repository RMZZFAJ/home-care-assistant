><span>${d.type==='ENT'?'Recebedor':'Situação'}</span><strong>${d.type==='ENT'?esc(d.target):esc(d.status)}</strong></div><div class="doc-stat"><span>Linhas</span><strong>${d.items.length} produtos</strong></div></div><section class="card section-space"><div class="tabs" role="tablist">${[['summary','Visão geral'],['items','Itens e materiais'],['alerts','Comunicações'],['audit','Auditoria']].map(([key,l])=>`<button role="tab" aria-selected="${s.docTab===key}" class="tab ${s.docTab===key?'active':''}" data-doc-tab="${key}">${l}${key==='alerts'?` <span class="badge gray">3</span>`:''}</button>`).join('')}</div><div class="card-body" style="min-height:220px">${docTabContent(d)}</div></section>`}
function docTabContent(d) {
  if (s.docTab === 'items') {
    const rows = d.items.map(([name, quantity, status, urgent]) => {
      const label = d.type === 'REQ' ? quantity : (status || 'Pendente');
      const tone = /Atendido|Conferido|Confirmado/.test(label) ? 'green' : 'amber';
      return `<tr><td><strong>${esc(name)}</strong> ${urgent ? badge('Urgente','red') : ''}</td><td>${esc(quantity)}</td><td>${badge(label,tone)}</td></tr>`;
    }).join('');
    return `<div class="section-head"><h2>Itens registrados</h2><button class="btn sm" data-action="doc-primary">${I('edit')} Operar itens</button></div><div class="table-scroll"><table class="table"><thead><tr><th>Produto</th><th>${d.type === 'ENT' ? 'Quantidade expedida' : 'Quantidade / situação'}</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if (s.docTab === 'alerts') {
    const rows = [['Abertura do documento','Rafael Martins, Camila Rocha','Entregue','green'],['Aviso ao responsável','Rafael Martins','Lido','blue'],['Atualização de atendimento','Camila Rocha','Aguardando','amber']];
    return `<div class="section-head"><h2>Comunicações relacionadas</h2>${badge('Resumo por evento','blue')}</div>` + rows.map(([name,to,status,tone]) => `<details style="border:1px solid var(--line);border-radius:8px;margin-bottom:9px;padding:10px 13px"><summary style="cursor:pointer;display:flex;align-items:center;gap:12px"><strong style="flex:1">${name}</strong>${badge(status,tone)}${I('chevronDown',13)}</summary><p class="muted small">Destinatários: ${to}</p><p class="muted small">Canal: aplicativo e WhatsApp (simulação). Detalhes técnicos disponíveis conforme o perfil.</p></details>`).join('');
  }
  if (s.docTab === 'audit') {
    const events = [['08h14','Documento registrado','Rafael Martins'],['08h15','Aviso disponibilizado','Sistema'],['08h18','Mensagem visualizada','Camila Rocha'],['08h20','Consulta ao documento','Rafael Martins']];
    return `<div class="section-head"><h2>Histórico auditável</h2><button class="link small" data-toast="Identificadores técnicos e hashes podem aparecer num painel de integridade.">Detalhes técnicos</button></div><div class="compact-list">${events.map(([time,event,person]) => `<li><div><strong>${event}</strong><div class="small muted">${person} · 23/10/2026</div></div><span class="muted small">${time}</span></li>`).join('')}</div>`;
  }
  const rows = d.items.slice(0, 4).map(([name,value,status,urgent]) => `<li><span><strong>${esc(name)}</strong>${urgent ? ' ' + badge('Urgente','red') : ''}</span><span class="muted small">${esc(d.type === 'REQ' ? value : status || value)}</span></li>`).join('');
  const next = d.type === 'REQ' ? 'Ciência e atendimento' : d.type === 'ENT' ? 'Conferência dos materiais' : d.type === 'BAL' ? 'Auditoria concluída' : 'Recebimento da compra';
  const hint = d.type === 'ENT' ? 'O destinatário deve confirmar os materiais, ou apontar divergências reais.' : d.type === 'REQ' ? 'A ciência familiar está pendente. O atendimento já pode continuar.' : 'Acompanhe o próximo evento sem alternar entre várias telas.';
  return `<div class="split" style="grid-template-columns:1.2fr .8fr"><div><div class="section-head"><h2>Itens em destaque</h2><button class="link small" data-doc-tab="items">Ver todos ${I('chevronRight',13)}</button></div><ul class="compact-list">${rows}</ul></div><div><div class="section-head"><h2>Próxima etapa</h2></div><div class="soft-panel"><div style="font-weight:700">${next}</div><p class="small muted" style="margin:8px 0 12px">${hint}</p><button class="btn primary sm" data-action="doc-primary">${d.type === 'ENT' ? 'Iniciar conferência' : d.type === 'REQ' ? 'Registrar ciência' : 'Ver opções'} ${I('chevronRight',13)}</button></div></div></div>`;
}
function stock(){let view=s.stockView;return `${title('Estoque e custódia','Saldos registrados, materiais em trânsito e alertas, sem confundir contabilização com contagem física.','GESTÃO DE MATERIAIS')}<div class="heading-actions">${action('stock-adjust','Registrar movimentação','plus',true)}</div></div><div class="grid-3"><div class="card metric"><span class="metric-caption">Produtos monitorados</span><div class="metric-value">29</div><div class="metric-foot">Catálogo demonstrativo</div><div class="metric-icon">${I('package')}</div></div><div class="card metric"><span class="metric-caption">Abaixo do estoque mínimo</span><div class="metric-value">03</div><div class="metric-foot">Acompanhar reposição</div><div class="metric-icon">${I('alert')}</div></div><div class="card metric"><span class="metric-caption">Última contagem física</span><div class="metric-value" style="font-size:20px;margin-top:13px">20/10</div><div class="metric-foot">BAL-0003 concluído</div><div class="metric-icon">${I('calendar')}</div></div></div><section class="card section-space"><div class="toolbar"><div class="pill-row">${[['all','Todos'],['family','Família'],['team','Equipe']].map(([key,l])=>`<button class="subtab ${view===key?'active':''}" style="margin:0" data-stock-view="${key}">${l}</button>`).join('')}</div><span class="muted small" style="margin-left:auto">Última atualização: agora · simulado</span></div><div class="table-scroll"><table class="table"><thead><tr><th>Produto</th><th>Saldo da família</th><th>Saldo da equipe</th><th>Limite mínimo</th><th>Situação</th><th></th></tr></thead><tbody>${products.map((p,i)=>`<tr class="table-row-click" data-product="${i}"><td><strong>${esc(p.name)}</strong><div class="secondary-line">Unidade: ${p.unit}</div></td><td><strong>${view==='team'?'—':p.family}</strong> ${view==='team'?'':p.unit}</td><td><strong>${view==='family'?'—':p.team}</strong> ${view==='family'?'':p.unit}</td><td>${p.min} ${p.unit}</td><td>${badge(p.alert,p.alert==='Normal'?'green':'amber')}</td><td>${I('chevronRight',14)}</td></tr>`).join('')}</tbody></table></div></section><div class="info-banner section-space">${I('info')} O saldo informado é contábil. A contagem física é uma informação separada e datada.</div>`}
function admin(){const tabs=[['overview','Visão geral'],['people','Pessoas e vínculos'],['permissions','Permissões'],['notifications','Notificações'],['rules','Regras']];return `${title('Administração do paciente','Configurações organizadas por assunto. Edite somente o que precisar, sem formulários extensos à primeira vista.','HELENA MARTINS · CONFIGURAÇÕES')}<div class="heading-actions"><button class="btn" data-toast="Simulação: as configurações ficam somente nesta demonstração.">${I('info')} Ambiente demonstrativo</button></div></div><section class="card"><div class="tabs">${tabs.map(([id,t])=>`<button class="tab ${s.adminTab===id?'active':''}" data-admin-tab="${id}">${t}</button>`).join('')}</div><div style="padding:17px">${adminContent()}</div></section>`}
function adminContent(){if(s.adminTab==='permissions')return permissionMatrix();if(s.adminTab==='notifications')return notificationMatrix();if(s.adminTab==='people')return peopleContent(true);if(s.adminTab==='rules')return rulesContent();return `<div class="grid-2"><div class="card pad"><div class="flex a-center gap10"><div class="task-symbol">${I('users')}</div><div class="grow"><strong>Pessoas e vínculos</strong><div class="small muted">5 pessoas · 4 vínculos ativos</div></div><button class="btn sm" data-admin-tab="people">Gerenciar</button></div></div><div class="card pad"><div class="flex a-center gap10"><div class="task-symbol">${I('shield')}</div><div class="grow"><strong>Permissões</strong><div class="small muted">Funções, exceções e regras de acesso</div></div><button class="btn sm" data-admin-tab="permissions">Abrir matriz</button></div></div><div class="card pad"><div class="flex a-center gap10"><div class="task-symbol">${I('bell')}</div><div class="grow"><strong>Comunicação</strong><div class="small muted">Eventos × funções × canais</div></div><button class="btn sm" data-admin-tab="notifications">Configurar</button></div></div><div class="card pad"><div class="flex a-center gap10"><div class="task-symbol">${I('settings')}</div><div class="grow"><strong>Regras de operação</strong><div class="small muted">Ciência, arquivamento e balanços</div></div><button class="btn sm" data-admin-tab="rules">Revisar</button></div></div></div><div class="soft-panel" style="margin-top:17px">${I('info',16)} <span class="small">Em vez de mostrar todos os controles em uma única página, cada área tem sua lista principal e edição contextual.</span></div>`}
function peopleContent(embed){return `<div class="section-head"><div><h2>Pessoas e vínculos</h2><div class="small muted" style="margin-top:3px">Gerencie participantes em lista compacta; clique para alterar.</div></div><button class="btn primary" data-action="invite">${I('plus')} Convidar pessoa</button></div><div class="table-scroll"><table class="table"><thead><tr><th>Pessoa</th><th>Função</th><th>Acesso</th><th></th></tr></thead><tbody>${people.map((p,i)=>`<tr class="table-row-click" data-person="${i}"><td><div class="flex a-center gap10"><div class="avatar-mini">${p.initials}</div><div><strong>${esc(p.name)}</strong><div class="secondary-line">${esc(p.mail)}</div></div></div></td><td>${esc(p.role)}</td><td>${badge(p.state,p.state==='Ativo'?'green':'amber')}</td><td><button class="btn sm" data-person="${i}">${I('edit',13)} Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function peoplePage(){return `${title('Pessoas e vínculos','Edite responsáveis, profissionais, familiares e supervisão sem navegar por formulários extensos.','ADMINISTRAÇÃO DO PACIENTE')}</div><section class="card pad">${peopleContent(false)}</section>`}
function permValue(i,j){return s.perm[i+'-'+j]??((i<=1||j===0)?1:(i===2&&j===1)?1:(i===3&&j===3)?0:(i===4&&j===3)?1:(i===6&&j===3)?1:(i===7&&j===1)?1:0)}
function permissionMatrix(){return `<div class="section-head"><div><h2>Matriz de permissões</h2><div class="small muted">Um clique alterna a célula. H = herdada, ✓ = permitida, — = restrita.</div></div><button class="btn sm" data-toast="Alterações nesta demonstração são apenas visuais e não afetam permissões reais.">${I('info')} Regras e herança</button></div><div class="table-scroll"><table class="table matrix-table"><thead><tr><th>Capacidade</th>${roles.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${permRows.map(([group,l],i)=>`<tr><td><strong>${esc(l)}</strong><div class="secondary-line">${esc(group)}</div></td>${roles.map((role,j)=>`<td><button class="matrix-cell" data-perm="${i}-${j}">${permValue(i,j)===1?`<span style="color:var(--green)">${I('check',14)} Permitido</span>`:permValue(i,j)===2?`<span style="color:#627184">H · Herdar</span>`:`<span style="color:#86929e">— Restrito</span>`}${I('chevronDown',12)}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="info-banner section-space">${I('shield')} A matriz é apenas uma representação. As permissões reais permanecem verificadas no servidor e no Supabase.</div>`}
function notifValue(i,j){return s.notif[i+'-'+j]??(['App,WhatsApp','App','App','—'][j])}
function notificationMatrix(){return `<div class="section-head"><div><h2>Matriz de notificações</h2><div class="small muted">Um único quadro. Abra a célula para selecionar múltiplos canais.</div></div><button class="btn sm" data-toast="No sistema completo, será possível configurar horário de silêncio, PDF e lembretes no painel avançado.">${I('settings')} Regras avançadas</button></div><div class="table-scroll"><table class="table matrix-table"><thead><tr><th>Evento</th>${roles.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${ruleRows.map((l,i)=>`<tr><td><strong>${esc(l)}</strong><div class="secondary-line">${i===0?'REQ':i===1?'Ciência':i===2?'REQ':i===3||i===4?'ENT':i===5?'BAL':'Estoque'}</div></td>${roles.map((_,j)=>{const x=notifValue(i,j);return `<td><button class="matrix-cell" data-notif="${i}-${j}"><span>${esc(x)}</span>${I('chevronDown',12)}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="info-banner section-space">${I('info')} Você pode alterar os canais simulados e ver como a matriz mantém a configuração legível.</div>`}
function rulesContent(){return `<div class="section-head"><div><h2>Regras operacionais</h2><div class="small muted">Visualização compacta: altere somente o grupo necessário.</div></div></div>${[['Ciência da requisição','Um familiar autorizado pode dar ciência; modalidade individual configurável.','science'],['Arquivamento','Após 7 dias da conclusão, se os requisitos estiverem satisfeitos.','archive'],['Balanço semanal','Domingo · Revisão por supervisor autorizado.','balance'],['Notificações','Lembretes e canais configurados na matriz de comunicação.','alerts']].map(([t,d,id])=>`<div class="overview-item" style="margin-bottom:8px"><div>${I('settings')}</div><div class="grow"><strong>${t}</strong><div class="small muted">${d}</div></div><button class="btn sm" data-rule="${id}">${I('edit',13)} Editar</button></div>`).join('')}`}
function notificationPage(){return `${title('Notificações','Acompanhe eventos por tipo e faça ações sem perder o contexto.','CENTRAL PESSOAL')}</div><section class="card"><div class="card-header"><div><strong>Atualizações recentes</strong><div class="card-sub">Estados de comunicação são diferentes de ciência e recebimento.</div></div><button class="btn sm" data-toast="Todas as notificações foram marcadas como lidas (simulação).">${I('check')} Marcar lidas</button></div><div class="card-body">${[['REQ-0007','Nova requisição registrada','Ciência familiar pendente','amber','req7'],['ENT-0012','Entrega aguardando conferência','4 materiais enviados','blue','ent12'],['BAL-0003','Balanço concluído','29 produtos contados','green','bal3']].map(([id,t,d,tone,doc])=>`<div class="task-row"><div class="task-symbol">${I('bell')}</div><div class="task-main"><strong>${id} · ${t}</strong><div class="task-desc">${d}</div></div>${badge(tone==='amber'?'Pendente':tone==='blue'?'Acompanhar':'Concluído',tone)}<button class="btn sm" data-doc="${doc}">Abrir</button></div>`).join('')}</div></section>`}
function listBy(type,titleText,sub){let rows=docs.filter(x=>x.type===type);return `${title(titleText,sub,'OPERAÇÃO')}<div class="heading-actions">${action(type==='REQ'?'new-req':type==='ENT'?'new-ent':type==='COM'?'new-com':'new-bal','Nova ficha','plus',true)}</div></div><section class="card"><div class="card-header"><strong>Registros recentes</strong>${badge(type,'blue')}</div>${docTable(rows,false)}</section>`}
function reqWizard(){let steps=['Produtos','Informações','Revisão'];return `${title('Nova requisição','Uma jornada curta, com seleção de materiais e revisão antes da emissão.','REQ · DEMONSTRAÇÃO')}<div class="heading-actions"><button class="btn" data-nav="overview">${I('x')} Cancelar</button></div></div><div class="card" style="max-width:850px;margin:auto"><div class="card-header"><strong>Requisição de materiais</strong><span class="small muted">Etapa ${s.reqStep+1} de 3</span></div><div class="card-body"><div class="stage" style="padding-top:4px">${steps.map((v,i)=>`<div class="stage-step ${i<s.reqStep?'done':i===s.reqStep?'current':''}"><div class="stage-dot">${i<s.reqStep?I('check'):i+1}</div><div class="stage-name">${v}</div></div>`).join('')}</div>${reqStepContent()}<div class="flex j-between a-center" style="margin-top:23px;padding-top:14px;border-top:1px solid var(--line)"><button class="btn" ${s.reqStep===0?'disabled':''} data-wizard-back="1">${I('chevronLeft',14)} Voltar</button><button class="btn primary" data-wizard-next="1">${s.reqStep===2?'Emitir REQ demonstrativa':'Continuar'} ${I(s.reqStep===2?'check':'chevronRight',15)}</button></div></div></div>`}
function reqStepContent(){if(s.reqStep===0)return `<h3 style="margin:0 0 5px">Quais materiais estão faltando?</h3><p class="small muted">Selecione os produtos. Se houver requisição anterior pendente, você poderá consultá-la sem sair desta etapa.</p><div style="display:grid;gap:8px;margin-top:16px">${['Fralda geriátrica G','Soro fisiológico 0,9%','Gaze estéril','Dieta enteral','Lenço umedecido'].map((name,i)=>`<label class="overview-item" style="cursor:pointer;${s.reqSelected.includes(i)?'border-color:#9cc7e8;background:#f5faff':''}"><input type="checkbox" data-req-item="${i}" ${s.reqSelected.includes(i)?'checked':''} style="accent-color:var(--blue);width:16px;height:16px"><span class="grow"><strong>${name}</strong>${i===1?`<span class="small muted" style="display:block">${s.reqJustified?'Justificativa registrada':'Já consta em REQ-0006 · pendente'}</span>`:''}</span>${i===1?badge('Solicitado anteriormente','amber'):''}</label>`).join('')}</div>`;if(s.reqStep===1)return `<h3>Informações da solicitação</h3><div class="grid-2"><div class="field"><span>Profissional solicitante</span><input value="Camila Rocha" readonly></div><div class="field"><span>Data</span><input value="23/10/2026 às 09h10" readonly></div></div><div class="field" style="margin-top:13px"><span>Observações adicionais</span><textarea id="reqObs" placeholder="Opcional: informe o motivo ou contexto da necessidade."></textarea></div><label style="margin-top:15px;display:flex;gap:9px;align-items:center"><input type="checkbox" id="reqUrgent" ${s.reqUrgent?'checked':''} style="accent-color:var(--blue)"><strong>Existe necessidade urgente</strong></label>`;return `<h3>Revise os dados antes de emitir</h3><div class="soft-panel"><div class="small muted">Paciente</div><strong>Helena Martins</strong><div class="small muted" style="margin-top:14px">Produtos selecionados</div>${s.reqSelected.map(x=>`<div style="margin-top:7px">${esc(['Fralda geriátrica G','Soro fisiológico 0,9%','Gaze estéril','Dieta enteral','Lenço umedecido'][x])}</div>`).join('')}${s.reqJustified?`<div class="small muted" style="margin-top:14px">Justificativa de repetição: ${esc(s.reqReason)}</div>`:''}</div><div class="info-banner section-space">${I('info')} A ciência familiar será solicitada após o registro. O PDF de emissão não representa ciência.</div>`}
function globalPage(){return `${title('Administração global','Uma área separada da administração do paciente para reduzir ambiguidades de autoridade.','SISTEMA')} </div><div class="grid-3">${[['Pacientes', '2 ambientes demonstrativos','users'],['Contas globais','1 administrador principal','shield'],['Configurações da plataforma','Metadados e integrações','settings']].map(([t,d,i])=>`<div class="card pad"><div class="task-symbol">${I(i)}</div><h3 style="margin-bottom:6px">${t}</h3><p class="muted small">${d}</p><button class="btn sm" data-toast="Seção demonstrativa: sem alterações reais.">Consultar ${I('chevronRight',13)}</button></div>`).join('')}</div>`}
function preferences(){return `${title('Meu perfil','Configure seu acesso pessoal e preferências em grupos compactos.','MINHA CONTA')}</div><section class="card pad" style="max-width:850px">${[['Identidade e contato','Nome, e-mail, telefone e foto','user'],['Autenticação e segurança','Senha, recuperação e sessões','lock'],['Preferências de ciência','Ciência expressa, simplificada e automática','shield'],['Notificações pessoais','Canais e horários preferidos','bell']].map(([t,d,ico])=>`<div class="overview-item" style="margin-bottom:9px"><div>${I(ico)}</div><div class="grow"><strong>${t}</strong><div class="small muted">${d}</div></div><button class="btn sm" data-rule="${t}">Editar</button></div>`).join('')}</section>`}
function pageContent(){switch(s.page){case'overview':return dashboard();case'history':return history();case'document':return documentView();case'stock':return stock();case'admin':return admin();case'people':return peoplePage();case'notifications':return notificationPage();case'new-req':return reqWizard();case'delivery':return listBy('ENT','Entregas e recebimentos','Expedição, conferência e divergências efetivas.');case'purchases':return listBy('COM','Compras da família','Compras, doações e recebimento físico.');case'balances':return listBy('BAL','Balanços semanais','Contagens reais, revisão e auditoria.');case'global':return globalPage();case'preferences':return preferences();default:return dashboard()}}
function drawer(){if(!s.drawer)return '';const x=s.drawer;let titleText='',body='',buttons='';if(x.type==='product'){const p=products[x.index];titleText=p.name;body=`<div class="eyebrow">PRODUTO · ESTOQUE</div><h3 style="margin:8px 0 20px">${esc(p.name)}</h3><div class="grid-2"><div class="doc-stat"><span>Saldo família</span><strong>${p.family} ${p.unit}</strong></div><div class="doc-stat"><span>Saldo equipe</span><strong>${p.team} ${p.unit}</strong></div></div><div class="field section-space"><span>Estoque mínimo configurado</span><input id="productMin" type="number" value="${p.min}" min="0" step="0.1"/></div><div class="soft-panel section-space"><strong>Último BAL</strong><p class="muted small">20/10/2026 · conferência física registrada separadamente</p></div>`;buttons=`<button class="btn" data-close-drawer="1">Cancelar</button><button class="btn primary" data-save-product="${x.index}">Salvar limite</button>`}else if(x.type==='person'){const p=people[x.index];titleText='Editar vínculo';body=`<div class="flex a-center gap10" style="margin-bottom:22px"><div class="avatar-mini">${p.initials}</div><div><strong>${esc(p.name)}</strong><div class="small muted">${esc(p.mail)}</div></div></div><div class="field"><span>Função do paciente</span><select id="personRole">${['Administrador do paciente','Familiar','Supervisão','Profissional','Leitor'].map(v=>`<option ${v===p.role?'selected':''}>${v}</option>`).join('')}</select></div><div class="soft-panel section-space"><strong>Permissões complementares</strong><p class="muted small">Exceções são definidas na matriz; a função determina o conjunto inicial de acessos.</p></div>`;buttons=`<button class="btn" data-close-drawer="1">Cancelar</button><button class="btn primary" data-save-person="${x.index}">Salvar mudanças</button>`}else if(x.type==='document-action'){const d=docs.find(y=>y.id===s.docId)||docs[0];titleText=d.type==='ENT'?'Conferir entrega':'Registrar ação';body=`<div class="eyebrow">${esc(d.code)}</div><h3>${d.type==='ENT'?'Conferência de materiais':'Ciência ou movimentação'}</h3>${d.type==='ENT'?`<div class="info-banner">${I('info')} Se todos os itens chegaram corretamente, confirme. Caso contrário, registre a divergência.</div><div style="margin-top:18px">${d.items.map(([n,v])=>`<div class="overview-item" style="margin-bottom:8px"><div>${I('package')}</div><div class="grow"><strong>${n}</strong><div class="small muted">${v}</div></div>${badge('A conferir','blue')}</div>`).join('')}</div>`:`<div class="soft-panel">Ciência da requisição registrada com seu perfil autorizado. A comunicação é independente do atendimento de materiais.</div>`}`;buttons=`<button class="btn" data-close-drawer="1">Cancelar</button>${d.type==='ENT'?`<button class="btn" data-action="discrepancy">Informar divergência</button><button class="btn primary" data-confirm-ent="1">Confirmar tudo</button>`:`<button class="btn primary" data-confirm-science="1">Registrar ciência</button>`}`}else if(x.type==='discrepancy'){titleText='Registrar divergência';body=`<p class="muted">Selecione o produto e descreva a diferença efetivamente encontrada.</p><div class="field section-space"><span>Produto</span><select><option>Soro fisiológico 0,9%</option><option>Fralda geriátrica G</option><option>Gaze estéril</option></select></div><div class="field section-space"><span>Descrição da divergência</span><textarea id="discrepancyReason" placeholder="Ex.: foram entregues dois frascos, mas o comprovante indica quatro."></textarea></div>`;buttons=`<button class="btn" data-close-drawer="1">Cancelar</button><button class="btn primary" data-save-discrepancy="1">Registrar divergência</button>`}else if(x.type==='rule'){titleText='Editar configuração';body=`<h3 style="margin:0 0 16px">${esc(x.id)}</h3><div class="field"><span>Configuração atual</span><select><option>Habilitada</option><option>Desabilitada</option></select></div><div class="soft-panel section-space">A versão final exibirá os campos específicos desta regra no mesmo painel, mantendo a página principal limpa.</div>`;buttons=`<button class="btn" data-close-drawer="1">Cancelar</button><button class="btn primary" data-save-rule="1">Salvar</button>`}else if(x.type==='invite'){titleText='Convidar pessoa';body=`<div class="field"><span>Nome</span><input placeholder="Nome completo" /></div><div class="field section-space"><span>E-mail</span><input placeholder="email@exemplo.com" type="email" /></div><div class="field section-space"><span>Função inicial</span><select><option>Profissional</option><option>Familiar</option><option>Supervisão</option></select></div>`;buttons=`<button class="btn" data-close-drawer="1">Cancelar</button><button class="btn primary" data-save-rule="1">Gerar convite</button>`}else{titleText='Nova movimentação';body=`<div class="field"><span>Tipo de movimentação</span><select><option>Entrada de estoque</option><option>Ajuste auditado</option><option>Conferência</option></select></div><div class="field section-space"><span>Produto</span><select>${products.map(p=>`<option>${p.name}</option>`).join('')}</select></div><div class="field section-space"><span>Quantidade</span><input type="number" step="0.1" min="0" placeholder="Ex.: 2" /></div>`;buttons=`<button class="btn" data-close-drawer="1">Cancelar</button><button class="btn primary" data-save-rule="1">Registrar (simulação)</button>`}return `<div class="panel-backdrop" data-close-drawer="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(titleText)}"><div class="drawer-head"><div><div class="eyebrow">EDIÇÃO CONTEXTUAL</div><h2>${esc(titleText)}</h2></div><button class="icon-btn" aria-label="Fechar painel" data-close-drawer="1">${I('x')}</button></div><div class="drawer-body">${body}</div><div class="drawer-foot">${buttons}</div></aside>`}
function modal(){if(!s.modal)return '';if(s.modal==='duplicate')return `<div class="modal-backdrop" role="presentation"><div role="dialog" aria-modal="true" aria-label="Produto já solicitado" class="modal"><div class="modal-head"><span style="color:var(--amber)">${I('alert',23)}</span><h2>Produto já solicitado</h2></div><div class="modal-content"><p>O produto <strong>Soro fisiológico 0,9%</strong> já consta em uma requisição aberta.</p><div class="soft-panel"><strong><button class="link" data-action="view-related">REQ-0006 ${I('external',13)}</button></strong><p class="small muted" style="margin:4px 0 0">Emitida em 22/10/2026 · atendimento pendente. A consulta será aberta sem perder o preenchimento.</p></div><div class="field section-space"><span>Justificativa obrigatória para manter o item</span><textarea id="duplicateReason" placeholder="Explique por que precisa solicitar este produto novamente...">${esc(s.reqReason)}</textarea></div><p class="small muted">Se retirar, o produto não será incluído na nova requisição.</p></div><div class="modal-actions"><button class="btn" data-duplicate-remove="1">Retirar item</button><button class="btn primary" data-duplicate-keep="1">Manter com justificativa</button></div></div></div>`;return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Requisição relacionada · REQ-0006</h2></div><div class="modal-content"><p>Paciente: Helena Martins</p><p>Produto: Soro fisiológico 0,9%</p><p>Situação: atendimento pendente</p><div class="info-banner">${I('info')} Esta consulta não substitui nem abandona a requisição em andamento.</div></div><div class="modal-actions"><button class="btn primary" data-modal-back="1">Voltar ao preenchimento</button></div></div></div>`}
function cellPopover(){if(!s.popCell)return '';const x=s.popCell;const isNotif=x.type==='notif';const [r,c]=x.key.split('-').map(Number);let content=isNotif?`<strong class="small">${esc(ruleRows[r])}</strong><div class="small muted">${esc(roles[c])}</div><div class="popover-sep"></div>${['App','WhatsApp','E-mail','SMS'].map(ch=>{const curr=notifValue(r,c).split(',').map(x=>x.trim());return `<label><input type="checkbox" data-channel="${esc(ch)}" ${curr.includes(ch)?'checked':''} />${esc(ch)}</label>`}).join('')}<div class="small muted" style="margin:8px 5px">SMS aparece apenas como opção demonstrativa.</div>`:`<strong class="small">${esc(permRows[r][1])}</strong><div class="small muted">${esc(roles[c])}</div><div class="popover-sep"></div>${[['1','Permitir'],['0','Restringir'],['2','Herdar da função']].map(([value,label])=>`<label><input type="radio" name="permChoice" data-perm-value="${value}" ${permValue(r,c)==Number(value)?'checked':''}/>${label}</label>`).join('')}`;return `<div class="cell-popover" id="cell-pop" style="left:${x.left}px;top:${x.top}px">${content}<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><button class="btn sm" style="width:100%" data-cell-close="1">Concluído</button></div></div>`}
function toastHTML(){return `<div class="toast-stack">${s.toast.map(t=>`<div class="toast">${I('check',15)} <span>${esc(t.msg)}</span><button class="icon-btn" style="color:#fff;margin-left:auto" aria-label="Fechar aviso" data-close-toast="${t.id}">${I('x',14)}</button></div>`).join('')}</div>`}
function render(){document.getElementById('root').innerHTML=`<div class="app">${sidebar()}<div class="main">${topbar()}${banner()}<main class="content" id="content">${pageContent()}</main></div></div>${drawer()}${modal()}${cellPopover()}${toastHTML()}`;document.title=(s.page==='document'?docs.find(d=>d.id===s.docId)?.code:({overview:'Visão geral',admin:'Administração',stock:'Estoque',history:'Histórico','new-req':'Nova requisição'})[s.page]||'Home Care Assistant')+' — Home Care Assistant | Protótipo'}
function refreshToasts(){const host=document.querySelector('.toast-stack');if(host)host.innerHTML=s.toast.map(t=>`<div class="toast">${I('check',15)} <span>${esc(t.msg)}</span><button class="icon-btn" style="color:#fff;margin-left:auto" aria-label="Fechar aviso" data-close-toast="${t.id}">${I('x',14)}</button></div>`).join('')}
function toast(msg){const item={id:++toastCounter,msg};s.toast.push(item);if(s.toast.length>3)s.toast.shift();refreshToasts();setTimeout(()=>{s.toast=s.toast.filter(x=>x.id!==item.id);refreshToasts()},4500)}
function nav(target){s.page=target;s.menu='';s.sideOpen=false;s.popCell=null;s.drawer=null;if(target==='admin'&&!s.adminTab)s.adminTab='overview';render();window.scrollTo({top:0,behavior:'instant'})}
function click(e){const t=e.target.closest('[data-nav],[data-doc],[data-doc-tab],[data-toggle-menu],[data-profile-sub],[data-profile-back],[data-profile],[data-toggle-side],[data-close-side],[data-admin-tab],[data-stock-view],[data-action],[data-product],[data-person],[data-rule],[data-close-drawer],[data-save-product],[data-save-person],[data-save-rule],[data-confirm-ent],[data-confirm-science],[data-save-discrepancy],[data-wizard-next],[data-wizard-back],[data-req-item],[data-duplicate-remove],[data-duplicate-keep],[data-modal-back],[data-perm],[data-notif],[data-cell-close],[data-perm-value],[data-channel],[data-toast],[data-close-toast]');if(!t){if(s.popCell&&!e.target.closest('#cell-pop')){s.popCell=null;render()}return}if(!t.hasAttribute('data-req-item')&&!t.hasAttribute('data-channel')&&!t.hasAttribute('data-perm-value'))e.preventDefault();if(t.hasAttribute('data-nav')){nav(t.dataset.nav);return}if(t.hasAttribute('data-doc')){s.docId=t.dataset.doc;s.page='document';s.docTab='summary';s.menu='';s.drawer=null;render();window.scrollTo(0,0);return}if(t.hasAttribute('data-doc-tab')){s.docTab=t.dataset.docTab;render();return}if(t.hasAttribute('data-toggle-menu')){s.menu=s.menu===t.dataset.toggleMenu?'':t.dataset.toggleMenu;s.profileMenuSub=false;render();return}if(t.hasAttribute('data-profile-sub')){s.profileMenuSub=true;render();return}if(t.hasAttribute('data-profile-back')){s.profileMenuSub=false;render();return}if(t.hasAttribute('data-profile')){s.profile=t.dataset.profile;s.menu='';s.profileMenuSub=false;if(s.profile==='Profissional'||s.profile==='Supervisão')s.page='overview';render();toast('Contexto ativo: '+s.profile+' (somente demonstração)');return}if(t.hasAttribute('data-toggle-side')){s.sideOpen=!s.sideOpen;render();return}if(t.hasAttribute('data-close-side')){s.sideOpen=false;render();return}if(t.hasAttribute('data-admin-tab')){s.page='admin';s.adminTab=t.dataset.adminTab;render();return}if(t.hasAttribute('data-stock-view')){s.stockView=t.dataset.stockView;render();return}if(t.hasAttribute('data-product')){s.drawer={type:'product',index:Number(t.dataset.product)};render();return}if(t.hasAttribute('data-person')){s.drawer={type:'person',index:Number(t.dataset.person)};render();return}if(t.hasAttribute('data-rule')){s.drawer={type:'rule',id:t.dataset.rule};render();return}if(t.hasAttribute('data-close-drawer')){s.drawer=null;render();return}if(t.hasAttribute('data-save-product')){const p=products[Number(t.dataset.saveProduct)];const val=Number(document.getElementById('productMin')?.value);if(!Number.isFinite(val)||val<0){toast('Informe um limite válido.');return}p.min=val;s.drawer=null;render();toast('Limite atualizado nesta demonstração.');return}if(t.hasAttribute('data-save-person')){people[Number(t.dataset.savePerson)].role=document.getElementById('personRole').value;s.drawer=null;render();toast('Função atualizada apenas na demonstração.');return}if(t.hasAttribute('data-save-rule')){s.drawer=null;render();toast('Configuração registrada apenas nesta demonstração.');return}if(t.hasAttribute('data-confirm-ent')){const d=docs.find(x=>x.id===s.docId);if(d){d.stage=4;d.status='Recebimento confirmado';d.tone='green';d.fulfillment='4/4'}s.drawer=null;render();toast('Recebimento confirmado (somente simulação).');return}if(t.hasAttribute('data-confirm-science')){s.drawer=null;render();toast('Ciência registrada (simulação).');return}if(t.hasAttribute('data-save-discrepancy')){const text=document.getElementById('discrepancyReason')?.value?.trim()||'';if(text.length<8){toast('Descreva a divergência antes de confirmar.');return}const d=docs.find(x=>x.id===s.docId);if(d){d.status='Divergência declarada';d.tone='red'}s.drawer=null;render();toast('Divergência registrada (simulação).');return}if(t.hasAttribute('data-action')){const a=t.dataset.action;if(a==='new-req'){s.reqStep=0;s.reqSelected=[];s.reqJustified=false;nav('new-req')}else if(a==='view-history')nav('history');else if(a==='doc-primary'){s.drawer={type:'document-action'};render()}else if(a==='doc-menu')s.drawer={type:'document-action'},render();else if(a==='stock-adjust'||a==='new-ent'||a==='new-com'||a==='new-bal'){s.drawer={type:'stock-adjust'};render()}else if(a==='discrepancy'){s.drawer={type:'discrepancy'};render()}else if(a==='invite'){s.drawer={type:'invite'};render()}else if(a==='view-related'){s.modal='related';render()}return}if(t.hasAttribute('data-wizard-next')){if(s.reqStep===0&&!s.reqSelected.length){toast('Selecione pelo menos um material.');return}if(s.reqStep<2){if(s.reqStep===1)s.reqUrgent=!!document.getElementById('reqUrgent')?.checked;s.reqStep++;render()}else{const code='REQ-0008';docs.unshift({id:'req8',type:'REQ',code,date:'23/10/26 · 09h10',owner:'Rafael Martins',target:'Helena Martins',stage:1,fulfillment:`0/${s.reqSelected.length}`,status:'Ciência pendente',tone:'amber',urgent:s.reqUrgent,items:s.reqSelected.map(i=>[['Fralda geriátrica G','Soro fisiológico 0,9%','Gaze estéril','Dieta enteral','Lenço umedecido'][i],'Pendente','',s.reqUrgent])});s.docId='req8';s.docTab='summary';s.page='document';render();toast('REQ demonstrativa emitida. Nenhum dado foi enviado.')}return}if(t.hasAttribute('data-wizard-back')){s.reqStep=Math.max(0,s.reqStep-1);render();return}if(t.hasAttribute('data-duplicate-remove')){s.reqSelected=s.reqSelected.filter(x=>x!==1);s.reqJustified=false;s.reqReason='';s.modal=null;render();return}if(t.hasAttribute('data-duplicate-keep')){let val=document.getElementById('duplicateReason')?.value.trim()||'';if(val.length<10){toast('Escreva uma justificativa de pelo menos 10 caracteres.');return}s.reqReason=val;s.reqJustified=true;s.modal=null;render();return}if(t.hasAttribute('data-modal-back')){s.modal='duplicate';render();return}if(t.hasAttribute('data-perm')||t.hasAttribute('data-notif')){let x=t.getBoundingClientRect();let left=Math.max(8,Math.min(x.left,innerWidth-234));let top=x.bottom+5;if(top+275>innerHeight)top=Math.max(7,x.top-270);s.popCell={type:t.hasAttribute('data-perm')?'perm':'notif',key:t.dataset.perm||t.dataset.notif,left,top};render();return}if(t.hasAttribute('data-cell-close')){s.popCell=null;render();return}if(t.hasAttribute('data-perm-value')){s.perm[s.popCell.key]=Number(t.dataset.permValue);s.popCell=null;render();return}if(t.hasAttribute('data-channel')){let key=s.popCell.key;let arr=s.notif[key]??notifValue(...key.split('-').map(Number));let channels=arr==='—'?[]:arr.split(',').filter(Boolean);if(t.checked){if(!channels.includes(t.dataset.channel))channels.push(t.dataset.channel)}else channels=channels.filter(x=>x!==t.dataset.channel);s.notif[key]=channels.length?channels.join(','):'—';const label=document.querySelector(`[data-notif="${key}"] span`);if(label)label.textContent=s.notif[key];return}if(t.hasAttribute('data-toast')){toast(t.dataset.toast);return}if(t.hasAttribute('data-close-toast')){s.toast=s.toast.filter(x=>x.id!==Number(t.dataset.closeToast));render();return}}
document.addEventListener('click',click);
document.addEventListener('change',e=>{if(e.target.matches('[data-req-item]')){const i=Number(e.target.dataset.reqItem);if(e.target.checked){if(!s.reqSelected.includes(i))s.reqSelected.push(i);if(i===1&&!s.reqJustified)s.modal='duplicate'}else{s.reqSelected=s.reqSelected.filter(x=>x!==i);if(i===1){s.reqReason='';s.reqJustified=false}}render()}if(e.target.matches('#docTypeFilter')){s.docFilter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.matches('#historySearch')){const q=e.target.value;const pos=e.target.selectionStart;s.search=q;render();const input=document.getElementById('historySearch');if(input){input.focus();input.setSelectionRange(pos,pos)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(s.popCell)s.popCell=null;else if(s.modal)s.modal=null;else if(s.drawer)s.drawer=null;else if(s.menu)s.menu='';else if(s.sideOpen)s.sideOpen=false;render()}});
render();
})();
</script>
</body>
</html>
