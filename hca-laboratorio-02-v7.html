  const archiveLocked = () => H.archiveLocked ? Boolean(H.archiveLocked()) : Boolean(S().flags.lcFinal || String(S().flags.documentStatus||'').startsWith('Arquivada') || ['archive-pending','archive-final','archive-reverse'].includes(S().phase));
  const localStock = (id,side) => S().stock?.[side]?.[id] ?? H.catalog.find(x=>x.id===id)?.[side] ?? 0;
  function stockState(){S().stock ||= {team:{},family:{}};S().stock.team ||= {};S().stock.family ||= {};return S().stock;}
  function factsFor(id,data){S().flags.materialFacts ||= {};S().flags.materialFacts[id]={...S().flags.materialFacts[id],...data};}
  function applyOnce(key,callback){S().flags.appliedOperations ||= {};const token='lifecycle:'+key;if(S().flags.appliedOperations[token])return false;callback();S().flags.appliedOperations[token]=true;return true;}
  function reqStockContext(){
    const current=Number(S().stock?.team?.dip ?? ((S().phase==='cancellation-with-movements'||S().flags.lcLaterMovements)?18:8));
    return {before:12,reported:8,current,after:current+(V('lcStock')==='revert'?4:0)};
  }
  function applyReqCancellation(){
    applyOnce('req-cancel',()=>{
      const c=reqStockContext(),stock=stockState();
      stock.team.dip=c.after;stock.team.fralda=stock.team.fralda??18;
      S().flags.issuedCounts={...S().flags.issuedCounts,dip:8,fralda:18};
      factsFor('dip',{latestCount:8,previousCount:12,countAdjustmentReverted:V('lcStock')==='revert'});
      factsFor('fralda',{latestCount:18});
    });
  }
  function applyPhysicalCancellation(mode){
    const origin=kind()==='DEV'?'team':'family',destination=origin==='team'?'family':'team';
    applyOnce('physical-cancel',()=>{
      const returned=mode==='transit'?12:9,stock=stockState();
      stock[origin].fralda=localStock('fralda',origin)+returned;
      if(mode==='received')stock[destination].fralda=localStock('fralda',destination)-returned;
      factsFor('fralda',{sent:12,received:mode==='received'?12:0,transit:0,returned,cancellationReturned:returned,consumed:mode==='received'?3:0,cancellationRecorded:true});
    });
  }
  const person = () => H.people[S().actor] || H.people.admin;
  const receiverActor = () => kind()==='DEV'?'family':'team';
  const receiverName = () => H.people[receiverActor()];
  const policyDays = 7;
  const priorStatus = () => S().flags.lcPriorStatus || (['E04-14','E05-13','E06-10','E06-11'].includes(S().scene.id) ? 'Cancelada' : 'Concluída');
  const cancelled = () => ['reversible-cancelled','cancellation','cancellation-with-movements','cancel-transit','cancel-received','cancel-consent-pending','cancel-consent-review','cancel-consent-refused'].includes(S().phase) || S().flags.lcPriorStatus === 'Cancelada';
  const stack = content => `<div class="stack">${content}</div>`;
  const muted = text => `<p class="muted small">${H.e(text)}</p>`;
  const notice = (title,text,tone='info') => H.notice(title,text,tone);
  const meta = () => H.meta([['Ficha',code()],['Paciente',H.patient],['Responsável pela ação',person()],['Referência',`${date()} · 10:24`]]);
  const closeButton = () => B('Voltar à ficha','lc-close','ghost','arrowLeft');
  const footer = html => `<div class="split-actions">${closeButton()}<div class="row">${html}</div></div>`;
  const reason = (label='Justificativa',key='lcReason',hint='A justificativa ficará no histórico desta ficha.') => H.field(label,H.textarea(key,V(key),{placeholder:'Descreva o motivo desta decisão.',rows:3}),hint);
  const validReason = (key='lcReason') => String(V(key)).trim() ? true : H.error(key,'Informe o motivo desta decisão.');
  const lcMeta = (title, subtitle, body, actions, wide=false) => ({base:'document',modal:{kicker:`${code()} · ${H.patient}`,title,subtitle,body:stack(body),footer:footer(actions),wide}});
  const statusStrip = (label,description,tone='neutral') => H.row(label,description,H.badge(label,tone),{icon: tone==='success'?'checkCircle':tone==='warning'?'clock':'file'});

  function policyLine(final=false) {
    return H.row(final?'Arquivo definitivo':`Arquivamento em ${policyDays} dias`,final?'Disponível para consulta e download do PDF consolidado.':`Política da residência. Até o arquivamento, a ficha aceita andamentos e emissão de PDF.`, final?H.badge('Somente leitura','neutral'):H.badge('Política padrão','info'),{icon:final?'lock':'archive'});
  }

  function physicalFacts() {
    if (kind()==='COM') return H.facts([{label:'Comprados',value:'40 unidades'},{label:'Já chegaram',value:'40 unidades'},{label:'Crédito no estoque',value:'Preservado',note:'Nenhuma retirada por cancelar a ficha'}]);
    if (isTransfer()) {
      const recorded=S().flags.materialFacts?.fralda,transit=S().scene.id==='E06-10';
      const received=recorded?.received??(transit?0:12),consumed=recorded?.consumed??(transit?0:3),returned=recorded?.cancellationReturned??recorded?.returned??(transit?12:9);
      return H.facts([{label:'Recebimento registrado',value:received+' unidades'},{label:'Consumo confirmado',value:consumed+' unidades'},{label:'Retorno registrado',value:returned+' unidades',note:kind()==='DEV'?'Retorno à equipe':'Retorno à família'}]);
    }
    return H.facts([{label:'Emissão da REQ',value:'Estoque informado pela equipe'},{label:'Movimentações posteriores',value:'Continuam registradas'}]);
  }

  function stockDecision() {
    const current=reqStockContext().current,selected=V('lcStock','');
    return '<div class="v7-stock-choice">'+
      H.row('Dipirona 500 mg','Na emissão da REQ, a contagem passou de 12 para 8 comprimidos.','',{icon:'pill'})+
      (current===18?muted('Depois, entraram 12 comprimidos por entrega e saíram 2 por consumo.'): '')+
      [['keep','Manter a contagem da REQ',current],['revert','Reverter o ajuste da emissão',current+4]].map(([id,title,after])=>
        `<label class="v7-stock-option"><input type="radio" name="reqStockChoice" data-model="lcStock" value="${id}"${selected===id?' checked':''}><span><strong>${title}</strong><small>Saldo atual → após o cancelamento</small><b>${current} ${H.ico('arrowRight',13)} ${after} comprimidos</b></span></label>`).join('')+
      (S().errors.lcStock?'<p class="field-error" role="alert">'+H.e(S().errors.lcStock)+'</p>':'')+
      muted('Os materiais cuja contagem permaneceu igual e as movimentações posteriores são preservados.')+'</div>';
  }
  function confirmStock(){
    return {kicker:code(),title:'Como deve ficar o estoque?',subtitle:'Escolha o saldo antes de concluir o cancelamento.',body:stockDecision(),footer:B('Voltar','lc-modal-close','secondary','arrowLeft')+B('Cancelar a requisição','lc-apply-stock','danger','check')};
  }
  function closure(sc) {
    const blocked = S().phase==='closure-blocked' && !S().flags.closureResolved;
    const rows = kind()==='COM' ?
      H.checkline('Itens e quantidades autorizados','A avaliação da compra foi concluída.','success')+
      H.checkline('Compras registradas','Os materiais têm registro de aquisição.','success')+
      H.checkline('Chegada parcial esclarecida','35 das 40 unidades chegaram. A falta de 5 já foi registrada e não há nova entrega esperada.','success')+
      H.checkline(blocked?'Uma chegada aguarda aprovação':'Chegadas conferidas',blocked?'Lucas Almeida registrou 35 fraldas. Elas aguardam aprovação para entrar no estoque da família.':'Os recebimentos e os créditos de estoque estão registrados.',blocked?'danger':'success',blocked?B('Revisar chegada','lc-resolve-arrival','secondary','checklist'): '')+
      H.checkline('Vínculo com a REQ preservado','A compra não substitui a entrega à equipe.','success') :
      H.checkline('Materiais conferidos','As quantidades informadas pelos responsáveis foram conferidas.','success')+
      H.checkline('Quantidades conferidas','Não há diferença física aguardando resolução.','success')+
      H.checkline(blocked?'Fralda geriátrica G aguarda a família':'Necessidade avaliada',blocked?'A equipe pediu nova avaliação. Decida se o material foi atendido parcial ou integralmente antes de concluir.':'Não há avaliação familiar pendente.',blocked?'danger':'success',blocked?B('Avaliar necessidade','lc-resolve-need','secondary','checklist'):'')+
      H.checkline('Histórico preservado','Vínculos, decisões e movimentações continuam disponíveis.','success');
    const content = meta()+`<div class="review-list">${rows}</div>`+
      (blocked ? muted(kind()==='COM'?'Aprove ou resolva a chegada para liberar a conclusão.':'A conclusão será liberada depois da decisão familiar.') : policyLine())+
      H.field('Observação da conclusão',H.textarea('lcCompleteNote',V('lcCompleteNote'),{placeholder:'Opcional · registre um resumo para quem consultar a ficha.',rows:2}));
    let actions = B('Concluir','lc-complete','primary','check',blocked);
    if(admin()) actions = B('Concluir e arquivar','lc-complete-archive','secondary','archive',blocked)+actions;
    return lcMeta('Revisar e concluir',blocked?'Resolva a pendência antes de concluir esta ficha.':'Tudo pronto para registrar a conclusão.',content,actions,true);
  }

  function cancelForm() {
    const transfer = isTransfer();
    const transit = S().phase==='cancel-transit';
    const after = S().phase==='cancel-received';
    let review = H.checkline('Vínculos e histórico','Os registros anteriores serão preservados.','success');
    let body = meta();
    if(kind()==='REQ') {
      review += H.checkline('Entregas e avaliações','Não há diferença física ou avaliação familiar pendente.','success');
      body += `<div class="review-list">${review}</div>`+muted('Na confirmação, você escolhe se mantém ou reverte a contagem de estoque registrada nesta requisição.');
    } else if (kind()==='COM') {
      review += H.checkline('Chegadas e aprovações','Nenhuma chegada aguarda aprovação.','success');
      body += `<div class="review-list">${review}</div>`+physicalFacts()+muted('Cancelar o planejamento não retira do estoque os materiais que já chegaram.');
    } else if(transit) {
      const origin=kind()==='DEV'?'equipe':'família';
      review += H.checkline('Ainda sem recebimento','A expedição tem 12 unidades em trânsito.','success');
      body += `<div class="review-list">${review}</div>`+H.material(H.catalog.find(x=>x.id==='fralda'),H.facts([{label:'Em trânsito',value:'12 unidades'},{label:'Após cancelar',value:'0 em trânsito'},{label:'Retorno à origem',value:`12 ao estoque da ${origin}`}]))+
        muted('Confirme somente se a expedição foi interrompida e os materiais estão novamente com a origem.');
    } else if(after) {
      body += H.checkline('Recebimento já registrado',`${receiverName()} confirmou o recebimento de 12 unidades.`, 'success')+
        H.facts([{label:'Recebido',value:'12 unidades'},{label:'Consumo confirmado',value:'3 unidades'},{label:'Saldo para conferir',value:'9 unidades'}])+
        notice('A decisão pertence a quem recebeu',`O pedido será encaminhado a ${receiverName()}. A devolução e o cancelamento só serão registrados depois da sua decisão pessoal e da conferência física.`, 'info');
    }
    body += reason(after?'Motivo do pedido de cancelamento':'Motivo do cancelamento')+(!after?policyLine():'');
    return lcMeta(after?'Solicitar cancelamento':'Revisar e cancelar',after?'Confira o pedido antes de encaminhá-lo ao recebedor original.':'Confira os efeitos desta decisão antes de confirmar.',body,B(after?'Enviar pedido':'Confirmar cancelamento',after?'lc-request-consent':'lc-cancel','danger',after?'send':'close'),true);
  }

  function consentPending() {
    const refused=S().phase==='cancel-consent-refused';
    return lcMeta(refused?'Cancelamento não autorizado':'Aguardando decisão do recebedor',refused?'O recebimento e o estoque permanecem como estavam.':'O pedido foi encaminhado a quem registrou o recebimento.',
      meta()+H.row(receiverName(),'Recebedor original',H.badge(refused?'Recusado':'Decisão pendente',refused?'danger':'warning'),{icon:'user'})+
      H.meta([['Solicitado por',H.people.admin],['Data do pedido',`${date()} · 10:24`],['Motivo',V('lcReason','A família solicitou a devolução dos materiais não utilizados.')]])+
      (refused?H.row('Motivo da recusa',V('lcConsentReason','Os materiais permanecem necessários para o cuidado.'),'',{icon:'comment'}):notice('Estoque preservado','O pedido não movimenta materiais. O administrador não pode decidir em nome do recebedor.','info')),
      refused?B('Consultar histórico','lc-history','secondary','history'):B('Retirar pedido','lc-withdraw-consent','secondary','undo'));
  }

  function consentReview() {
    const own=S().actor===receiverActor();
    const decision=V('lcConsent','consent');
    const expected=9;
    const qty=V('lcReturnQty',9);
    const body=H.meta([['Pedido por',H.people.admin],['Recebimento por',receiverName()],['Data do pedido',`${date()} · 10:24`],['Motivo do pedido','Devolver os materiais que não serão utilizados.']])+
      (!own?notice('Decisão pessoal do recebedor',`Somente ${receiverName()} pode aceitar ou recusar este pedido.`, 'warning'):'')+
      H.field('Sua decisão',H.select('lcConsent',decision,[{value:'consent',label:'Consentir com o cancelamento'},{value:'reject',label:'Recusar o cancelamento'}]))+
      (decision==='consent'?H.material(H.catalog.find(x=>x.id==='fralda'),H.facts([{label:'Recebido',value:'12 unidades'},{label:'Consumido',value:'3 unidades'},{label:'Retorno esperado',value:`${expected} unidades`}])+H.field('Quantidade fisicamente devolvida',H.quantity('lcReturnQty',qty,{unit:'unidades',label:'Quantidade devolvida'}),'A quantidade deve coincidir com o saldo após os consumos confirmados.'))+
        H.row('Consumo confirmado','CONS-0014 · 3 unidades · '+date()+' às 09:30',H.badge('Preservado','success'),{icon:'history'})+
        H.toggle('lcPhysicalChecked','Conferi a devolução física e as referências de consumo',Boolean(V('lcPhysicalChecked',false)),'Meu consentimento ficará registrado com a minha autoria.'):'')+
      reason('Motivo da sua decisão','lcConsentReason');
    return lcMeta('Analisar pedido de cancelamento','A decisão será registrada com a autoria de quem recebeu.',body,B(decision==='consent'?'Consentir e registrar devolução':'Recusar cancelamento','lc-consent','primary','check',!own),true);
  }

  function reverseDecision() {
    const previous=priorStatus();
    const body=meta()+H.row('Decisão que será revertida',`${previous} · ${date()} às 10:24 · ${H.people.admin}`,H.badge(previous,'neutral'),{icon:'history'})+
      H.checkline('Acompanhamento reaberto','A ficha volta a permitir as ações de acompanhamento.','success')+
      H.checkline('Decisão anterior preservada','A justificativa e a autoria permanecem no histórico.','success')+
      (isTransfer()?physicalFacts()+notice('Sem movimentação automática','O retorno, o recebimento e o consumo permanecem registrados. Se houver nova movimentação física, use a ação correspondente.','info'):
        kind()==='REQ'?notice('Saldo de estoque preservado','Reabrir a ficha não reaplica a contagem da emissão nem desfaz a escolha de estoque registrada no cancelamento.','info'):muted('Compras e chegadas registradas não serão desfeitas.'))+
      reason('Justificativa da reversão','lcReverseReason');
    return lcMeta('Reverter decisão e reabrir','A reversão ficará vinculada à decisão anterior.',body,B('Reabrir acompanhamento','lc-reverse','primary','undo',!admin()),true);
  }

  function archiveReview() {
    const why=V('lcArchiveWhy','policy');
    return lcMeta('Arquivar ficha','O PDF consolidado será preservado para consulta.',meta()+
      H.checkline('Ficha concluída ou cancelada','O acompanhamento operacional já foi encerrado.','success')+
      H.checkline('PDF consolidado','Será produzido com o estado atual da ficha e o status Arquivada.','success')+
      H.checkline('Confirmação do administrador','Após arquivar, você poderá encerrar definitivamente ou reverter o arquivamento.','warning')+
      H.field('Motivo do arquivamento',H.select('lcArchiveWhy',why,[{value:'policy',label:'Política padrão'},{value:'manual',label:'Arquivamento antecipado'},{value:'other',label:'Outro motivo'}]))+
      (why==='other'?reason('Descreva o motivo','lcArchiveReason'):muted(why==='policy'?`A residência está configurada para arquivar em ${policyDays} dias. Você está antecipando essa etapa manualmente.`:'A antecipação ficará registrada com sua autoria.')),
      B('Arquivar e consolidar PDF','lc-archive','primary','archive',!admin()),true);
  }

  function pdfCard() {
    const archivedAt=S().flags.lcPdf?.generatedAt || `${date()} · 10:25`;
    return H.row(`${code()} · PDF consolidado`,`Gerado no arquivamento · ${archivedAt}`,B('Baixar PDF','lc-final-pdf','secondary','download'),{icon:'file'});
  }

  function archivePending() {
    S().flags.documentStatus='Arquivada · aguardando confirmação';
    ensureFinalPDF();
    const automatic=V('lcArchiveMode','automatic')==='automatic';
    return lcMeta('Confirmar encerramento','A ficha já foi arquivada. Falta sua decisão para encerrar definitivamente.',
      H.row('Arquivada',automatic?`Prazo de ${policyDays} dias atingido · política da residência`:`Arquivamento manual por ${H.people.admin}`,H.badge('Aguardando sua confirmação','warning'),{icon:'archive'})+
      H.meta([['Condição anterior',priorStatus()],['Arquivada em',`${date()} · 10:25`],['Motivo',S().flags.lcArchiveReason||'Política padrão'],['Administrador do paciente',H.people.admin]])+
      pdfCard()+
      H.checkline('PDF consolidado preservado','A versão foi gerada no arquivamento e já pode ser baixada.','success')+
      H.checkline('Ficha em consulta','As alterações ficam suspensas enquanto você decide.','success')+
      notice('Encerramento definitivo','Ao confirmar, a ficha permanecerá somente para consulta e download do PDF preservado. A reversão do arquivamento deixará de estar disponível.','info'),
      B('Reverter arquivamento','lc-show-archive-reverse','secondary','undo',!admin())+B('Confirmar encerramento definitivo','lc-finalize-archive','primary','lock',!admin()),true);
  }

  function archiveReverse() {
    S().flags.documentStatus='Arquivada · aguardando confirmação';
    return lcMeta('Reverter arquivamento','A ficha voltará à condição anterior ao arquivo.',meta()+
      H.row('Condição restaurada',priorStatus(),H.badge('Acompanhamento do registro','info'),{icon:'undo'})+
      H.checkline('Arquivamento anterior preservado','A ocorrência e o PDF daquela versão continuam no histórico.','success')+
      H.checkline('Estoque preservado','A reversão do arquivo não movimenta materiais.','success')+
      reason('Motivo da reversão','lcArchiveReverseReason')+
      muted('Depois da reversão, o administrador poderá revisar a ficha e arquivá-la novamente.'),
      B('Reverter arquivamento','lc-reverse-archive','primary','undo',!admin()));
  }

  function archiveError() {
    return {base:'document',modal:H.systemError({title:'Não foi possível arquivar a ficha',description:'O PDF consolidado não foi gerado. A ficha ficou disponível no estado anterior ao arquivamento.',code:'HCA-ARQ-017',retry:admin()?'lc-retry-archive':null,back:'lc-close',exhausted:'Tente arquivar a ficha mais tarde. Copie os detalhes e encaminhe ao administrador do sistema.'})};
  }

  H.renderLifecycle = sc => {
    const phase=S().phase || sc.variant;
    if(['closure-ready','closure-blocked'].includes(phase)) return closure(sc);
    if(['cancellation','cancellation-with-movements','cancel-transit','cancel-received'].includes(phase)) return cancelForm();
    if(['cancel-consent-pending','cancel-consent-refused'].includes(phase)) return consentPending();
    if(phase==='cancel-consent-review') return consentReview();
    if(['reversible-completed','reversible-cancelled'].includes(phase)){
      const status=phase==='reversible-cancelled'?'Cancelada':'Concluída';
      S().flags.lcPriorStatus=status;
      if(!S().flags.lcReopened)S().flags.documentStatus=status;
      return {base:'document'};
    }
    if(phase==='reverse-decision') return reverseDecision();
    if(phase==='archive-review') return archiveReview();
    if(phase==='archive-pending'){S().flags.documentStatus='Arquivada · aguardando confirmação';ensureFinalPDF();return {base:'document'};}
    if(phase==='archive-final'){S().flags.lcFinal=true;S().flags.documentStatus='Arquivada · encerramento confirmado';ensureFinalPDF();return {base:'document'};}
    if(phase==='archive-reverse') return archiveReverse();
    if(phase==='archive-error') return archiveError();
    return closure(sc);
  };

  function setPhase(phase) {
    S().phase=phase; S().modal=null; S().modalClosed=false; S().flags.lifecycleDismissed=false; H.render();
  }
  function stockOutcome() {
    const reverting=V('lcStock')==='revert';
    const later=S().phase==='cancellation-with-movements',c=reqStockContext();
    return reverting ? `Ajuste da emissão revertido: Dipirona ${c.current} → ${c.after} comprimidos. ${later?'A ENT de 12 e o consumo de 2 foram preservados.':''}` : `Mantidas as quantidades informadas na emissão da REQ. Estoque atual: ${c.current} comprimidos; movimentos posteriores preservados.`;
  }
  H.on('lc-close',()=>{S().flags.lifecycleDismissed=true; S().modalClosed=true; S().modal=null; H.render();});
  H.on('lc-complete',()=>{
    if(S().phase==='closure-blocked'&&!S().flags.closureResolved) return;
    H.busy('Registrando conclusão',['Conferindo pendências','Registrando a decisão','Atualizando o acompanhamento'],()=>{
      S().flags.lcPriorStatus='Concluída'; S().flags.documentStatus='Concluída'; H.log('Ficha concluída',V('lcCompleteNote')||'Conferência final concluída.'); setPhase('reversible-completed');H.finish('Ficha concluída','A conclusão foi registrada. O acompanhamento continua disponível até o arquivamento.');
    });
  });
  H.on('lc-complete-archive',()=>{
    if(!admin()||(S().phase==='closure-blocked'&&!S().flags.closureResolved)) return;
    S().flags.lcPriorStatus='Concluída'; S().flags.documentStatus='Concluída'; H.log('Ficha concluída',V('lcCompleteNote')||'Conferência final concluída.');
    setPhase('archive-review');
  });
  H.on('lc-resolve-arrival',()=>{
    if(H.openOperation) H.openOperation('arrival-approval',{arrivalRemainder:'short',onComplete:()=>{S().flags.closureResolved=true;S().operationOverride=null;S().phase='closure-blocked';H.render();H.toast('Chegada aprovada. A conclusão está disponível.');}});
    else H.scene('E05-18');
  });
  H.on('lc-resolve-need',()=>H.openOperation('need-review',{onComplete:()=>{S().flags.closureResolved=true;S().modal=null;S().modalClosed=false;S().phase='closure-blocked';H.render();}}));
  H.on('lc-cancel',()=>{
    if(!validReason())return;
    if(kind()==='REQ'){S().flags.lcLaterMovements=S().phase==='cancellation-with-movements';H.showModal(confirmStock);return;}
    commitCancel();
  });
  H.on('lc-apply-stock',()=>{if(kind()==='REQ'&&S().modal)commitCancel();});
  function commitCancel(){
    if(!validReason()) return;
    if(kind()==='REQ'&&!['keep','revert'].includes(V('lcStock'))) return H.error('lcStock','Escolha se o ajuste de estoque deve ser mantido ou revertido.');
    const physicalMode=S().phase==='cancel-transit'?'transit':null;
    const outcome=kind()==='REQ'?stockOutcome():S().phase==='cancel-transit'?`12 unidades retornaram ao estoque de origem; trânsito encerrado.`:'Compras e entradas físicas anteriores preservadas.';
    H.busy('Registrando cancelamento',['Conferindo os efeitos no estoque','Preservando vínculos e histórico','Registrando o cancelamento'],()=>{
      if(kind()==='REQ')applyReqCancellation();else if(physicalMode)applyPhysicalCancellation(physicalMode);
      H.log('Ficha cancelada',`${V('lcReason')} ${outcome}`); S().flags.lcPriorStatus='Cancelada'; S().flags.documentStatus='Cancelada'; S().flags.lcCancellationEffect=outcome; setPhase('reversible-cancelled');H.finish('Ficha cancelada',outcome);
    });
  }
  H.on('lc-request-consent',()=>{
    if(!validReason()) return;
    H.busy('Enviando pedido de cancelamento',['Conferindo o recebimento','Registrando o pedido','Avisando o recebedor original'],()=>{

  /* A small valid PDF, produced without network or dependencies. The archive snapshot
     is cached once; final confirmation never regenerates those bytes. */
  function pdfText(v) {
    return String(v).replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—−]/g,'-').replace(/→/g,'>').replace(/•/g,'-').replace(/…/g,'...').replace(/[^\x20-\xFF\n]/g,'?');
  }
  function escPDF(v) {return pdfText(v).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]/g,' ');}
  function wrap(v,width=88) {
    const words=pdfText(v).split(/\s+/),out=[];let line='';
    words.forEach(w=>{if((line+' '+w).trim().length>width&&line){out.push(line);line=w;}else line=(line+' '+w).trim();});
    if(line)out.push(line);return out;
  }
  function makePDF(isArchived) {
    const title=`${code()} - ${isArchived?'Arquivada':S().flags.lcPriorStatus||'Acompanhamento'}`;
    const snapshot=`${date()} · ${isArchived?'10:25':'10:24'}`;
    const record=S().flags.issueRecord;
    const items=record?.items||['dip','fralda','luvas'].map(id=>H.catalog.find(it=>it.id===id)).filter(Boolean);
    const lines=[
      `Paciente: ${H.patient}`, `${isArchived?'Consolidação automática do sistema':'Cópia de consulta'} em: ${snapshot}`,
      `Status: ${isArchived?'Arquivada':S().flags.lcPriorStatus||'Em acompanhamento'}`,
      ...(record?[`Emitida por: ${record.author}`,`Emissão: ${record.created}`]:[]),
      '', 'MATERIAIS',...items.flatMap(it=>wrap((it.extra?'Item extra: ':'')+it.name+' | '+(it.quantity===undefined?it.code+' | ':it.quantity+' ')+it.unit)),
      ...(record?.notes?['','OBSERVAÇÕES DA EMISSÃO',...wrap(record.notes)]:[]),
      ...(record?.sources?.length?['','FICHAS DE ORIGEM',...wrap(record.sources.join(', '))]:[]),
      ...(record?.science?['','CIÊNCIA E COMUNICAÇÕES',...wrap(record.science),...(record.notices||[]).flatMap(x=>wrap(x.to+' | '+x.status))]:[]),
      '', 'REGISTROS DA FICHA',
      ...[...(H.expressScienceEvents?.()||[]),...(S().log||[])].flatMap(x=>wrap(`${x.title||'Registro'}: ${x.detail||x.text||''}`)),
      ...(S().flags.lcCancellationEffect?wrap(S().flags.lcCancellationEffect):[]),
      '', isArchived?'A versão consolidada é gerada automaticamente pelo sistema no arquivamento.':'Cópia de acompanhamento solicitada durante o período anterior ao arquivamento.',
      'Dados fictícios do laboratório.'
    ];
    const pages=[];for(let i=0;i<lines.length;i+=44)pages.push(lines.slice(i,i+44));
    const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids ['+pages.map((_,i)=>(4+i*2)+' 0 R').join(' ')+'] /Count '+pages.length+' >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'];
    pages.forEach((page,i)=>{
      let stream='0.09 0.24 0.23 rg\n0 770 595 72 re f\nBT\n1 1 1 rg /F1 14 Tf 1 0 0 1 38 804 Tm (HOME CARE ASSISTANT) Tj\n';
      stream+='/F1 11 Tf 1 0 0 1 38 781 Tm ('+escPDF(title)+') Tj\n';
      stream+='0.12 0.2 0.19 rg /F1 10 Tf 1 0 0 1 38 742 Tm 15 TL\n';
      page.forEach(l=>{stream+='('+escPDF(l)+') Tj T*\n';});
      stream+='1 0 0 1 38 32 Tm ('+(i+1)+' / '+pages.length+') Tj ET\n';
      const index=4+i*2;
      objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents '+(index+1)+' 0 R >>',`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);
    });
    let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offsets=[0];
    objs.forEach((o,i)=>{offsets.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
    const xref=out.length;
    out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('');
    out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes=Uint8Array.from(out,c=>c.charCodeAt(0)&255);
    return {bytes,generatedAt:snapshot,name:`${code()}-${isArchived?'arquivada-consolidada':'acompanhamento'}.pdf`};
  }
  function ensureFinalPDF(){if(!S().flags.lcPdf)S().flags.lcPdf=makePDF(true);return S().flags.lcPdf;}
  H.downloadLifecyclePDF=()=>{if(!archiveLocked())return;const pdf=ensureFinalPDF();H.download(pdf.name,pdf.bytes,'application/pdf');};
  H.on('lc-final-pdf',()=>{H.downloadLifecyclePDF();H.toast('PDF consolidado baixado.');});
  H.on('lc-prior-pdf',([index])=>{const p=S().flags.lcArchivedVersions?.[Number(index)];if(p)H.download(p.name,p.bytes,'application/pdf');});
  H.on('lc-live-pdf',()=>{
    if(archiveLocked())return H.toast('A ficha está arquivada. Use o download do PDF consolidado.','warning');
    H.busy('Preparando PDF',['Consolidando os registros atuais','Gerando a versão de acompanhamento'],()=>{const pdf=makePDF(false);H.download(pdf.name,pdf.bytes,'application/pdf');H.toast('PDF de acompanhamento gerado.');});
  });
})();

/* wizard-v6.js */
/* Mobile form controls shared by requisitions, purchases, deliveries and returns. */
(function (H) {

    {id:'REQ-0042',type:'REQ',time:'Hoje, 08:35',status:'Necessidades em acompanhamento',materials:['dip','fralda','luvas'],counts:{dip:8,fralda:18,luvas:24}},
    {id:'REQ-0041',type:'REQ',time:'14/11, 09:10',status:'Necessidade em aberto',materials:['dip'],counts:{dip:16}},
    {id:'COM-0028',type:'COM',time:'Hoje, 09:40',status:'Chegadas em acompanhamento',materials:['dip','fralda','luvas']},
    {id:'ENT-0019',type:'ENT',time:'Hoje, 11:15',status:'Recebimento em acompanhamento',materials:['dip','fralda','luvas']}
  ];
  const sourceKey='wizard.sources';
  const importedKey='wizard.importedSources';
  function relevant(){return seeds.filter(r=>(allowed[kind()]||[]).includes(r.type));}

    if(!supportsLinks()||['confirmation','frequent','source-picker','recipient','independent'].includes(H.state.initialVariant))return [];

  const possible=id=>relevant().filter(r=>r.materials.includes(id));
  function amounts(source,id){
    const fixed=value('wizard.originFacts.'+source.id,null);
    if(fixed && Object.hasOwn(fixed,id))return fixed[id];
    const fact=H.materialPanelFacts?.(id)||{},it=H.item(id);
    if(source.type==='REQ')return source.id==='REQ-0041'||fact.need!=='Integralmente suprida'?1:0;
    if(source.type==='COM')return Math.min(Number(fact.entered)||0,H.stock(id,'family'));

  function links(id,ids=importedIds()){
    const added=value('wizard.added.'+id,[]),excluded=value('wizard.excluded.'+id,[]);

  }

    return '<label class="w6-source-choice"><input type="checkbox" data-model="'+e(data)+'"'+(active?' checked':'')+'><span><strong>'+e(titleText)+'</strong><small>'+e(hint)+'</small></span></label>';
  }

      (selected.length?importedIds().length?'Materiais elegíveis trazidos das fichas de origem.':'Vínculo geral, sem importar materiais.':'Vincule uma origem se ela fizer parte deste registro.')+

 $('lab-nav').innerHTML=`<div class="nav-head"><h2>O que você quer avaliar?</h2><p>Abra uma tela ou um estado.<br>O contexto já está preparado.</p><div class="nav-search">${H.ico('search',14)}<input id="scenario-search" type="search" placeholder="Buscar tela ou código" value="${e(H.lab.query)}" aria-label="Buscar estado visual"></div><button class="nav-filter" data-lab-act="only-changes" aria-pressed="${H.lab.onlyChanges}">${H.ico('filter',14)}Com observações na v6</button></div><div class="scenario-scroll">${H.groups.map(g=>{
 const scenarios=H.scenarios.filter(x=>x.group===g.id&&(!H.lab.onlyChanges||H.lastReviews.some(r=>r.scenario===x.id && (r.state==='adjust'||String(r.text||'').trim()&&!/^aprovado[.!]?$/i.test(String(r.text||'').trim()))))&&(!query||(x.id+' '+x.title+' '+x.kind).toLowerCase().includes(query)));if(!scenarios.length)return'';
 const open=H.lab.groupOpen[g.id]||!!query;
 return `<section class="scenario-group"><button class="group-toggle" data-lab-act="group:${g.id}" aria-expanded="${!!open}">${H.ico(g.icon,14)}<span>${e(g.label)}</span><small>${scenarios.length}</small></button>${open?scenarios.map(sc=>`<button class="scenario-link${sc.id===H.state.baseId?' active':''}" data-lab-act="scene:${sc.id}"${sc.id===H.state.baseId?' aria-current="page"':''}><span class="review-dot ${reviewState(sc.id)}"></span><span><small>${sc.id} · ${sc.kind}</small><strong>${e(sc.label)}</strong></span></button>`).join(''):''}</section>`;
 }).join('')||'<p class="lab-empty">Nenhum estado encontrado.</p>'}</div><div class="nav-foot"><span>56 referências · 7 famílias</span><button class="lab-btn icon-only" data-lab-act="scope" aria-label="Ver decisões e escopo">${H.ico('info',14)}</button></div>`;
}
function renderControls(){const base=H.scenarios.find(s=>s.id===H.state.baseId),s=H.state.scene;
 const canKind=['wizard','document'].includes(s.renderer)||(s.renderer==='state'&&H.state.initialVariant==='draft');
 $('scene-controls').innerHTML=`<div class="scene-label"><div><span class="scene-code">${e(base.id)}</span><strong>${e(base.title)}</strong></div><p>${e(base.focus)}</p></div><div class="state-pick">${canKind?`<label for="kind-select" class="sr-only">Tipo de ficha</label><select id="kind-select" class="kind-select" aria-label="Tipo de ficha">${['REQ','COM','ENT','DEV'].map(k=>`<option${k===s.kind?' selected':''}>${k}</option>`).join('')}</select>`:''}<label for="variant-select">Abrir estado</label><select id="variant-select">${base.variants.map(v=>`<option value="${e(v.value)}"${v.value===H.state.initialVariant?' selected':''}>${e(v.label)}</option>`).join('')}</select>${['simple-loading','loading'].includes(H.state.phase)?`<button class="lab-btn" data-lab-act="finish-loading">Concluir simulação</button>`:''}</div>`;
 $('device-frame').classList.toggle('mobile',H.lab.mobile);
}
function reviewKey(){return H.state.baseId+'::'+H.state.phase+'::'+H.state.scene.kind;}
function renderReview(){
 const container=$('review-root');if(!H.lab.reviewOpen){container.innerHTML='';return;}
 const sc=H.scenarios.find(x=>x.id===H.state.baseId),key=reviewKey(),r=H.reviews[key]||{},prior=H.previousV5.concat(H.priorReviews).filter(x=>x.scenario===sc.id);
 container.innerHTML=`<div class="review-shade" data-lab-act="review-close"></div><aside class="review-panel" aria-label="Sua revisão"><header class="review-head"><h2>Sua revisão visual</h2><button class="lab-btn icon-only" data-lab-act="review-close" aria-label="Fechar revisão">${H.ico('close',16)}</button></header><div class="review-body"><span class="scene-code">${sc.id} · ${e(H.state.scene.kind)}</span><h3 style="margin-top:10px">${e(sc.title)}</h3><p>Estado: <strong>${e(sc.variants.find(v=>v.value===H.state.phase)?.label||H.scenarios.flatMap(x=>x.variants).find(v=>v.value===H.state.phase)?.label||'Resultado da ação nesta ficha')}</strong></p><div class="review-status">${[['adjust','Precisa de ajustes'],['approved','Aprovado'],['comment','Comentário']].map(([v,t])=>`<button class="lab-btn${r.state===v?' selected':''}" data-lab-act="review-state:${v}">${t}</button>`).join('')}</div><label for="review-text" class="sr-only">Comentários sobre esta aparência</label><textarea id="review-text" placeholder="Descreva o que ajustar na aparência, nas mensagens ou na interação desta tela.">${e(r.text||'')}</textarea><p class="tiny">A revisão é salva neste navegador. Exporte o arquivo para me enviar seus comentários.</p><button class="lab-btn" data-lab-act="review-clear">Limpar esta avaliação</button><details><summary>Contexto preparado deste exemplo</summary><p>${e(sc.context)}</p><p>Você pode trocar o estado acima sem repetir a jornada. Reiniciar limpa apenas os dados deste exemplo.</p></details><details class="recent-feedback"><summary>Sua avaliação na v6 (${H.lastReviews.filter(p=>p.scenario===sc.id).length})</summary>${H.lastReviews.filter(p=>p.scenario===sc.id).map(p=>`<div class="prior-comment"><strong>${e(({adjust:'Pediu ajustes',approved:'Aprovou',comment:'Comentou'})[p.state])} · ${e(sc.variants.find(v=>v.value===p.variant)?.label||(p.variant==='receipt-confirm'?'Confirmação do recebimento':p.variant))}</strong>${p.text?`<p>${e(p.text)}</p>`:''}</div>`).join('')}</details><details><summary>Comentários anteriores (v4 e v5)</summary>${prior.map(p=>`<div class="prior-comment">${e(p.text)}</div>`).join('')||'<p>Sem comentário anterior para esta referência.</p>'}</details></div><footer class="review-foot"><span id="review-save-status">Salvo neste navegador</span><button class="lab-btn primary" data-lab-act="export">${H.ico('download',14)}Exportar revisão</button></footer></aside>`;
}
function scopeDialog(){
 $('scope-root').innerHTML=H.lab.scopeOpen?`<div class="lab-modal-wrap"><section class="scope-modal" role="dialog" aria-modal="true" aria-labelledby="scope-title"><div style="display:flex;align-items:center;justify-content:space-between;gap:15px"><h2 id="scope-title">Decisões e alcance da v7</h2><button class="lab-btn icon-only" data-lab-act="scope-close" aria-label="Fechar">${H.ico('close',17)}</button></div><p>Este laboratório usa dados fictícios e não se conecta ao banco, ao repositório ou ao ambiente publicado. A aprovação é da aparência demonstrada e de suas interações. Não implica que as mudanças já foram implementadas no sistema.</p>${H.l1ScopeHtml()}<h3>Decisões consolidadas</h3><ol>${H.decisions.map(x=>`<li><strong>${e(x.title)}.</strong> ${e(x.text)}</li>`).join('')}</ol><h3>Impactos entre os lotes</h3><table><thead><tr><th>Origem</th><th>Superfície</th><th>Tratamento</th></tr></thead><tbody>${H.scope.map(x=>`<tr><td>${e(x.lot)}<br><small>${e(x.mode)}</small></td><td>${e(x.surface)}</td><td>${e(x.decision)}</td></tr>`).join('')}</tbody></table><h3>Parâmetros dos exemplos</h3><p>O prazo de arquivamento de <strong>7 dias</strong> é apenas a política ilustrativa carregada nestes estados. A configuração completa fica para L4. No cancelamento da REQ, a reversão desfaz o ajuste daquela emissão e preserva ENT e consumos posteriores.</p><p>O desenho dos estados desta v7 é uma <strong>proposta para sua avaliação</strong>. As 140 avaliações da v6 e as revisões anteriores continuam consultáveis, mas não viram aprovação automática desta versão.</p><div style="display:flex;justify-content:flex-end;margin-top:22px"><button class="lab-btn primary" data-lab-act="scope-close">Voltar ao laboratório</button></div></section></div>`:'';
}
H.render=function(reset=false){
 const active=document.activeElement,model=active?.dataset?.model,selection=model&&typeof active.selectionStart==='number'?[active.selectionStart,active.selectionEnd]:null;
 const oldScroll=document.querySelector('.product-scroll')?.scrollTop||0;
 const oldDialogScroll=document.querySelector('.product-dialog:not(.product-sheet) .dialog-body')?.scrollTop||0;
 const oldSheetScroll=document.querySelector('.product-sheet .dialog-body')?.scrollTop||0;
 const navScroll=document.querySelector('.scenario-scroll')?.scrollTop||0;
 const hadDialog=!!document.querySelector('.product-dialog');
 renderLabBar();renderNav();renderControls();
 $('product-app').innerHTML=renderContent();
 if(H.state.baseId==='E04-15'&&['family-kept','source-changed'].includes(H.state.phase)&&document.querySelector('.signal-dialog'))save(decisionKey(),true);
 renderReview();scopeDialog();
 const ps=document.querySelector('.product-scroll');if(ps)ps.scrollTop=reset?0:oldScroll;
 const ds=document.querySelector('.product-dialog:not(.product-sheet) .dialog-body');if(ds)ds.scrollTop=reset?0:oldDialogScroll;
 const ss=document.querySelector('.product-sheet .dialog-body');if(ss)ss.scrollTop=reset?0:oldSheetScroll;
 const ns=document.querySelector('.scenario-scroll');if(ns)ns.scrollTop=navScroll;
 if(model&&!reset){const replacement=document.querySelector('[data-model="'+CSS.escape(model)+'"]');if(replacement){replacement.focus({preventScroll:true});if(selection&&replacement.setSelectionRange)try{replacement.setSelectionRange(...selection);}catch(_){}}}
 else if(!hadDialog||reset){const dlg=document.querySelector('.product-sheet')||document.querySelector('.product-dialog');if(dlg)dlg.focus({preventScroll:true});}
};
H.exportReviews=()=>{
 const list=Object.values(H.reviews).filter(r=>r.state||String(r.text||'').trim());
 const data={format:'hca-visual-lab-review',version:H.version,exportedAt:new Date().toISOString(),baselineVersion:'L02 · v6 com as 140 avaliações em celular',viewport:'celular',method:'Revisão de estados preparados em celular.',approvedDecisions:H.decisions,impactMap:H.scope,coverage:H.scenarios.map(s=>({id:s.id,group:s.group,title:s.title,kind:s.kind,renderer:s.renderer,variants:s.variants})),reviews:list,priorReviews:H.lastReviews,earlierReviewsV5:H.previousV5,earlierReviewsV4:H.priorReviews,l1Reference:H.l1Reference};
 H.download('hca-l02-v7-comentarios.json',JSON.stringify(data,null,2),'application/json');H.labToast(list.length+' registros de revisão exportados.');
};
function saveReview(part){const key=reviewKey(),prior=H.reviews[key]||{};H.reviews[key]={...prior,scenario:H.state.baseId,title:H.scenarios.find(x=>x.id===H.state.baseId).title,variant:H.state.phase,entryState:H.state.initialVariant,kind:H.state.scene.kind,actor:H.state.actor,view:H.state.scene.renderer,currentPhase:H.state.phase,viewport:'celular',...part,at:new Date().toISOString(),version:H.version};const okay=save('reviews',H.reviews);const el=$('review-save-status');if(el)el.textContent=okay?'Salvo agora':'Exporte para guardar este comentário';}
function labAction(action){
 const [a,...p]=action.split(':');
 if(a==='only-changes'){H.lab.onlyChanges=!H.lab.onlyChanges;return renderNav();}
 if(a==='nav'){H.lab.navOpen=!H.lab.navOpen;return H.render();}
 if(a==='group'){H.lab.groupOpen={[p[0]]:!H.lab.groupOpen[p[0]]};return renderNav();}
 if(a==='scene')return H.scene(p[0],undefined,{prepared:true});
 if(a==='reset'){const base=H.state.baseId,k=H.state.scene.kind,v=H.state.initialVariant;if(base==='E04-15')save(decisionKey(),false);H.scene(base,v,{kind:k});return H.labToast('Exemplo reiniciado. Seus comentários foram preservados.');}
 
 if(a==='review'){H.lab.reviewOpen=true;renderReview();return;}
 if(a==='review-close'){H.lab.reviewOpen=false;renderReview();return;}
 if(a==='review-state'){saveReview({state:p[0]});renderReview();renderNav();renderLabBar();return;}
 if(a==='review-clear'){delete H.reviews[reviewKey()];save('reviews',H.reviews);renderReview();renderNav();renderLabBar();return;}
 if(a==='export')return H.exportReviews();
 if(a==='scope'){H.lab.scopeOpen=true;scopeDialog();return;}
 if(a==='scope-close'){H.lab.scopeOpen=false;scopeDialog();return;}
 if(a==='finish-loading'){clearTimeout(H.loadingDemoTimer);H.state.loading=null;if(H.state.phase==='simple-loading'){return H.actions['state-consult']([]);}return H.state.baseId==='E06-05'?H.recoverIssue(H.state.scene.kind):H.issueSuccess(H.state.scene.kind);}
}
H.on('close',()=>{if(H.state.baseId==='E04-15'&&!H.state.flags.familyDecisionSeen&&['source-changed','family-kept'].includes(H.state.phase))return H.actions['v7-family-seen']([]);
 if(H.state.modal)return H.closeModal();if(H.state.operationOverride||H.state.scene.renderer==='operations')return H.actions['op-close']([]);if(H.state.scene.renderer==='lifecycle')return H.actions['lc-close']([]);H.closeModal();});H.on('sheet-close',()=>H.closeSheet());
H.on('context',([name])=>H.labToast(name+': contexto de outro lote. A tela completa de L1 permanece como aprovada.'));
document.addEventListener('click',event=>{
 const lab=event.target.closest('[data-lab-act]');if(lab){event.preventDefault();return labAction(lab.dataset.labAct);}
 const button=event.target.closest('[data-act]');if(!button||button.disabled)return;
 event.preventDefault();if(H.state.loading&&!H.state.loading.manual)return;
 const [name,...payload]=button.dataset.act.split(':');
 if(button.closest('.fab-actions')&&name!=='doc-menu')H.state.flags.menuOpen=false;
 if(H.actions[name]){H.state.errors={};try{H.actions[name](payload,event);}catch(err){console.error(err);H.labToast('Esta interação não foi concluída. Seus comentários foram preservados.');}}
 else {console.warn('Unregistered action',name);H.labToast('Ação de contexto: '+name);}
});
document.addEventListener('input',event=>{
 const target=event.target;
 if(target.id==='scenario-search'){const pos=target.selectionStart;H.lab.query=target.value;renderNav();const t=$('scenario-search');t.focus();try{t.setSelectionRange(pos,pos);}catch(_){}return;}
 if(target.id==='review-text'){saveReview({text:target.value,state:H.reviews[reviewKey()]?.state||'comment'});return;}
 if(!target.dataset.model||target.type==='checkbox'||target.type==='radio')return;
 H.state.form[target.dataset.model]=target.value;
 if(H.state.errors[target.dataset.model]){delete H.state.errors[target.dataset.model];target.removeAttribute('aria-invalid');target.parentElement.querySelector('.field-error')?.remove();}
 clearTimeout(H.draftTimer);H.draftTimer=setTimeout(H.saveDraft,550);
});
// If a quantity loses focus because the next action was tapped, keep that button
// mounted through the click. Its handler reads the new value and redraws the view.
let pendingTap=false;
document.addEventListener('pointerdown',event=>{pendingTap=!!event.target.closest('button[data-act]:not(:disabled),button[data-lab-act],summary');},true);
document.addEventListener('pointerup',()=>{setTimeout(()=>{pendingTap=false;},0);},true);
document.addEventListener('pointercancel',()=>{pendingTap=false;},true);
document.addEventListener('change',event=>{
 const target=event.target;
 if(target.id==='variant-select')return H.scene(H.state.baseId,target.value,{kind:H.state.scene.kind});
 if(target.id==='kind-select')return H.scene(H.state.baseId,H.state.initialVariant,{kind:target.value});
 const key=target.dataset.model;if(!key)return;
 const value=target.type==='checkbox'?target.checked:target.value;if(target.type==='radio'&&!target.checked)return;
 H.state.form[key]=value;delete H.state.errors[key];
 H.changeHandlers.forEach(fn=>fn(key,value));
 if(target.matches('select,[type=checkbox],[type=radio]')||(!pendingTap&&(target.matches('[data-live]')||key.startsWith('count.')||key.startsWith('quantity.'))))H.render();
 H.saveDraft();
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){
  if(H.lab.scopeOpen){H.lab.scopeOpen=false;scopeDialog();return;}
  if(H.lab.reviewOpen){H.lab.reviewOpen=false;renderReview();return;}
  if(H.state.loading)return;
  if(H.state.sheet)return H.closeSheet();
  if(document.querySelector('.product-dialog'))return H.actions.close([]);
  if(H.state.flags.menuOpen){H.state.flags.menuOpen=false;H.render();}
 }
 if(event.key==='Tab'){
  const dlg=H.lab.reviewOpen?document.querySelector('.review-panel'):document.querySelector('.product-sheet')||document.querySelector('.product-dialog');
  if(!dlg)return;const focusable=Array.from(dlg.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],summary,[tabindex="0"]')).filter(el=>el.offsetParent!==null);
  if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];
  if(event.shiftKey&&(document.activeElement===first||document.activeElement===dlg)){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===dlg)){event.preventDefault();first.focus();}
 }
});
H.boot=()=>{
 const hash=location.hash.slice(1).split('/'),last=read('last',null),id=H.scenarios.some(s=>s.id===hash[0])?hash[0]:last?.id||'E04-01',variant=hash[1]||(id===last?.id?last.variant:undefined);
 if(hash[0]==='ficha'&&/^(REQ|ENT|COM|DEV|BAL)-[\d]{4}$/.test(hash[1]||'')){H.scene('E04-11','materials');H.openDocumentDirect?.(hash[1]);return;}
 const sameLast=last?.id===id&&(!hash[1]||hash[1]===last.variant);
 const reopening=!hash[0]||performance.getEntriesByType?.('navigation')[0]?.type==='reload';
 const resume=reopening&&sameLast&&last.editing;
 H.scene(id,variant,{prepared:true,checkDraft:resume||!hash[0]&&(!last||variant==='confirmation'),...(sameLast?{kind:last.kind}:{}),...(resume?{actor:last.actor}:{})});
};
window.addEventListener?.('pagehide',()=>{if(H.draftTimer)H.saveDraft();});
})(window.HCA);

window.HCA.boot();</script></body></html>
