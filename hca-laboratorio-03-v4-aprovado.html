/* Compact receipt and investigation dialogs, sized for touch. */
#product-app .product-dialog:has(.ent-surface) .dialog-head {padding:16px 17px 12px}
#product-app .product-dialog:has(.ent-surface) .dialog-head h2 {font-size:20px;line-height:1.2;letter-spacing:-.5px}
#product-app .product-dialog:has(.ent-surface) .dialog-head p {font-size:13px;line-height:1.45;margin-top:7px}
#product-app .product-dialog:has(.ent-surface) .dialog-body {background:#f4f7f5;padding:12px 13px}
#product-app .ent-surface,#product-app .ent-list {display:grid;gap:9px;min-width:0}
#product-app .ent-card {background:#fff;border:1px solid #d6e2de;border-radius:12px;padding:10px 12px;min-width:0}
#product-app .ent-item-head {display:flex;gap:6px;align-items:center;min-height:42px}
#product-app .ent-item-head>div:first-child {flex:1;min-width:0}
#product-app .ent-card h3 {margin:0;font-size:14px;line-height:1.3;letter-spacing:-.12px;font-weight:650;color:#1c3631}
#product-app .ent-item-head small,#product-app .ent-subtle {font-size:12px;color:#586c62;line-height:1.4}
#product-app .ent-card p {margin:5px 0}
#product-app .ent-menu {position:relative;margin:0;align-self:center;flex:0 0 40px;background:transparent;border:none;padding:0}
#product-app .ent-menu>summary {list-style:none;cursor:pointer;display:grid;place-items:center;width:40px;height:44px;color:#48605b;border-radius:9px}
#product-app .ent-menu>summary::-webkit-details-marker {display:none}
#product-app .ent-menu[open]>summary {background:#eaf2ef;color:#125f57}
#product-app .ent-menu>div {position:absolute;z-index:9;right:0;top:100%;padding:4px;background:#fff;box-shadow:0 5px 22px #18372e24;border:1px solid #d5e1db;border-radius:10px;width:max-content;max-width:225px}
#product-app .ent-menu .btn {display:flex;align-items:center;justify-content:flex-start;text-align:left;min-height:44px;width:100%;padding:5px 10px;font-size:13px;white-space:normal}
#product-app .ent-item-head>.btn {min-height:40px;padding:5px 10px;font-size:12px}
#product-app .ent-line,#product-app .ent-pair {display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.35}
#product-app .ent-line {padding:4px 0;min-height:44px;font-size:13px;font-weight:550}
#product-app .ent-line>.quantity-field {width:110px;max-width:45%;flex:none}
#product-app .ent-line .quantity-control {min-height:38px;height:auto;max-width:100%;gap:4px;padding:0 7px;background:#f5f9f6;border-color:#c5d7ce}
#product-app .ent-line .quantity-control input {height:38px;min-height:38px;padding:0;font-size:16px;min-width:30px}
#product-app .ent-line .quantity-control>span {font-size:11px}
#product-app .ent-pair {padding:5px 0;font-size:12px;align-items:baseline}
#product-app .ent-pair>span {color:#52685e}
#product-app .ent-pair>strong {text-align:right;color:#294338}
#product-app .ent-receipt-need .toggle-field {flex-direction:row;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;padding:0;background:none;min-height:44px;margin:0}
#product-app .ent-receipt-need .toggle-field strong {font-size:13px;font-weight:550}
#product-app .ent-receipt-need .switch {flex:none}
#product-app .ent-fold {border-top:1px solid #dfe7e2;min-width:0}
#product-app .ent-surface>.ent-fold {border:0}
#product-app .ent-fold>button {display:flex;align-items:center;gap:7px;width:100%;min-height:40px;border:0;background:transparent;padding:5px 1px;color:#426158;text-align:left;font-size:12px;font-weight:550}
#product-app .ent-fold>button span {flex:1}
#product-app .ent-fold>button[aria-expanded="true"]>svg:last-child {transform:rotate(180deg)}
#product-app .ent-fold-content {padding:0 1px 7px;display:grid;gap:4px}
#product-app .ent-change {display:inline-flex;align-items:center;gap:5px;color:#80511c;background:#fff1d9;border-radius:5px;padding:3px 6px;font-size:12px;font-weight:600;line-height:1.3}
#product-app .ent-diff-card header {display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:5px}
#product-app .ent-diff-card {padding:13px;border-color:#e4d4b7}
#product-app .ent-diff-card p {font-size:13px;color:#364c42;line-height:1.45}
#product-app .ent-diff-card .ent-quantities {display:flex;align-items:center;gap:7px;margin:10px 0 6px;font-variant-numeric:tabular-nums;color:#597063}
#product-app .ent-surface .ent-impact {display:flex;align-items:flex-start;gap:8px;margin:0;padding:9px 3px;font-size:13px;line-height:1.45;color:#405b52}
#product-app .ent-impact>svg {margin-top:2px;color:#427b6c}
#product-app .ent-need-card,#product-app .ent-review-form {display:grid;gap:10px}
#product-app .ent-need-card {padding:12px}
#product-app .ent-quote,#product-app .ent-explanation {margin:0;background:#edf5f0;border-radius:8px;padding:10px 12px;color:#244339}
#product-app .ent-quote figcaption {display:flex;align-items:center;gap:7px;font-size:12px;font-weight:550}
#product-app .ent-quote blockquote {border:none;background:none;padding:0;margin:6px 0 4px;font-style:normal;font-size:14px;line-height:1.45;color:#213b32}
#product-app .ent-quote small {color:#586f60;font-size:11px}
#product-app .ent-explanation strong {font-size:13px}
#product-app .ent-explanation p,#product-app .ent-record p {font-size:13px;margin:4px 0;line-height:1.45}
#product-app .ent-choice {display:flex;gap:5px;align-items:stretch;justify-content:stretch;margin:0;padding:0;border:0;min-width:0}
#product-app .ent-choice legend {padding:0;margin:0 0 6px;color:#2b4439;font-size:13px;font-weight:600}
#product-app .ent-choice button {display:flex;flex:1;align-items:center;justify-content:center;min-width:0;min-height:44px;padding:6px;border:1px solid #d0ddd5;background:white;border-radius:8px;color:#486153;font-size:13px;line-height:1.3}
#product-app .ent-choice button[aria-pressed="true"] {box-shadow:inset 0 0 0 1px #196c60;border-color:#196c60;color:#125b51;background:#e9f4ec;font-weight:650}
#product-app .ent-surface .field {gap:4px;margin:0}
#product-app .ent-surface .field-label {color:#344d40;font-size:13px}
#product-app .ent-surface textarea {min-height:58px}
#product-app .ent-ledger>.ent-line+.ent-line {border-top:1px solid #e7ece8}
#product-app .ent-balance {border-top:1px solid #dbc9a6;margin-top:3px;padding:10px 0 0;display:flex;gap:8px;justify-content:space-between;align-items:center;color:#795222;font-size:13px}
#product-app .ent-balance.invalid {color:#992f40}
#product-app .ent-record b {font-size:12px}
#product-app .ent-review-form {background:#fff;border-radius:12px;border:1px solid #d6e2de;padding:12px}
#product-app .op7-reconcile>.ent-item-head{min-height:43px}
#product-app .op7-reconcile>.ent-change{margin:2px 0 7px}
#product-app .op7-reconcile-fields{display:grid;gap:11px;border-top:1px solid #e4ebe5;padding-top:11px;margin-top:3px}
#product-app .op7-reconcile-fields .toggle-field{margin:0}
#product-app .op7-reconcile>.btn{display:block;width:100%;line-height:1.3}
#product-app .op7-shipment-note{background:#f1f5f3;padding:8px 10px;border-radius:7px;font-size:12px;color:#3c574d}
#product-app .op7-shipment-note strong{color:#334a41}
#product-app .op7-person{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid #d8e4de;border-radius:10px;padding:9px 10px;background:#fff;margin-bottom:7px}
#product-app .op7-person[aria-pressed=true]{background:#f1f8f4;border-color:#72a997}
#product-app .op7-initials{width:35px;height:35px;display:grid;place-items:center;flex:none;border:1px solid #cfe1d6;background:#e7f2eb;color:#246655;border-radius:10px;font-size:12px;font-weight:650}
#product-app .op7-person-copy{flex:1;display:grid;justify-items:start;gap:3px;font-size:13px;color:#233e33}
#product-app .op7-duty{display:inline-flex;align-items:center;gap:5px;color:#53695e;font-size:11px}
#product-app .op7-duty.current{color:#166451;font-weight:600}
#product-app .op7-choice{width:19px;height:19px;display:grid;place-items:center;border-radius:50%;border:1px solid #b4cbc0}
#product-app .op7-person[aria-pressed=true] .op7-choice{color:#fff;background:#216e5f;border-color:#216e5f}
#product-app .ent-card:has(.ent-ledger){padding:12px 14px}
#product-app .ent-ledger .ent-pair:nth-child(2n+1){background:#f4f7f5;border-radius:6px}
#product-app .ent-ledger .ent-pair{padding:7px 8px}
#product-app .ent-balance{background:#fff6e3;padding:8px 9px;border:0;border-radius:7px;margin-top:8px}

#product-app .doc-view .page-heading{position:relative;display:flex;flex-direction:row;align-items:flex-start;justify-content:space-between;gap:10px}
#product-app .doc-view .page-heading .heading-tools{align-self:flex-start;margin:0}
#product-app .v7-quick{position:relative}
#product-app .v7-quick>.btn{min-width:40px;min-height:38px;border:1px solid #d4e2da;background:white;border-radius:10px}
#product-app .v7-menu-outside{position:fixed;z-index:25;inset:0;border:none;background:transparent}
#product-app .v7-menu{position:absolute;z-index:35;top:calc(100% + 5px);right:0;width:207px;max-width:75vw;padding:5px;border-radius:12px;border:1px solid #cddcd2;box-shadow:0 8px 24px #18312624;background:white}
#product-app .v7-menu>.btn{display:flex;justify-content:flex-start;min-height:39px;width:100%;padding:8px 10px;font-size:12px;text-align:left}
#product-app .v7-panel-back{display:flex;align-items:center;gap:5px;background:transparent;border:0;color:#2d695b;font-size:12px;font-weight:600;padding:4px 0;margin-bottom:9px}
#product-app .section-body:has(>.material-filter){padding:0}
#product-app .v7-materials{display:grid}
#product-app .v7-material{display:grid;width:100%;border:0;border-bottom:1px solid #e3eae6;background:#fff;padding:12px 15px 13px;text-align:left;row-gap:4px;color:#25483b}
#product-app .v7-material:last-child{border-bottom:none}
#product-app .v7-material.urgent{background:#fdf6f5;box-shadow:inset 3px 0 #c38186}
#product-app .v7-material:active{background:#eff6f1}
#product-app .v7-material-title{display:flex;gap:7px;align-items:center;min-width:0}
#product-app .v7-material-title>strong{color:#243d32;font-size:14px;font-weight:650;line-height:1.3;letter-spacing:-.15px}
#product-app .v7-material-title>.badge{font-size:10px;line-height:1.2;flex-shrink:0;max-width:112px;white-space:normal;overflow-wrap:break-word}
#product-app .v7-material-title>svg{margin-left:auto;color:#739084;flex:none}
#product-app .v7-unit{font-size:10px;color:#697e70}
#product-app .v7-material-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px;margin-top:4px;font-variant-numeric:tabular-nums}
#product-app .v7-material-facts>span{display:flex;justify-content:space-between;align-items:baseline;gap:5px;min-width:0}
#product-app .v7-material-facts small{font-size:10px;color:#637469}
#product-app .v7-material-facts b{font-size:12px;font-weight:650;white-space:nowrap}
#product-app .v7-status-actions{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:16px}
#product-app .v7-status-actions .btn{min-height:37px;font-size:12px;padding:5px 9px}
#product-app .v7-stock-choice{display:grid;gap:10px}
#product-app .v7-stock-option{display:flex;align-items:center;gap:10px;border:1px solid #d7e3d9;border-radius:12px;padding:11px 12px}
#product-app .v7-stock-option:has(:checked){background:#edf6ef;border-color:#74a897}
#product-app .v7-stock-option input{accent-color:#247768}
#product-app .v7-stock-option>span{display:grid;gap:3px}
#product-app .v7-stock-option small{font-size:10px;color:#667c70}
#product-app .v7-stock-option b{display:flex;align-items:center;gap:6px;font-size:13px;color:#37564a}
#product-app .v7-stock-option strong{font-size:13px}
#product-app .v7-feed-filter{display:flex;gap:4px;padding:3px;margin-bottom:13px;background:#edf4ee;border-radius:10px}
#product-app .v7-feed-filter button{flex:1;border:0;border-radius:7px;background:transparent;font-size:12px;min-height:32px;color:#526c5b}
#product-app .v7-feed-filter button[aria-pressed=true]{background:white;color:#255943;font-weight:650;box-shadow:0 1px 5px #183b2715}
#product-app .v7-issued-notes{white-space:pre-line}

#product-app .v7-activity{inset:0;display:flex;padding:20px;align-items:center;justify-content:center;overflow:auto;background:#173b3a61;backdrop-filter:blur(5px)}
#product-app .l1-activity-card{position:relative;width:min(376px,100%);border:1px solid #e5ece6;border-radius:18px;padding:29px 23px;background:#fff;box-shadow:0 24px 90px #143c3835;text-align:center;outline:none;margin:auto}
#product-app .l1-activity-card.dynamic{width:min(420px,100%)}
#product-app .l1-activity-card h2{font-size:19px;letter-spacing:-.5px;margin:17px 0 9px;line-height:1.3}
#product-app .l1-activity-card p{font-size:12px;line-height:1.65;color:var(--muted);max-width:305px;margin:auto}
#product-app .l1-activity-card .activity-spinner{width:67px;height:67px;display:grid;place-items:center;margin:0 auto 20px;position:relative;color:var(--primary);background:#f3f8f4;border-radius:50%}
#product-app .activity-spinner>span{position:absolute;inset:-3px;border:2px solid #dbe9e0;border-top-color:var(--primary);border-radius:50%;animation:v7-spin 1s linear infinite}
#product-app .activity-kicker{display:block;font-size:9px;font-weight:650;letter-spacing:.9px;color:#698779;margin-top:26px}
#product-app .connection-animation{height:64px;display:flex;justify-content:center;align-items:center;gap:15px;color:var(--primary)}
#product-app .connection-animation>span{height:57px;width:57px;display:grid;place-items:center;border-radius:17px;background:#ecf5ef;border:1px solid #dcebe1;animation:v7-pulse 2.4s ease-in-out infinite}
#product-app .connection-animation>span:last-child{background:#dfeee5;animation-delay:.7s}
#product-app .connection-animation>i{width:43px;height:2px;background:linear-gradient(90deg,#d1e4d7,var(--primary),#d1e4d7);background-size:200% 100%;animation:v7-sweep 1.5s infinite}
#product-app .activity-steps{list-style:none;padding:0;margin:25px 0 0;text-align:left;display:grid;gap:14px}
#product-app .activity-steps li{display:flex;align-items:center;gap:11px;font-size:12px;color:#617471}
#product-app .activity-steps li>span{height:24px;width:24px;display:grid;place-items:center;border-radius:50%;background:#f0f3f0;font-size:10px;flex:none}
#product-app .activity-steps .current{color:var(--ink);font-weight:600}
#product-app .activity-steps .current>span,#product-app .activity-steps .done>span{background:#e4f1e8;color:var(--primary)}
#product-app .activity-steps .done{color:#527761}
#product-app .activity-steps .spinner{height:12px;width:12px;border:1.6px solid #b6c9bd;border-top-color:var(--primary);border-radius:50%;animation:v7-spin 1s linear infinite}
@keyframes v7-spin{to{transform:rotate(360deg)}}@keyframes v7-pulse{50%{transform:translateY(-2px)}}@keyframes v7-sweep{to{background-position:200% 0}}
#product-app .v7-result-dialog{max-width:375px;border-radius:18px}
#product-app .v7-result-dialog .dialog-head{position:absolute;top:8px;right:8px;border:0;background:transparent;z-index:1;padding:0}
#product-app .v7-result-dialog .dialog-body{padding:22px 19px 16px}
#product-app .v7-result{text-align:center}
#product-app .v7-result h2{font-size:21px;letter-spacing:-.6px;line-height:1.2;margin:14px 0 6px}
#product-app .v7-result p{font-size:13px;color:#576d64;line-height:1.5}
#product-app .v7-medallion{background:#fff;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto;color:#14724c;box-shadow:0 0 0 6px #eaf5ef,inset 0 0 0 1px #c9e6d4,0 3px 9px #32523a20;animation:v7-coin .62s cubic-bezier(.23,.7,.2,1) both}
#product-app .v7-medallion.failure{color:#b34150;box-shadow:0 0 0 6px #fbefef,inset 0 0 0 1px #f0d0d4}
#product-app .v7-medallion.warning{color:#8e6116;box-shadow:0 0 0 6px #fbf3e4,inset 0 0 0 1px #e6d3b0}
@keyframes v7-coin{0%{transform:perspective(350px) rotateY(-180deg) scale(.7)}60%{transform:perspective(350px) rotateY(0) scale(1.15)}100%{transform:perspective(350px) rotateY(0) scale(1)}}
#product-app .v7-result-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}
#product-app .v7-result-actions .btn:last-child{grid-column:1/-1}
#product-app .v7-result-detail{padding-top:12px}
#product-app .v7-saved,#product-app .v7-limit{display:flex;gap:9px;padding:10px 11px;margin-top:13px;background:#f0f6f1;border-radius:9px;font-size:12px;color:#3d6054}
#product-app .v7-saved svg{flex:none;margin-top:1px}
#product-app .v7-limit{background:#fff4df;color:#785920}
#product-app .v7-support{margin-top:12px;border-top:1px solid #e2e8e4;padding-top:5px}
#product-app .v7-support summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:39px;color:#456659;font-size:12px;font-weight:600;cursor:pointer}
#product-app .v7-support summary::-webkit-details-marker{display:none}
#product-app .v7-support summary svg:last-child{margin-left:auto}
#product-app .v7-support[open] summary svg:last-child{transform:rotate(180deg)}
#product-app .v7-support p{font-size:12px;margin:5px 0}
#product-app .v7-support pre{padding:10px;border-radius:8px;background:#f1f5f2;font:11px/1.4 monospace;white-space:pre-wrap;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){#product-app .v7-activity *,#product-app .v7-medallion{animation:none!important}}


/* L3: notebook review workspace; only the product canvas uses a phone viewport. */
html,body{width:100%;max-width:none;height:100%;min-height:0;margin:0;transform:none;background:#edf2f0;box-shadow:none;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#223c35}
button,input,textarea,select{font:inherit}
.lab-bar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:18px;background:#fff;border-bottom:1px solid #d7e1dc}
.lab-brand{display:flex;align-items:center;gap:12px}.lab-brand strong{font-size:17px;letter-spacing:-.4px;white-space:nowrap}.lab-brand small{display:block!important;font-size:12px;color:#6b7b75;margin-top:3px}
.lab-logo{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:11px;background:#e9f2ec;color:#24664f;font-size:11px;font-weight:750;letter-spacing:.5px}
.lab-top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}.lab-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 12px;border:1px solid #d6e1da;border-radius:9px;background:white;color:#36594b;font-size:12px;font-weight:600;cursor:pointer}.lab-btn:hover{background:#f0f6f2}.lab-btn.primary{background:#1b6856;color:#fff;border-color:#1b6856}.lab-btn.primary:hover{background:#175745}.lab-btn.icon-only{width:36px;min-width:36px;padding:6px}.lab-btn b{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#e5f0e8;font-size:11px;color:#275844}
.lab-layout{display:grid;grid-template-columns:256px minmax(440px,1fr);height:calc(100dvh - 68px);min-height:0;position:relative}
.lab-layout.has-review{grid-template-columns:256px minmax(440px,1fr) 330px}
.lab-layout.nav-collapsed{grid-template-columns:0 minmax(440px,1fr)}
.lab-layout.nav-collapsed.has-review{grid-template-columns:0 minmax(440px,1fr) 330px}
.lab-layout.nav-collapsed #lab-nav{display:none}
.lab-nav{position:relative;inset:auto;width:auto;flex-basis:auto;min-width:0;display:flex;flex-direction:column;border-right:1px solid #d7e2dc;background:#f9fbfa;overflow:hidden;box-shadow:none}
.nav-head{padding:23px 17px 17px;border-bottom:1px solid #e0e8e2}.nav-head .eyebrow{font-size:10px;letter-spacing:.7px;color:#5d7c6a}.nav-head h2{font-size:16px;line-height:1.3;letter-spacing:-.3px;margin:7px 0 14px}
.lab-search{display:flex;align-items:center;gap:7px;background:white;border:1px solid #d5e1d8;border-radius:8px;padding:0 9px;min-height:36px;color:#6c8575}.lab-search input{min-width:0;width:100%;border:none;background:none;font-size:12px;outline:none;color:#294f3c}
.lab-select{border:1px solid #cfded3;border-radius:8px;background:#fff;color:#294e40;padding:8px 26px 8px 9px;min-height:36px;max-width:100%;font-size:12px}
#review-filter{width:100%;margin-top:8px;font-size:12px;min-height:33px}
.scenario-scroll{flex:1;min-height:0;overflow:auto;padding:8px 10px 16px;scrollbar-width:thin}
.nav-group{padding:0;margin:8px 0 17px}.nav-group h3{display:flex;align-items:center;gap:7px;font-size:12px;color:#3c6352;padding:8px 5px;margin:0 0 4px}.nav-group h3 small{margin-left:auto;font-size:10px;color:#72877b}

/* L3 v2 — finish the shared L2 v7 components; retain their visual identity. */

/* Keep the three review areas independent from the product viewport. */
.lab-layout,.lab-stage,.stage-pad,#review-root,.review-panel,.review-body,
.scenario-scroll,.device-frame,#product-app{min-width:0;min-height:0}
.scenario-scroll,.review-body{overscroll-behavior-y:contain;scrollbar-gutter:stable}
.stage-pad{overflow:hidden}
.device-frame{isolation:isolate}
#product-app .product-scroll{overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;scroll-padding-block:18px}
#product-app .product-scroll,#product-app .dialog-body{scrollbar-width:thin;scrollbar-color:#b9cec4 transparent}

/* Type and spacing use one scale in stock, consumption, BAL and documents. */
#product-app{font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
#product-app .page-heading{margin-bottom:22px}
#product-app .page-heading>div:first-child{min-width:0;flex:1}
#product-app .page-heading h1{font-size:26px;line-height:1.18;letter-spacing:-.7px;color:var(--ink)}
#product-app .page-heading p{font-size:14px;line-height:1.6;color:var(--muted);margin-top:8px}
#product-app .page-heading .eyebrow{font-size:10px;letter-spacing:.7px;color:var(--muted)}
#product-app .page-heading .heading-tools{align-items:flex-start;gap:7px}
#product-app .section{border-color:var(--line);border-radius:var(--radius);box-shadow:0 2px 8px #173b3a03}
#product-app .section-head{padding:17px 16px;gap:12px}
#product-app .section-head>div{min-width:0}
#product-app .section-head h2{font-size:15px;line-height:1.45;font-weight:650;color:var(--ink)}
#product-app .section-head p{font-size:12px;line-height:1.55;color:var(--muted);margin-top:5px}
#product-app .section-body{padding:17px 16px}
#product-app .section-head svg,#product-app .row-icon{color:var(--primary)}
#product-app .row-icon{background:var(--tint)}
#product-app svg{flex-shrink:0}
#product-app .summary-main{min-width:0}
#product-app .summary-main>strong,#product-app .summary-main>.text-link{font-size:14px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
#product-app .summary-main>small{font-size:12px;line-height:1.55;color:var(--muted)}
#product-app .summary-row{gap:11px;padding-block:15px}
#product-app .row-end{font-size:13px;line-height:1.5;min-width:0}
#product-app .badge{font-size:11px;line-height:1.4;padding:4px 8px;white-space:normal;max-width:100%;overflow-wrap:anywhere}
#product-app .metadata{gap:16px 14px}
#product-app .metadata dt{font-size:12px;line-height:1.45;color:var(--muted)}
#product-app .metadata dd{font-size:14px;line-height:1.5;color:var(--ink);margin-top:5px;font-variant-numeric:tabular-nums}
#product-app .metadata>div{min-width:0}
#product-app .facts small,#product-app .facts span{font-size:12px;line-height:1.45;color:var(--muted)}
#product-app .facts strong{color:var(--ink);font-variant-numeric:tabular-nums}
#product-app .changed-fact{gap:10px;flex-wrap:wrap}
#product-app .changed-fact>span{font-size:14px;line-height:1.5;color:var(--ink)}
#product-app .changed-fact small{font-size:12px;color:var(--muted)}

/* Shared fields and actions keep enough room for complete labels. */
#product-app .field-label{font-size:14px!important;line-height:1.45;color:var(--ink)}
#product-app .field>.input{font-size:16px!important;min-height:44px;max-width:100%;min-width:0;border-color:var(--line);border-radius:8px}
#product-app .field>.help,#product-app .field-error{font-size:12px;line-height:1.6}
#product-app textarea.input{min-height:104px;line-height:1.6}
#product-app .input{max-width:100%;min-width:0}
#product-app .input:focus-visible{outline:2px solid #7ba99c;outline-offset:2px}
#product-app .btn{font-size:14px;min-height:43px;min-width:0;line-height:1.35;padding:10px 12px;gap:7px;border-radius:8px;white-space:normal}
#product-app .btn>span{min-width:0;overflow-wrap:anywhere}
#product-app .btn-small{font-size:12px;min-height:36px;padding:7px 10px}
#product-app .btn-icon{width:38px;min-width:38px;min-height:38px;padding:8px;flex:none}
#product-app .btn-ghost{color:var(--primary)}
#product-app .btn-danger{background:var(--danger);border-color:var(--danger)}
#product-app .btn:focus-visible,#product-app [data-act]:focus-visible{outline:2px solid #7ba99c;outline-offset:3px}
#product-app .l3-action-footer{background:#fbfcfb;border-color:var(--line);border-radius:11px;padding:13px;margin-top:20px}
#product-app .l3-footer-main{align-items:stretch;flex-wrap:wrap;gap:10px}
#product-app .l3-footer-main>div{min-width:0;gap:8px}
#product-app .l3-footer-main>div:first-child:empty{display:none}
#product-app .l3-footer-main>div:last-child{margin-left:auto;justify-content:flex-end}
#product-app .l3-action-footer .autosave{font-size:11px;color:var(--muted);line-height:1.5;margin-top:11px}

/* Notices carry a clear title and readable explanation without a new card style. */
#product-app .notice{gap:10px;padding:14px;border-radius:10px;margin:16px 0;font-size:14px}
#product-app .notice>svg{width:19px;height:19px;margin-top:2px}
#product-app .notice>div{min-width:0}
#product-app .notice strong{font-size:14px;line-height:1.45}
#product-app .notice p{font-size:13px;line-height:1.6;margin-top:5px}
#product-app .notice-actions .btn{font-size:12px;min-height:36px;padding:7px 10px}
#product-app .l3-empty{padding:32px 8px;color:var(--muted)}
#product-app .l3-empty>span{background:var(--tint);color:var(--primary)}
#product-app .l3-empty h3{font-size:18px;line-height:1.4;color:var(--ink);letter-spacing:-.3px}
#product-app .l3-empty p{font-size:14px;line-height:1.65;max-width:290px}
#product-app .l3-empty .inline{flex-wrap:wrap}
#product-app .l3-lead{font-size:14px;line-height:1.65;color:var(--muted)}
#product-app .l3-check{font-size:14px;line-height:1.55;gap:10px}
#product-app .l3-check small{font-size:12px;line-height:1.55;color:var(--muted);margin-top:4px}
#product-app .l3-check input{accent-color:var(--primary);width:18px;height:18px}
#product-app details>summary{font-size:13px;line-height:1.55;color:var(--primary)}
#product-app .l3-tabs{gap:5px;margin-bottom:18px;border-color:var(--line);padding-bottom:8px}
#product-app .l3-tabs button{font-size:13px;min-height:39px;padding:8px 11px;flex:1 0 auto;color:var(--muted)}
#product-app .l3-tabs button[aria-pressed=true]{background:var(--tint);color:var(--primary)}
#product-app .l3-tabs small{font-size:11px}
#product-app .l3-steps{padding:15px 9px;border-color:var(--line)}
#product-app .l3-steps li{font-size:11px;line-height:1.4;gap:7px;text-align:center;min-width:0}
#product-app .l3-steps li b{font-weight:500;overflow-wrap:anywhere}
#product-app .l3-steps .active{color:var(--primary)}
#product-app .l3-steps .active>span{background:var(--primary)}

/* One dialog and one detail panel, including independent scrolling and actions. */
#product-app .overlay-backdrop,#product-app .sheet-backdrop{min-height:0;min-width:0;overscroll-behavior:contain}
#product-app .overlay-backdrop{padding:12px;background:#173b3a54;backdrop-filter:blur(3px)}
#product-app .product-dialog{max-height:100%;min-height:0;min-width:0;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 64px #123d3133}
#product-app .product-sheet{height:100%;max-height:100%;width:100%;border-radius:0;border:0;box-shadow:none}
#product-app .dialog-head{padding:21px 18px 17px;gap:12px;flex:0 0 auto;align-items:flex-start}
#product-app .dialog-head>div{min-width:0}
#product-app .dialog-head h2{font-size:21px;line-height:1.25;letter-spacing:-.45px;color:var(--ink)}
#product-app .dialog-head p{font-size:13px;line-height:1.6;color:var(--muted)}
#product-app .dialog-head>.btn{min-width:36px;width:36px;min-height:36px;padding:8px;flex:none}
#product-app .dialog-body{padding:19px 18px;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scroll-padding-block:16px;flex:1 1 auto}
#product-app .dialog-body>p{font-size:14px;line-height:1.65}
#product-app .dialog-body>p.small{font-size:12px}
#product-app .dialog-footer{padding:14px 16px;gap:8px;flex:0 0 auto;min-width:0;background:#fbfcfb;border-color:var(--line)}
#product-app .dialog-footer .btn{font-size:14px;line-height:1.35;min-height:43px;min-width:0;flex:1 1 110px}
#product-app .dialog-footer>.inline{flex-wrap:wrap;width:100%;gap:8px}
#product-app .v7-result-dialog .dialog-body{padding:29px 21px 20px}
#product-app .v7-result-dialog .dialog-head{padding:0;top:7px;right:7px}
#product-app .v7-result h2{font-size:23px;line-height:1.25;letter-spacing:-.5px}
#product-app .v7-result p,#product-app .v7-result-detail{font-size:14px;line-height:1.65}
#product-app .v7-saved,#product-app .v7-limit{font-size:12px;line-height:1.6}
#product-app .l1-activity-card p{font-size:14px;line-height:1.6}
#product-app .activity-steps li{font-size:13px;line-height:1.5}
#product-app .product-toast{font-size:13px;line-height:1.55}
#product-app .l3-bottom button{font-size:11px;line-height:1.2;color:var(--muted)}
#product-app .l3-bottom button[aria-current=page]{color:var(--primary)}
#product-app .l3-bottom button[aria-current=page] svg{background:var(--tint);box-shadow:0 0 0 5px var(--tint)}
#product-app .header-patient strong{font-size:11px;line-height:1.4}
#product-app .header-patient small{font-size:10px;line-height:1.35}
#product-app .public-label,#product-app .public-footer{font-size:12px}

/* Stock and consumption: remove the separate blue-gray miniature type scale. */
#product-app .st-stock-summary strong,#product-app .st-material-body>strong,
#product-app .st-material-value>strong,#product-app .st-event-main>strong,
#product-app .st-report-title,#product-app .st-edit-name strong{color:var(--ink)}
#product-app .st-stock-summary small,#product-app .st-material-body>small,
#product-app .st-material-value>small,#product-app .st-event-main>span,
#product-app .st-event-main>small,#product-app .st-event-end>small,
#product-app .st-filter-line>span,#product-app .st-report-preview,
#product-app .st-report-meta,#product-app .st-status-line>span:last-child:not(.badge),
#product-app .st-edit-name small,#product-app .st-muted{color:var(--muted)}
#product-app .st-material-icon,#product-app .st-edit-name>span{background:var(--tint);color:var(--primary)}
#product-app .st-material-body>strong,#product-app .st-event-main>strong,
#product-app .st-report-title,#product-app .st-edit-name strong{font-size:14px;line-height:1.5}
#product-app .st-material-body>small,#product-app .st-material-value>small,
#product-app .st-event-main>span,#product-app .st-event-main>small,
#product-app .st-report-preview,#product-app .st-report-meta,
#product-app .st-edit-name small,#product-app .st-stock-summary small,
#product-app .st-filter-line>span{font-size:12px;line-height:1.55}
#product-app .st-material-state .badge,#product-app .st-report-top .badge{font-size:11px;padding:4px 7px}
#product-app .st-material-value>strong{font-size:22px;font-variant-numeric:tabular-nums}
#product-app .st-material-value>small{max-width:78px}
#product-app .st-material+.st-material,#product-app .st-event+.st-event,
#product-app .st-report+.st-report,#product-app .st-edit-line{border-color:var(--line)}
#product-app .st-footnote{font-size:12px;line-height:1.65;color:var(--muted)}
#product-app .st-footnote>svg{color:var(--primary)}
#product-app .st-prose,#product-app .st-quote{font-size:14px;line-height:1.75;color:var(--ink)}
#product-app .st-quote{border-color:#bfd8cf}
#product-app .st-report-top{align-items:flex-start;gap:8px;flex-wrap:wrap}
#product-app .st-report-top>strong{font-size:11px;line-height:1.5;color:var(--muted)}
#product-app .st-report-meta{gap:10px;flex-wrap:wrap}
#product-app .st-event-end>strong{font-size:17px;color:var(--primary);font-variant-numeric:tabular-nums}
#product-app .st-event-end>small{font-size:11px}
#product-app .st-event-icon{background:var(--tint);border-color:var(--line);color:var(--primary)}
#product-app .st-event-icon.out{background:#f1f4f3;color:var(--muted);border-color:var(--line)}
#product-app .st-balance-hero>small,#product-app .st-balance-hero>div>span{font-size:13px;color:var(--muted)}

/* BAL shares the same readable material, decision and history hierarchy. */
#product-app .bal-material-name strong,#product-app .bal-shift-main>strong{font-size:14px;line-height:1.5;color:var(--ink)}
#product-app .bal-material-name small,#product-app .bal-shift-main>small,
#product-app .bal-history-item>div>small,#product-app .bal-day-nav small,
#product-app .bal-count-progress,#product-app .bal-count-progress b{font-size:12px;line-height:1.55;color:var(--muted)}
#product-app .bal-helper{font-size:13px;line-height:1.65}
#product-app .bal-preserved,#product-app .bal-quote>p{font-size:14px;line-height:1.75;color:var(--ink)}
#product-app .bal-quote>small,#product-app .bal-fact-grid small{font-size:12px;line-height:1.5;color:var(--muted)}
#product-app .bal-quote{background:#f6f9f7;border-color:#bfd8cf}
#product-app .bal-fact-grid b{font-size:16px;color:var(--ink)}
#product-app .bal-fact-grid .bal-different b{color:var(--warning)}
#product-app .bal-fact-grid>span{min-width:0;overflow-wrap:anywhere}
#product-app .bal-count-item .quantity-control .input{font-size:16px;min-height:44px}
#product-app .bal-choice-set label span{font-size:12px;min-height:42px;border-color:var(--line);color:var(--muted)}
#product-app .bal-choice-set input:checked+span{background:var(--tint);border-color:#83b6a7;color:var(--primary)}
#product-app .bal-category-title{color:var(--primary);font-size:11px;line-height:1.5}
#product-app .bal-document-id>div{min-width:0;flex:1 1 190px}
#product-app .bal-document-id>div>small{font-size:12px;line-height:1.55;color:var(--muted)}

/* Documents use the product palette, not a second olive-green theme. */
#product-app .doc-lab-file{padding-block:19px;border-color:var(--line)}
#product-app .doc-lab-file-head{grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:start}
#product-app .doc-lab-file-head strong{font-size:14px;line-height:1.5;color:var(--ink)}
#product-app .doc-lab-file-head small{font-size:12px;line-height:1.55;color:var(--muted)}
#product-app .doc-lab-file-head>.badge{font-size:11px;line-height:1.4;max-width:93px;padding:4px 7px}
#product-app .doc-lab-file-icon{width:36px;height:41px;background:var(--tint);color:var(--primary);border-color:var(--line)}
#product-app .doc-lab-file-meta{font-size:12px;line-height:1.5;color:var(--muted);gap:8px 14px;padding:13px 0 11px}
#product-app .doc-lab-file-meta>span{gap:6px}
#product-app .doc-lab-file-meta svg{width:14px;height:14px;color:var(--muted)}
#product-app .doc-lab-details{border-color:var(--line)}
#product-app .doc-lab-details>summary{font-size:13px;line-height:1.55;color:var(--primary);padding-block:13px}
#product-app .doc-lab-code{font-size:12px;line-height:1.75;color:var(--muted);background:#f3f6f4;padding:11px;border-radius:8px}
#product-app .doc-lab-help{font-size:13px;line-height:1.65;color:var(--muted)}
#product-app .doc-lab-file-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
#product-app .doc-lab-file-actions>.btn{flex:1 1 105px;min-width:0;min-height:40px;padding:8px 9px;font-size:13px;gap:6px}
#product-app .doc-lab-file-actions>.btn>svg{width:16px;height:16px}
#product-app .doc-lab-filter{border-color:var(--line);padding-bottom:15px}
#product-app .doc-lab-filter>.input{font-size:14px;min-height:43px}
#product-app .doc-lab-more>.btn{font-size:13px;min-height:40px}
#product-app .doc-lab-essential{background:#f1f7f4;border-color:#d4e5dc;color:var(--primary);gap:10px;padding:13px}
#product-app .doc-lab-essential>p{font-size:13px;line-height:1.65;color:var(--muted)}
#product-app .doc-lab-checks>legend{font-size:14px;line-height:1.5;color:var(--ink);margin-bottom:9px}
#product-app .doc-lab-checks>.check-label{font-size:14px;min-height:44px;line-height:1.5;padding-block:10px;border-color:var(--line);color:var(--ink);gap:10px}
#product-app .doc-lab-checks input{width:18px;height:18px;accent-color:var(--primary)}
#product-app .doc-lab-checks .doc-lab-disabled{color:var(--muted);opacity:.75}
#product-app .doc-lab-dates{gap:12px}
#product-app .doc-lab-dates .input{font-size:14px!important;min-height:44px}
#product-app .doc-lab-selected{grid-template-columns:28px minmax(0,1fr) auto;border-color:var(--line);background:#f7faf8;padding:13px;gap:10px}
#product-app .doc-lab-selected>span{color:var(--primary)}
#product-app .doc-lab-selected strong{font-size:14px;line-height:1.5;color:var(--ink)}
#product-app .doc-lab-selected small{font-size:12px;line-height:1.5;color:var(--muted)}
#product-app .doc-lab-selected>.btn{font-size:12px;min-height:36px;padding:7px}
#product-app .doc-lab-upload{background:#f7faf8;border-color:#9abdae;color:var(--primary);gap:10px;padding:25px 16px;min-height:136px}
#product-app .doc-lab-upload strong{font-size:14px;line-height:1.5;color:var(--ink)}
#product-app .doc-lab-upload span{font-size:12px;line-height:1.55;color:var(--muted)}
#product-app .doc-lab-upload:hover{background:var(--tint);border-color:var(--primary)}
#product-app .doc-lab-picker .summary-main>strong{font-size:14px}
#product-app .doc-lab-result-copy{font-size:14px;line-height:1.65;color:var(--muted)}
#product-app .doc-lab-result-values>div{grid-template-columns:40% minmax(0,1fr);gap:14px;padding-block:13px;border-color:var(--line)}
#product-app .doc-lab-result-values dt{font-size:12px;line-height:1.5;color:var(--muted)}
#product-app .doc-lab-result-values dd{font-size:14px;line-height:1.5;color:var(--ink)}
#product-app .doc-lab-upload:focus-visible,#product-app .doc-lab-details>summary:focus-visible{outline-color:#7ba99c}

/* Narrow phone variants retain full actions; dense metadata may wrap. */
@container product (max-width:380px){
 #product-app .page{padding-inline:14px}
 #product-app .section-head,#product-app .section-body{padding-inline:14px}
 #product-app .dialog-head,#product-app .dialog-body{padding-inline:16px}
 #product-app .dialog-footer{padding-inline:14px}
 #product-app .l3-footer-main>div:last-child:has(>.btn:nth-child(2)){width:100%;margin-left:0}
 #product-app .l3-footer-main>div:last-child:has(>.btn:nth-child(2))>.btn{flex:1 1 110px}
 #product-app .doc-lab-file-head{grid-template-columns:34px minmax(0,1fr);gap:9px}
 #product-app .doc-lab-file-head>.badge{grid-column:2;justify-self:start;margin-top:0;max-width:none}
 #product-app .doc-lab-file-actions>.btn{font-size:13px;padding:8px;min-height:40px}
 #product-app .doc-lab-selected{grid-template-columns:26px minmax(0,1fr);padding:12px;gap:9px}
 #product-app .doc-lab-selected>.btn{grid-column:2;justify-self:start}
 #product-app .doc-lab-dates{grid-template-columns:1fr}
 #product-app .doc-lab-file-head strong,#product-app .doc-lab-selected strong{font-size:14px}
 #product-app .st-material{gap:9px}
 #product-app .st-material-value{min-width:56px;padding-left:2px}
 #product-app .st-material-value>strong{font-size:21px}
 #product-app .bal-fact-grid{gap:9px}
 #product-app .header-patient strong{font-size:10px}
}

/* At compact notebook sizes, keep the review beside the phone when it fits. */
@media(min-width:1040px) and (max-width:1179px){
 .lab-layout{grid-template-columns:220px minmax(360px,1fr)}
 .lab-layout.has-review{grid-template-columns:220px minmax(360px,1fr) 300px}
 .lab-layout.nav-collapsed{grid-template-columns:0 minmax(360px,1fr)}
 .lab-layout.nav-collapsed.has-review{grid-template-columns:0 minmax(360px,1fr) 300px}
 #review-root{position:relative;inset:auto;width:auto;max-width:none;height:100%;box-shadow:none;z-index:20}
 .review-head{padding-inline:18px}.review-body{padding-inline:18px}
 .scene-controls{padding-inline:16px}.stage-pad{padding-inline:12px}
}

/* Notebook review shell: keep controls compact and the mobile product usable. */
.lab-bar{height:60px;padding:9px 18px}
.lab-layout{height:calc(100dvh - 60px)}
.scene-controls{padding:11px 18px 12px;gap:9px}
.scene-label{gap:10px}
.scene-label strong{font-size:14px;line-height:1.4}
.scene-label p{font-size:11px;line-height:1.5;margin:3px 0 0}
.scene-tools{display:grid;grid-template-columns:minmax(170px,1fr) 135px auto;gap:9px;align-items:end}
.scene-tools .state-pick,.scene-tools .device-pick{min-width:0;width:auto}
.scene-tools .lab-select{width:100%;max-width:none;min-height:36px}
.scene-tools .state-pick>span,.scene-tools .device-pick>span{font-size:10px}
.scene-tools .reset-btn{min-height:36px}
.stage-caption{padding:7px 12px 0;font-size:11px;line-height:1.45;gap:12px}
.stage-pad{padding:10px 12px 12px}
.nav-head{padding-top:19px}
.nav-head>.eyebrow{font-size:10px}
.nav-group h3{font-size:12px}
.scene-link{padding-block:11px}
.scene-link>span{font-size:12px;line-height:1.5}
.review-location small{font-size:11px;line-height:1.6}
.review-tip{display:none}
.review-text-label{font-size:13px;line-height:1.5}
.review-body textarea{font-size:14px;line-height:1.65;min-height:170px}
.review-body{padding-top:18px}
.lab-brand small{font-size:11px}

 const hours='<div class="bv4-hours-preview"><span class="bv4-hours-icon">'+H.ico('clock',20)+'</span><div><small>'+e(special?'Horário especial deste cadastro':'Padrão da residência')+'</small><strong>'+e(displayTime(timing.start))+' <span>às</span> '+e(displayTime(timing.end))+'</strong><p>'+e(timing.work===24?'Término no dia seguinte.':timing.period==='night'?'Plantão noturno · término no dia seguinte.':'Plantão diurno')+'</p></div></div>'+H.toggle('bal.special','Horário especial',special,'Defina início e término diferentes do padrão para este cadastro.')+(special?'<div class="bv4-hours-grid">'+H.field('Início',H.input('bal.specialStart',V('bal.specialStart'),{type:'time'}))+H.field('Término',H.input('bal.specialEnd',V('bal.specialEnd'),{type:'time'}))+'</div>':'');
 return {id:'bal-schedule',title:proposal?'Pedir inclusão de plantão':'Cadastrar plantão',subtitle:'Profissional, horário e repetição',body:'<div class="bv3-form"><section class="bv4-form-section"><h3>Quem e quando</h3>'+H.field('Profissional',H.select('bal.person',V('bal.person'),Object.entries(people).map(([value,label])=>({value,label}))))+H.field(repeated?'Primeiro dia':'Data do plantão',H.input('bal.start',V('bal.start'),{type:'date'}))+'</section><section class="bv4-form-section"><h3>Rotina do plantão</h3>'+H.toggle('bal.repeating','Com repetição',repeated,'A escala calcula os próximos plantões.')+(repeated?H.field('Escala',H.select('bal.scale',V('bal.scale'),S().data.shiftTypes)):H.field('Período',H.select('bal.singleHours',V('bal.singleHours'),[{value:'12',label:'Diurno · 12 horas'},{value:'night',label:'Noturno · 12 horas'},{value:'24',label:'24 horas'}])))+hours+(repeated?H.toggle('bal.endEnabled','Definir data de término',end,'Desligado: os plantões continuam sem data final.')+(end?H.field('Último dia',H.input('bal.until',V('bal.until'),{type:'date'})):''):'')+'</section>'+note()+(repeated?'<div class="bv3-preview"><strong>Próximas datas</strong><p>'+schedulePreview()+'</p><small>'+e(end?'Até '+dateLabel(V('bal.until')):'Sem data de término')+'</small></div>':'')+'</div>',footer:B('Cancelar','sheet-close')+B(proposal?'Enviar pedido':'Cadastrar plantão','b3-schedule-save',{tone:'primary',icon:'check'})};

function dateLabel(value){if(!value)return '—';const p=value.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:value;}
function schedulePreview(){let d=new Date((V('bal.start')||'2026-11-21')+'T12:00:00Z');const type=S().data.shiftTypes.find(x=>x.value===V('bal.scale'));const gap=type?(type.work+type.rest)/24:2;return Array.from({length:3},(_,i)=>{const x=new Date(d.getTime()+gap*i*86400000);return String(x.getUTCDate()).padStart(2,'0')+'/'+String(x.getUTCMonth()+1).padStart(2,'0');}).join(' · ');}

function wizard(){
 const s=S(),f=s.flags,step=f.balStep,activeCategory=f.balCategory;
 const stepper='<nav class="wizard-steps w7-steps" aria-label="Etapas do balanço">'+steps.map((name,i)=>'<button class="wizard-step '+(i===step?'active':i<step?'done':'')+'" type="button" data-act="b3-step:'+i+'"'+(i>step?' disabled':'')+(i===step?' aria-current="step"':'')+'><span class="step-no">'+(i<step?H.ico('check',13):i+1)+'</span><span>'+name+'</span></button>').join('')+'</nav>';
 let body='',top='';
 if(s.initialVariant==='reference-changed'&&!f.balReferenceAdopted)top=banner('O estoque foi atualizado','Uma entrega alterou a referência da dipirona. Sua contagem foi preservada.','warning',{id:'bal-ref',action:'b3-reference',label:'Ver atualização',dismissible:false});
 if(step===0)body='<div class="wizard-content"><h2>Confirme os dados</h2><p class="intro">A contagem será vinculada a este paciente e a quem está preenchendo.</p><div class="identity-block"><span class="avatar">HA</span><div class="identity-main"><strong>'+e(H.patient)+'</strong><small>Paciente · residência Almeida</small></div>'+H.ico('lock',16)+'</div>'+rows([['Quem preenche',current()],['Plantão','19/11 · 07h–19h'],['Estoque','Equipe'],['Contagem',f.balRecount?'Recontagem do '+balId():'Balanço do plantão']])+'<p class="wizard-note">Esses dados são preenchidos pelo sistema.</p></div>';
 if(step===1){
  const visible=countedItems().filter(p=>p.category===activeCategory),total=countedItems().length,filled=countedItems().filter(p=>V('bal.count.'+p.id)!=='').length;
  const tabs='<nav class="category-tabs" aria-label="Categorias de materiais">'+categories.map(([id,label,icon])=>'<button type="button" data-act="b3-category:'+id+'" class="'+(activeCategory===id?'active':'')+'" aria-pressed="'+(activeCategory===id)+'">'+H.ico(icon,16)+label+'<small>'+countedItems().filter(p=>p.category===id).length+'</small></button>').join('')+'</nav>';
  const catalogActions=(f.balRecount?B('Incluir item não contado','b3-add-catalog',{small:true,icon:'plus'}):B('Item extra','b3-extra-add',{small:true,icon:'plus'}))+B('','b3-scan',{small:true,icon:'scan',aria:'Contar por código de barras'});
  body='<div class="wizard-content materials-body"><div class="materials-intro"><h2>'+e(f.balRecount?'Conte novamente os materiais':'Conte os materiais')+'</h2><p>'+e(f.balRecount?'Os itens da contagem anterior já estão separados. Inclua um item do catálogo caso ele tenha sido esquecido.':'Informe a quantidade que está fisicamente com a equipe. Use zero quando não houver unidades.')+'</p></div>'+tabs+'<div class="material-toolbar"><span>'+filled+' de '+total+' contados</span><div class="inline">'+catalogActions+'</div></div><div class="bv3-count-list">'+(visible.length?visible.map(materialInput).join(''):H.empty('Nenhum item nesta categoria',f.balRecount?'Inclua um material do catálogo que não foi contado.':'Não há materiais cadastrados nesta categoria.',f.balRecount?B('Incluir material','b3-add-catalog',{small:true,icon:'plus'}):'','box'))+'</div></div>';
 }
 if(step===2)body='<div class="wizard-content"><div class="bv3-step-title"><div><h2>Itens extras</h2><p class="intro">Materiais com a equipe que ainda não fazem parte do catálogo.</p></div>'+B('','b3-extra-add',{icon:'plus',aria:'Incluir item extra'})+'</div><div class="w7-extras-list">'+(s.data.extras.length?s.data.extras.map(materialInput).join(''):H.empty('Nenhum item extra','Se houver um material fora do catálogo, inclua-o aqui.',B('Incluir item extra','b3-extra-add',{small:true,icon:'plus'}),'box'))+'</div><p class="bv3-helper">Um extra que já virou item do catálogo aparece na categoria correspondente, na etapa Materiais.</p></div>';
 if(step===3)body='<div class="wizard-content"><h2>Observações da contagem</h2><p class="intro">Registre algo que ajude a família e a supervisão a entender os números.</p>'+note('bal.notes','Observação (opcional)','Ex.: uma embalagem foi localizada em outro armário.')+'</div>';
 if(step===4)body='<div class="wizard-content"><h2>Revise o balanço</h2><p class="intro">Confira as quantidades antes de registrar.</p><div class="bv3-review-identity"><strong>'+e(H.patient)+'</strong><small>'+e(current())+' · 19/11 · estoque da equipe</small></div>'+categories.map(([key,label])=>reviewGroup(label,countedItems().filter(p=>p.category===key))).join('')+reviewGroup('Itens extras',s.data.extras)+'<div class="bv3-review-notes"><div><h3>Observações</h3>'+B('','b3-step:3',{small:true,icon:'edit',aria:'Editar observações'})+'</div><p>'+e(V('bal.notes')||'Nenhuma observação adicionada.')+'</p></div><div class="bv3-emission-summary">'+H.ico('info',17)+'<p>'+e(f.balPolicy==='optional'?'Este balanço permite revisão posterior. Ao emitir, as diferenças serão aplicadas como ajuste de balanço.':'A emissão registra a contagem. O estoque será ajustado depois das revisões previstas e da confirmação de aplicação.')+'</p></div></div>';

 const footer='<footer class="wizard-footer"><span class="autosave">'+H.ico('check',13)+'Rascunho salvo automaticamente</span><div class="inline">'+B(step===0?'Sair':'Voltar',step===0?'b3-exit':'b3-prev')+B(step===4?'Emitir balanço':'Continuar',step===4?'b3-count-submit':'b3-next',{tone:'primary',disabled:step===4&&!canEmit,icon:step===4?'check':undefined})+'</div></footer>';
 return H.page(f.balRecount?'Recontagem':'Novo balanço',H.patient,f.balRecount?'Nova contagem vinculada ao '+balId():'Conferência dos materiais da equipe.',top+'<div class="wizard bv3-wizard"><div class="wizard-card">'+stepper+body+footer+'</div></div>',B('','b3-exit',{icon:'close',aria:'Sair do preenchimento'}));

 root.innerHTML='<div class="lab-modal-wrap"><section class="scope-modal" role="dialog" aria-modal="true" aria-labelledby="scope-title" tabindex="-1"><header><div><span class="eyebrow">Home Care Assistant</span><h2 id="scope-title">L3 · referência aprovada</h2></div><button class="lab-btn icon-only" data-lab-act="scope-close" aria-label="Fechar escopo">'+H.ico('close',20)+'</button></header><p>Use o laboratório no notebook e escolha os estados na lateral. A interface do produto aparece em uma largura de celular, seguindo a referência aprovada de L2.</p><div class="scope-grid"><div><h3>E07 · Estoque e consumo</h3><p>Saldos e trânsito, movimentos com vários itens, consumo do plantão e avisos de falta.</p></div><div><h3>E08 · Plantões e balanços</h3><p>Agenda e balanços no mesmo lugar, wizard de contagem e decisões dentro do acompanhamento.</p></div><div><h3>E09 · Arquivos no sistema</h3><p>Conteúdo, acervo, anexos, recuperação, acesso e verificação.</p></div></div><div class="scope-note"><strong>A aparência dos PDFs está fora de L3.</strong><p>O laboratório revisa as telas de acesso e os estados dos arquivos. Não gera nem redesenha páginas de PDF. Novos fatos podem ser incorporados ao conteúdo pelo fluxo existente, durante a implementação do lote.</p></div><h3>O que foi reaproveitado</h3><p>Botões, ícones, painéis, menus, carregamentos e resultados seguem L2 v7. As funções de L1 e L2 que aparecem apenas como contexto permanecem completas no produto.</p><h3>Fonte e limites</h3><p>Referência aprovada consolidada a partir das decisões de L3, dos 182 registros da revisão v3 e dos componentes atuais de L1/L2. Os componentes compartilhados de rascunho, diálogo, carregamento e avisos foram conferidos no commit <a target="_blank" rel="noopener" href="https://github.com/RMZZFAJ/home-care-assistant/commit/'+H.reference.commit+'">'+H.reference.commit.slice(0,8)+'</a>, branch '+e(H.reference.branch)+'. A ordem mestre do lote L3 e este laboratório constituem a referência aprovada de implementação. As simplificações de contexto não autorizam retirar funções existentes.</p><p>Todos os dados são fictícios. Ações alteram apenas o exemplo local. Não há banco real, envio de avisos, assinatura ou validação criptográfica. Estados de documentos representam os resultados possíveis.</p><p>O laboratório já é a referência aprovada de L3. As ferramentas laterais de cenários e anotações servem à demonstração e não integram o produto.</p><footer><button class="lab-btn primary" data-lab-act="scope-close">Voltar ao laboratório</button></footer></section></div>';
}
H.exportReviews=()=>{
 const reviews=Object.values(H.reviews).filter(r=>r.state||r.text?.trim());
 const data={format:'hca-visual-lab-review',version:H.version,exportedAt:new Date().toISOString(),reviewDevice:'notebook',viewport:'celular',scope:{stages:['E07','E08','E09'],pdfAppearance:'excluded',visualBaseline:'L2 v7 aprovada'},reference:H.reference,coverage:H.scenarios.map(s=>({id:s.id,title:s.title,group:s.group,variants:s.variants})),reviews};
 H.download('hca-l03-v4-comentarios.json',JSON.stringify(data,null,2),'application/json');H.labNotice(reviews.length+' avaliações exportadas. Envie o arquivo nesta conversa.');
};
function labAction(action){
 const [name,...args]=action.split(':');
 if(name==='nav'){H.lab.navOpen=!H.lab.navOpen;renderBar();return;}
 if(name==='scene')return H.launch(args[0]);
 if(name==='reset'){const s=H.state;H.launch(s.baseId,s.initialVariant);H.labNotice('Exemplo reiniciado. Seus comentários foram preservados.');return;}
 if(name==='review'){H.lab.reviewOpen=!H.lab.reviewOpen;renderBar();renderReview();return;}
 if(name==='review-close'){H.lab.reviewOpen=false;renderBar();renderReview();return;}
 if(name==='review-state'){saveReview({state:args[0]});renderBar();renderNav();renderReview();return;}
 if(name==='review-clear'){delete H.reviews[reviewKey()];save('reviews',H.reviews);renderBar();renderNav();renderReview();return;}
 if(name==='scope'){H.lab.scopeOpen=true;renderScope();document.querySelector('.scope-modal')?.focus();return;}
 if(name==='scope-close'){H.lab.scopeOpen=false;renderScope();return;}
 if(name==='export')return H.exportReviews();
 if(name==='import')return $('import-file').click();
 if(name==='finish-loading'){H.state.loading=null;H.render();H.labNotice('Carregamento encerrado. Continue pela ação disponível ou escolha outro estado.');}
}
H.on('lab-reset-proxy',()=>labAction('reset'));
document.addEventListener('click',ev=>{
 const lab=ev.target.closest('[data-lab-act]');if(lab){ev.preventDefault();labAction(lab.dataset.labAct);return;}
 const el=ev.target.closest('#product-app [data-act]');if(!el||el.disabled||H.state.loading)return;
 ev.preventDefault();const [act,...args]=el.dataset.act.split(':');H.state.errors={};
 try{if(H.actions[act])H.actions[act](args,ev);else{console.warn('Missing action',act);H.labNotice('Esta ação não está disponível neste estado.');}}catch(err){console.error(err);H.failure({title:'A interação não terminou',message:'Seus comentários foram preservados. Reinicie este estado para continuar.',code:'LAB-INTERACTION'});}
});
document.addEventListener('input',ev=>{
 const el=ev.target;if(el.id==='review-text'){saveReview({text:el.value});clearTimeout(H.reviewTimer);H.reviewTimer=setTimeout(()=>{renderBar();renderNav();},350);return;}
 if(el.id==='scene-search'){H.lab.query=el.value;const pos=el.selectionStart;renderNav();$('scene-search')?.focus();$('scene-search')?.setSelectionRange(pos,pos);return;}
 if(!el.closest('#product-app')||!el.dataset.model)return;
 const key=el.dataset.model,val=el.type==='checkbox'?el.checked:el.value;H.state.form[key]=val;if(H.state.errors?.[key])delete H.state.errors[key];
});
document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.id==='variant-select')return H.launch(H.state.baseId,el.value);
 if(el.id==='device-select'){H.lab.width=Number(el.value);save('width',H.lab.width);renderControls();return;}
 if(el.id==='review-filter'){H.lab.filter=el.value;renderNav();return;}
 if(el.id==='import-file'){const f=el.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(String(reader.result));if(data.format!=='hca-visual-lab-review'||!Array.isArray(data.reviews))throw Error('format');if(!String(data.version||'').includes('v4')){H.priorReviews=data.reviews;H.render();H.labNotice('Revisão anterior carregada como referência, sem aprovar a nova versão.');return;}let n=0;for(const r of data.reviews){if(!H.scenarios.some(s=>s.id===r.scenario))continue;const safe={scenario:r.scenario,title:String(r.title||''),variant:String(r.variant||''),variantLabel:String(r.variantLabel||''),phase:String(r.phase||r.currentPhase||r.variant||''),surface:String(r.surface||'page'),surfaceLabel:String(r.surfaceLabel||'Tela principal'),form:Object.fromEntries(Object.entries(r.form&&typeof r.form==='object'&&!Array.isArray(r.form)?r.form:{}).filter(([k,v])=>!['__proto__','constructor','prototype'].includes(k)&&(v===null||['string','boolean','number'].includes(typeof v)))),uiContext:{title:String(r.uiContext?.title||''),tabs:Array.isArray(r.uiContext?.tabs)?r.uiContext.tabs.map(t=>({action:String(t.action||''),label:String(t.label||'')})):[]},actor:String(r.actor||'admin'),state:['approved','adjust','comment'].includes(r.state)?r.state:'comment',text:String(r.text||''),at:String(r.at||new Date().toISOString()),version:H.version,viewport:'celular',reviewDevice:'notebook',viewportWidth:Number(r.viewportWidth)||412};const fallback=[safe.scenario,safe.variant,safe.phase,safe.surface,safe.uiContext.title,safe.uiContext.tabs.map(t=>t.action||t.label).join(',')].join('|');const key=typeof r.reviewId==='string'&&r.reviewId.startsWith(safe.scenario+'|')?r.reviewId:fallback;safe.reviewId=key;H.reviews[key]=safe;n++;}save('reviews',H.reviews);H.render();H.labNotice(n+' avaliações importadas.');}catch{H.labNotice('Escolha um arquivo de comentários deste laboratório L3.');}};reader.readAsText(f);el.value='';return;}
 if(!el.closest('#product-app')||!el.dataset.model)return;
 const key=el.dataset.model,value=el.type==='checkbox'?el.checked:el.value;H.state.form[key]=value;
 for(const handler of H.changeHandlers)handler(key,value,ev);
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'){if(H.lab.scopeOpen){H.lab.scopeOpen=false;renderScope();return;}if(H.state.loading)return;if(H.state.modal){H.closeModal();return;}if(H.state.sheet){H.closeSheet();return;}return;}
 if(ev.key==='Tab'){const dialogs=[...document.querySelectorAll('.scope-modal,.overlay-backdrop .product-dialog,.sheet-backdrop .product-dialog')];const dlg=dialogs.find(x=>x.classList.contains('scope-modal'))||dialogs.find(x=>x.closest('.overlay-backdrop'))||dialogs[0];if(!dlg)return;const els=[...dlg.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href],summary,[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!els.length)return;const first=els[0],last=els.at(-1);if(ev.shiftKey&&(document.activeElement===first||document.activeElement===dlg)){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&(document.activeElement===last||document.activeElement===dlg)){ev.preventDefault();first.focus();}}
});
window.addEventListener('popstate',()=>{if(H.state.context)H.restoreContext();});
H.boot=()=>{const parts=location.hash.slice(1).split('/');const last=read('last',{});const id=H.scenarios.some(s=>s.id===parts[0])?parts[0]:last.id;H.launch(id||H.scenarios[0]?.id,parts[1]?decodeURIComponent(parts[1]):last.variant);};
})(window.HCA);

window.HCA.scenarios.forEach(s=>{if(/^E07-(07|08|09|10|11|12)$/.test(s.id))s.group='consumption';});window.HCA.boot();
</script>
