  revision('E01-01',{description:'Login em página própria, sem abas públicas. Esqueci minha senha abre a recuperação preservando apenas o e-mail digitado; o pedido exige confirmação nessa tela.',steps:['Entre com as credenciais fictícias já preenchidas.','Escolha o paciente quando houver mais de um vínculo.','Reinicie e abra Esqueci minha senha; confira que nenhum pedido foi enviado ainda.']});

  revision('E01-13',{description:'Link expirado ao abrir não apresenta campos de senha; oferece iniciar uma nova solicitação.',steps:['Confira que os campos não aparecem.','Use Solicitar novo link e confirme o pedido na tela seguinte.']});
  revision('E01-15',{description:'Convite preservado em tela própria com acordeões exclusivos para entrada e cadastro. Paciente, função e emissor só aparecem depois da prévia autorizada.',steps:['Abra Entrar com minha conta.','Abra Ainda não tenho conta e confira o fechamento do primeiro acordeão.','Entre com as credenciais fictícias e confira o resumo antes de decidir.']});

  revision('E01-17',{description:'Resumo autorizado antecede a decisão. Aceite usa carregamento em estágios e somente após confirmação mostra sucesso e encaminhamento automático de 15 segundos.',steps:['Confira o resumo e aceite.','Observe a transição sobreposta.','No sucesso, pause ou antecipe o encaminhamento.']});

  revision('E01-23',{description:'Cadastro no acordeão do convite inclui confirmação e requisitos vivos de senha; o retorno condicional substitui o formulário e preserva a continuidade do convite.',steps:['Confira os requisitos e a confirmação de senha.','Crie a conta fictícia.','Leia as instruções e volte a Entrar com minha conta no convite.']});
  revision('E01-24',{description:'Resultado ainda desconhecido mantém a mesma intenção sob uma ação compreensível: Verificar resultado. Não oferece uma decisão oposta enquanto a confirmação estiver pendente.',steps:['Aceite o convite.','Leia Ainda estamos confirmando.','Use Verificar resultado e confira a conclusão sem duplicar a decisão.']});
  revision('E01-25',{title:'Convite revogado durante a decisão',description:'O convite emitido é tratado como imutável na experiência revisada. Este cenário cobre revogação concorrente; não simula alteração de paciente, função ou destinatário. A regra de imutabilidade permanece decisão para implementação posterior.',steps:['Tente aceitar o convite.','Confira o estado de revogação sem sucesso falso.']});
  revision('E01-26',{title:'Decisão do convite não enviada',description:'Se o aparelho não consegue preservar a intenção necessária, a decisão não é enviada. A mensagem explica o resultado ao usuário sem terminologia de implementação.',steps:['Tente aceitar.','Leia que o convite ainda não foi aceito ou recusado.','Use Tentar novamente para representar a recuperação local e depois confirme sua decisão.']});
  revision('E01-27',{title:'Escolher paciente',description:'Com mais de um vínculo, a escolha é obrigatória e usa linguagem de paciente. O seletor não concede acesso novo.',steps:['Busque Helena ou Beatriz.','Selecione a pessoa e confira o destino.']});
  revision('E01-28',{title:'Muitos pacientes e busca',description:'Lista com 54 vínculos fictícios, busca por nome e paginação compacta no topo e na base. A revisão propõe a paginação; não muda o contrato de autorização.',steps:['Vá à próxima página usando os controles superiores ou inferiores.','Busque uma pessoa.','Tente um nome inexistente e confira o vazio específico da busca.']});

  revision('E01-30',{description:'Modal informa o paciente atual e o paciente da ficha. A troca exige escolha explícita e conserva o destino autorizado.',steps:['Confira Beatriz como paciente atual e Helena como destino.','Volte para Beatriz ou confirme Mudar para Helena Oliveira.']});
  revision('E01-31',{title:'Falha ao mudar de paciente',description:'Carregamento sobreposto é seguido de modal de erro. O contexto anterior permanece; a recuperação retoma a seleção capturada.',steps:['Selecione Beatriz.','Confira o modal e a preservação de Helena.','Use Tentar novamente.']});

  revision('E02-24',{description:'Endereço inexistente oferece somente Voltar ao início; o destino respeita a existência de sessão.',steps:['Use Voltar ao início.']});
  add('E01','Link expira durante o preenchimento','Variante de E01-13: o formulário é substituído quando o link expira. Nenhuma senha é alterada. O prazo de dez segundos após a primeira edição é apenas gatilho local para avaliar a transição.',{view:'recovery',loggedIn:false,expireDuringEntry:true},['Edite a senha e aguarde dez segundos, ou tente salvar.','Confira a mensagem de que a senha não foi alterada.','Solicite outro link.'],['recovery'],['ID-01'],'Recuperação');
  add('E01','Conta já existente no convite','Proposta dependente de contrato: sinalização de e-mail já cadastrado somente sob convite verificado e restrito à conta convidada. Não representa enumeração já disponível no backend; o retorno público atual continua condicional.',{view:'invite',persona:'team',loggedIn:false,inviteState:'login_required',registrationOpen:true,duplicateEmail:true},['Tente criar a conta fictícia.','Use Entrar com este e-mail.','Confira a preservação do convite.'],['invite','registration'],['ID-03'],'Convite');
  add('E01','Autenticador no perfil','Configuração de segurança pessoal separada do desafio durante a entrada; mantém a navegação normal. Remoção e inscrição exigem confirmação conforme o estado da conta.',{view:'mfa',persona:'family',mfaEntry:'profile',mfaState:'factor',mfaVerified:true},['Confira a sessão verificada.','Remova o autenticador fictício e configure novamente.','Compare com a entrada no cenário E01-35.'],['mfa'],['ID-01'],'Segurança');
  add('E01','Entrada com um único paciente','Um único vínculo permite seguir sem uma escolha redundante. O laboratório simula a seleção confirmada desse vínculo; não concede acesso só por um nome presente na interface.',{view:'login',loggedIn:false,singleContext:true},['Entre com as credenciais fictícias.','Confira a abertura direta do início de Helena.'],['workspace','context','login'],['ID-01','ID-05'],'Contexto');

  revision('E01-08',{description:'Retorno recente e ainda autorizado abre diretamente a consulta, sem escolha redundante de paciente. O painel compara também retorno antigo ou sem paciente confirmado, que leva à escolha/início.',steps:['Entre e confira o histórico de entregas aberto diretamente.','No painel, compare Retorno antigo e Sem contexto confirmado.','Entre novamente e confira a escolha de paciente em vez de reutilizar o destino.'],notes:'Proposta de experiência: janela local de 30 minutos, com exemplos de 5 e 90 minutos. Não é política já aplicada no backend. O destino precisa pertencer à mesma pessoa e a um paciente ainda autorizado; autenticação adicional, quando exigida, é concluída antes da retomada.'});
  revision('E01-11',{description:'Nova política proposta para senha: mínimo de 8 caracteres, ao menos uma maiúscula, uma minúscula, um número e um símbolo; limite de 72 bytes UTF-8. O envio do modelo valida os mesmos critérios exibidos.',notes:'MUDANÇA CONTRATUAL FUTURA: o código consultado mantém a política anterior de mínimo 12 caracteres sem estas classes obrigatórias. O laboratório aplica a nova regra solicitada em recuperação e cadastro por convite, mas não altera Supabase Auth, API nem repositório. O contrato, mensagens e validações reais deverão ser atualizados juntos em lote posterior.'});
  revision('E01-12',{params:{...scenarios.find(item=>item.id==='E01-12').params,newPassword:'Cuidado-2026!',confirmation:'Outra-2026!'},notes:'A confirmação igual continua com a aparência aprovada; a lista e a validação agora acompanham a política de senha proposta em E01-11, ainda não aplicada no backend.'});
  revision('E01-15',{description:'Entrada e cadastro do convite oferecem o mesmo botão circular do Google. O retorno local mantém o convite e só mostra a prévia para a conta convidada; nenhuma conta Google real é aberta.',steps:['Abra Entrar com minha conta e use o ícone Google.','Reinicie, abra Ainda não tenho conta e compare a mesma opção.','Confira que o convite continua antes da decisão.'],notes:'O Google é simulado nos dois caminhos. O cadastro por senha usa a mudança contratual futura descrita em E01-11.'});
  revision('E01-17',{description:'Resumo do convite identifica explicitamente Função, separado do nome do paciente. Aceite e demais transições mantêm o comportamento aprovado.'});
  revision('E01-23',{description:'Cadastro pelo convite inclui Google e critérios de senha consistentes com a política proposta de 8 caracteres e composição. O convite é preservado na continuidade.',notes:'A autenticação externa é local e fictícia. Regras novas de senha dependem de mudança coordenada no backend; os contratos reais não foram editados.'});
  revision('E01-30',{description:'O link abre a confirmação de outro paciente a partir de uma origem registrada. Voltar restaura a consulta de Beatriz com tipo e período; Mudar confirma Helena e abre a ficha alvo.',params:{...scenarios.find(item=>item.id==='E01-30').params,originRoute:{view:'history',context:'campos',currentDoc:'',tab:'overview',filters:{type:'ENT',query:'',status:'ALL',from:'2026-11-01',to:'2026-11-12',page:1},readMode:'ready'}},steps:['Confira a confirmação do link para Helena.','Escolha Voltar para Beatriz e veja o histórico com tipo/período preservados.','Reinicie e compare Mudar para Helena.'],notes:'A origem explícita deste preset é uma consulta de entregas de Beatriz em 1–12/11/2026. Beatriz permanece sem fichas na fixture. A ação de voltar restaura esse snapshot, sem escolher arbitrariamente outra página.'});
  revision('E01-38',{description:'Ativação opcional mantém a estrutura aprovada e usa a saída explícita Continuar sem configurar agora.',steps:['Compare Configurar autenticador com Continuar sem configurar agora.','Se configurar, verifique com o código fictício 123456.'],notes:'Obrigatoriedade para familiares e lembrete a cada 30 dias seguem sem decisão de política. Esta alteração somente esclarece a saída opcional.'});
  revision('E01-46',{description:'Entrada com um único vínculo segue diretamente ao início. Mudar paciente ou função continua visível no menu, desabilitado; o seletor de cabeçalho também não inicia uma escolha redundante.',steps:['Entre e confira a abertura direta do início.','Abra o menu da conta e confira a opção de troca visível e desabilitada.']});
  revision('E02-01',{description:'Atenção da família pode ser ocultada por 24 horas, sem resolver a pendência. No celular, a ordem é pendências pessoais, avisos, requisições e escala.',steps:['Use o X de um aviso; a pendência continua na lista própria.','No painel, avance 24h nos avisos para fazê-lo reaparecer se ainda estiver pendente.','Compare a sequência dos cartões no celular.'],notes:'Ocultação é preferência local do laboratório, isolada por pessoa, paciente e aviso. O controle de 24h adianta apenas o relógio desses avisos. Não altera tempo de autenticação, registros oficiais nem uma política implantada. Avisos resolvidos não reaparecem.'});
  revision('E02-02',{description:'Atalho profissional passa a Registrar consumo. Estrutura, capacidades e demais elementos aprovados permanecem.'});
  revision('E02-03',{description:'Balanço obrigatório fica em Precisa de atenção, sem X nem atalho duplicado. Fazer balanço encaminha à E08; Adiar exige plantão de destino elegível e justificativa. O pedido aguarda família e mantém o prazo original.',steps:['Confira Fazer balanço e Adiar no cartão obrigatório.','Abra Adiar, selecione o plantão de destino e justifique em 3–1000 caracteres.','Envie o pedido e veja que o prazo original permanece.','Abra Ver pedido para consultar o estado aguardando análise.'],sources:[path.operations,path.tasks,'src/lib/validation/balances.ts','src/components/balances/balance-preparation-fields.tsx','docs/ui-ux/BALANCES.md','supabase/migrations/20261024222909_balance_assignment_resolution.sql','supabase/migrations/20261106021316_phase_d2_deferral_decisions.sql'],notes:'Contrato BAL conferido em leitura no HEAD 77acdfcebbe7a346ba02d72f95be1216a1697ab3. Destino deve ser plantão publicado do mesmo paciente, começar após o fim da atribuição atual, ter profissional ativo elegível para contagem e permanecer válido na decisão. Solicitação exige atribuição/versão atuais e prazo vigente. Motivo: 3–1000 unidades UTF-16. Pedido não muda prazo nem responsabilidade; aprovação familiar revalida o destino e as versões. Não se cria automaticamente pendência no próximo horário nem se conclui estoque, consentimento ou transferência no laboratório.'});

outra tela e aceitar convite outra tela apenas acessível pelo link de convite.\nO botão Esqueci minha senha abre a recuperação de senha, caso o usuário já tenha colocado o e-mail na tela de login a tela de recuperação já abre com o e-mail preenchido e espera o usuário clicar no botão de solicitar link de recuperação para iniciar o processo de recuperação. Caso não tenha colocado o e-mail e clicado em esqueci minha senha abre a tela de recuperação sem e-mail preenchido.", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Separar entrada, recuperação e convite; transportar o e-mail digitado sem disparar recuperação."}, "implementationRequirement": ["Tela de entrar própria; recuperar senha em tela própria; aceitar convite acessível somente por uma entrada de convite, sem abas públicas para alternar entre esses fluxos.", "Esqueci minha senha abre a recuperação com o e-mail já digitado, se houver; sem preenchimento anterior, abre em branco.", "O envio do link depende de comando explícito na tela de recuperação; navegar para ela não envia nada."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 2, "id": "note-1794538911628", "scenario": "E01-01", "scenarioTitle": "Entrar com a conta", "view": "login", "text": "O texto \"ou\" que fica acima do botão continuar com Google está descentralizado.\nO botão de acesso com google pode ser apenas o ícone do google em círculo ao invés de um botão com texto", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Centralizar o separador e experimentar acesso Google como ícone circular."}, "implementationRequirement": ["Centralizar visualmente o separador “ou”.", "Usar botão circular com marca Google conforme sugestão, mantendo nome acessível “Continuar com Google”, foco e área de toque reconhecíveis."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 3, "id": "note-1794539055651", "scenario": "E01-02", "scenarioTitle": "Senha recusada", "view": "login", "text": "", "status": "approved", "category": "access", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovado o cenário de senha recusada."}, "implementationRequirement": ["Preservar a recusa de credenciais e o caminho de correção; aplicar a padronização transversal de localização dos avisos sem reabrir o comportamento aprovado."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 4, "id": "note-1794539304435", "scenario": "E01-03", "scenarioTitle": "Acesso sem conexão", "view": "login", "text": "Quando o app é aberto e o aparelho está sem conexão com a internet o ideal é que apareça uma tela exibindo o aviso de falta de conexão e nem permita ao usuário seguir na navegação (Já temos isso no repo, apenas estou falando pois não entendi se o sem conexão é do aparelho com rede ou do sistema com servidor/db/afins)", "status": "comment", "category": "shared", "relatedCategories": ["access", "dashboard", "history", "documents"], "userDecision": {"classification": "change_requested", "summary": "Distinguir aparelho sem Internet de indisponibilidade do serviço e bloquear navegação offline."}, "implementationRequirement": ["Quando o aparelho estiver sem Internet, mostrar uma superfície própria de falta de conexão e impedir a navegação operacional.", "Manter estados distintos para rede do aparelho e acesso ao serviço; oferecer nova verificação compreensível.", "Não converter falha de servidor em afirmação de que o aparelho está offline; o laboratório usa condições fictícias explícitas."], "backendBoundary": "Rede do aparelho, conexão com serviço e indisponibilidade de backend são causas distintas. O modelo simula, não diagnostica a rede real.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 5, "id": "note-1794539464930", "scenario": "E01-04", "scenarioTitle": "Muitas tentativas de acesso", "view": "login", "text": "Inclua um tente novamente em instantes ou até mesmo colocarmos um tempo para essa nova tentativa.", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Explicar quando uma nova tentativa de entrada poderá ocorrer."}, "implementationRequirement": ["Adicionar orientação “Tente novamente em instantes” na limitação de tentativas.", "Exibir contagem de espera somente quando houver prazo conhecido; não inventar prazo fixo de limitação do Auth."], "backendBoundary": "Prazo preciso de nova tentativa depende de resposta/limite efetivo do Auth; só afirmar quando conhecido.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 6, "id": "note-1794539547187", "scenario": "E01-05", "scenarioTitle": "Serviço de acesso indisponível", "view": "login", "text": "O ideal é que a mensagem de erro fale para contatar o administrador do sistema (familiar responsável, supervisão, equipe técnica)", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Orientar a procurar o responsável quando o serviço de acesso não estiver disponível."}, "implementationRequirement": ["Mensagem deve informar a indisponibilidade e indicar administrador/responsável da residência, supervisão ou suporte técnico pertinente.", "A orientação não depende de criar envio real de mensagem nem de expor contatos particulares."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 7, "id": "note-1794539720993", "scenario": "E01-06", "scenarioTitle": "Retorno do Google não concluído", "view": "login", "text": "O erro de retorno do google precisa ser mais específico se o link expirado e solicitação de novo link é do google ou outro link do sistema em si, o ideal é que se for um erro do google apreça que não foi possível concluir com o google para tentar novamente com o google ou via e-mail e senha diretamente, assim o usuário saberá se deve tentar novamente, se o problema foi com google, se precisa acessar com e-mail e por ai vai, assim fica mais fácil de entender o problema e saber a solução", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Identificar falha de retorno Google e oferecer os caminhos de acesso apropriados."}, "implementationRequirement": ["Explicar que não foi possível concluir a entrada com Google, sem falar genericamente em link expirado de recuperação.", "Oferecer tentar Google novamente ou entrar por e-mail e senha quando esse método for aplicável à conta; não inventar senha existente em conta exclusivamente OAuth.", "Preservar o destino protegido e o contexto de convite durante nova tentativa."], "backendBoundary": "Login por senha só é alternativa funcional quando existir credencial compatível. Não presume vinculação de provedores.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 8, "id": "note-1794540006720", "scenario": "E01-07", "scenarioTitle": "Google indisponível", "view": "login", "text": "O local do aviso de ação não concluída ficou péssimo, ele aparece lá no topo da tela acima do cabeçalho \"Acesso pessoal\" Então o ideal é que o erro apareça abaixo do texto \"Entre com sua conta para acompanhar materiais e tarefas da residência.\" não apenas esse erro, mas todos os erros aqui da tela de login devem aparecer nesse local e o usuário deve ser redirecionado para essa altura da página, assim garantimos que o aviso apreça na tela em exibição, portanto qualquer aviso, erro, problema e coisa do tipo fica concentrado aqui nesse local.", "status": "comment", "category": "shared", "relatedCategories": ["access"], "userDecision": {"classification": "change_requested", "summary": "Concentrar avisos de acesso abaixo do texto introdutório e levar o foco ao resultado."}, "implementationRequirement": ["Erros, avisos e resultados da tela de entrada devem ocupar uma região consistente logo abaixo da introdução, dentro da superfície de acesso.", "Após resposta, tornar o aviso perceptível com foco e rolagem adequados, sem depender de uma faixa acima do cabeçalho fora da área visível.", "Erros locais de campo continuam associados ao campo quando ajudam a corrigir o preenchimento."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 9, "id": "note-1794540209267", "scenario": "E01-08", "scenarioTitle": "Entrar e retornar à consulta", "view": "history", "text": "O status de carregamento após clicar em entrar não pode ser um campo dentro da tela, o ideal é que seja sobreposto a tela toda, e isso não vale apenas para esse caso, muitos dos status de carregamento de todo sistema não podem ser impressos na tela de fato, precisa ser sobreposto, no mais deu certo o acesso direto ao histórico", "status": "approved", "category": "shared", "relatedCategories": ["access", "history"], "userDecision": {"classification": "conditional_approval", "summary": "Aprovado o retorno direto ao histórico, condicionado à troca da apresentação de carregamento.", "condition": "Retorno direto ao histórico aprovado; carregamento da entrada precisa ser corrigido."}, "implementationRequirement": ["Preservar o destino após entrar: retornar à consulta de histórico que originou a autenticação.", "Durante a entrada, usar carregamento sobreposto à área inteira do produto, bloquear ações concorrentes e manter o conteúdo por baixo.", "Aplicar o padrão de carregamento às operações equivalentes; não inferir que todo aviso ou toda consulta exija animação dinâmica."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 10, "id": "note-1794540345300", "scenario": "E01-09", "scenarioTitle": "Solicitar link de recuperação", "view": "recovery-request", "text": "O estado de carregamento precisa ficar na tela toda ou então deve ser movido para abaixo do texto \"Entre com sua conta para acompanhar materiais e tarefas da residência.\" assim mantemos coerência no local em avisos, erros, e afins são exibidos", "status": "comment", "category": "shared", "relatedCategories": ["access"], "userDecision": {"classification": "change_requested", "summary": "Padronizar o carregamento da solicitação de recuperação."}, "implementationRequirement": ["Usar a mesma sobreposição simples de processamento da entrada, ou a região de feedback abaixo da introdução quando a operação não bloquear a tarefa.", "A v2 pode adotar a sobreposição simples para consistência; a conclusão aparece na região de resultado definida."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 11, "id": "note-1794540361631", "scenario": "E01-10", "scenarioTitle": "Recuperação solicitada", "view": "recovery-request", "text": "", "status": "approved", "category": "access", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovado o estado de recuperação solicitada."}, "implementationRequirement": ["Preservar confirmação compreensível após solicitar o link, incluindo a formulação neutra sobre elegibilidade da conta.", "Não transformar a aprovação desse estado em aprovação de enumeração de e-mails cadastrados."], "backendBoundary": "Resposta neutra de recuperação não confirma existência de uma conta.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 12, "id": "note-1794540853258", "scenario": "E01-11", "scenarioTitle": "Definir nova senha", "view": "recovery", "text": "O botão mostrar/ocultar deve ficar como ícone dentro do campo da nova senha\nO carregamento após clicar em salvar senha está aparecendo no topo da tela e em celular fica escondido, aqui entra aquela questão de pegar a tela toda sobreposta ao invés de uma faixa, ja falei que a maioria dos carregamentos do sistema vão ser assim e você insiste em coloca-los como uma faixa azul no topo da tela.\nNão faz sentido manter um botão acessar o sistema, e voltar ao login ao mesmo tempo, vamos melhorar isso, talvez exibindo apenas o aviso verde de senha atualizada no local padrão que venho falando e então após sucesso de salvar nova senha o botão acessar o sistema em verde vai aparecer no local do botão voltar ao login, assim mantém apenas um botão e damos destaque a ele.", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Refinar senha nova: visibilidade dentro do campo, processamento sobreposto e uma ação após sucesso."}, "implementationRequirement": ["Mostrar/ocultar como ícone dentro do campo da nova senha, com estado e nome acessíveis.", "Salvar nova senha usa carregamento sobreposto; resultado de sucesso na região consistente de feedback.", "Após sucesso, substituir o retorno ao login por uma única ação verde “Acessar o sistema”; não manter duas ações redundantes."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 13, "id": "note-1794541272657", "scenario": "E01-12", "scenarioTitle": "Senhas diferentes", "view": "recovery", "text": "O ideal é que tenhamos abaixo do campo que o usuário coloca a senha nova aquela listinha dos requisitos da senha e eles aparecem em cor normal antes do preenchimento, então conforme o usuário vai preenchendo a nova senha os requisitos atendidos ficam verdes e quando ele clica no campo confirmar senha ou os requisitos não preenchidos ficam em vermelho, então o usuário volta a editar a nova senha para que os campos fiquem todos verdes, quando o usuário completa os requisitos ele vai para o campo confirmar nova senha ele tem abaixo igual a lista de requisitos da senha mas apenas o requisito de as senhas serem a mesma, e quando ele termina de de preencher a confirmação, se as senha coincidirem o status fica verde e aí sim o botão salvar nova senha fica clicável, enquanto ele não atender as todos os requisitos e a senha igual na confirmação o botão fica apagado sem poder clicar", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Mostrar requisitos de senha ao vivo e só habilitar salvamento quando os requisitos e a confirmação coincidirem."}, "implementationRequirement": ["Lista de requisitos neutra antes da edição, verde ao atender; requisitos não atendidos ficam em erro depois da saída do campo/tentativa pertinente.", "A confirmação mostra seu próprio requisito de igualdade; habilitar Salvar somente com senha válida e confirmação igual.", "Usar a política existente: mínimo 12 caracteres, máximo 72 caracteres e máximo 72 bytes UTF-8. Não acrescentar maiúscula, símbolo ou número como exigência inventada.", "Distinguir ocultação visual de senha de validade da credencial; feedback deve ser legível sem depender só de cor."], "backendBoundary": "Política local verificada em src/lib/validation/password.ts: 12–72 caracteres e até72 bytes UTF-8.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 14, "id": "note-1794541648517", "scenario": "E01-13", "scenarioTitle": "Link de recuperação expirado", "view": "recovery", "text": "A recuperação de senha é um link enviado pelo e-mail, o ideal é que se o link estiver expirado assim que ele abrir esse link pelo e-mail apareça a tela avisando do link expirado com o botão de iniciar nova recuperação/solicitar novo link (Veja o melhor texto compreensível), assim a tela nem vai exibir campo de nova senha e nada dessas coisas, apenas o fundo do sistema com o aviso e botão que falei\n\nja quando o link expira enquanto ele preencher os campos da tela então a tela recarrega (Não sei se é o termo certo e a função certa) para exibir a mesma coisa que falei acima, aquela tela de aviso de link expirado com o botão para iniciar nova recuperação, a única diferença é que no caso de expirar após ele ter iniciado o link o ideal é que na mensagem de erro apreça que não foi possível concluir pois o link expirou para seguir inicie a nova solicitação (Enfim, não é esse texto, quero apenas informar o usuário que a recuperação não foi feita", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Tratar recuperação expirada como estado próprio, ao abrir ou durante o preenchimento."}, "implementationRequirement": ["Link já expirado abre uma tela de aviso e ação de solicitar novo link; não mostrar campos de nova senha.", "Se expirar durante a edição, substituir o formulário pela mesma superfície, esclarecendo que a senha não foi atualizada.", "Oferecer reinício explícito da recuperação; não repetir automaticamente solicitação nem simular confirmação de atualização."], "backendBoundary": "Expiração exige estado real do token/sessão de recuperação; a tela não pode confirmar mudança de senha sem resposta conclusiva.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 15, "id": "note-1794541692049", "scenario": "E01-14", "scenarioTitle": "Senha atualizada", "view": "recovery", "text": "Já fiz os comentários sobre essa tela", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Aplicar ao cenário de senha atualizada as correções já descritas."}, "implementationRequirement": ["Reutilizar decisões das notas 12–14: sucesso na região padrão, uma ação principal e ausência de formulário de senha no estado concluído."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 16, "id": "note-1794542215596", "scenario": "E01-15", "scenarioTitle": "Convite antes do login", "view": "invite", "text": "Quando o usuário clicar em entrar com minha conta ele não deveria ser redirecionado para a tela de login seca, o ideal é que o contexto de convite encontrado permaneça, não sei se o ideal seria um modal de login, ou então ele ir para a tela de login mas com aviso de que o login está vinculado ao contexto do convite encontrado, algo que permita ao usuário entender que o login está dentro da etapa convite encontrado\nJa em relação ao botão de ainda não tenha conta eu gostei da forma que você fez abrirmos campos para cadastrar a nova conta, falta apenas colocar aqui a confirmação da senha e as linhas dos requisitos da senha que vão ficando verde conforme a senha cumpre cada requisito. Única alteração que eu faria é mudar o botão recolher para um seta, talvez possámos fazer um acordeom para entrar com minha conta e outro para ainda não tenho conta, dependendo de qual dos dois ele clica o acordeom abre com os campos correspondentes e quando um acordeom abre o outro fecha para o usuário não confundir os campos\nApós clicar em criar minha conta a tela deve tirar todos os dados atuais e exibir apenas a informação de \"se o cadastro for elegível...\" mas se o usuário colocar um e-mail que já existe no sistema na hora de fazer novo cadastro a tela precisa informa que o e-mail já existe com um botão de fazer login com esse e-mail (mantendo o contexto de vinculo a um convite)", "status": "comment", "category": "access", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Manter contexto do convite durante autenticação/cadastro e organizar caminhos por acordeões exclusivos.", "contractDecision": "Orientação para e-mail já existente é desejada; exposição dessa distinção ainda depende de contrato verificado."}, "implementationRequirement": ["Manter indicação de que a pessoa está entrando para continuar um convite; não encaminhar a um login sem contexto.", "Oferecer acordeões exclusivos para conta existente e nova conta; abertura de um fecha o outro, com ícone de expansão.", "Cadastro inclui confirmação de senha e lista viva de requisitos da política existente.", "Após pedido de cadastro, substituir os campos pelo resultado pertinente; preservar a formulação de elegibilidade quando a resposta não confirma existência de conta.", "Para e-mail já cadastrado, o usuário deseja orientação e ação de entrar com esse e-mail, mantendo o convite; representar como proposta dependente do contrato, sem afirmar que o serviço já expõe essa distinção.", "Antes de autenticar a conta convidada confirmada, não revelar paciente, papel ou outros detalhes protegidos da prévia."], "backendBoundary": "Exibir e-mail duplicado é mudança desejada de contrato de UX, não capacidade verificada do Auth. Antes da conta convidada confirmada, preview não revela paciente/função. Ver docs/current/API.md, História e erros.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 17, "id": "note-1794542311515", "scenario": "E01-16", "scenarioTitle": "Convite com outra conta", "view": "invite", "text": "Para o botão de trocar conta o que acha de usarmos a ideia do acordeon em que o usuário clica e se mantém na tela/contexto abrindo a troca de conta ali mesmo.", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Usar troca de conta contextual no convite."}, "implementationRequirement": ["Abrir a troca de conta na própria superfície do convite, preferencialmente em acordeão, preservando a entrada de convite.", "Limpar dados protegidos da conta anterior e reconsultar o convite com a nova identidade; contexto visual não autoriza reutilizar a prévia de outra conta."], "backendBoundary": "Revalidar preview e expectedActor; trocar conta invalida dados protegidos e decisão da conta anterior.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 18, "id": "note-1794542759059", "scenario": "E01-17", "scenarioTitle": "Conferir e decidir o convite", "view": "invite", "text": "1. não gostei de como está essa tela de aceitar convite, acho que ela pode ficar mais bonita\n2. Após clicar em Aceitar convite o status de carregando deve estar na tela toda, e seria muito interessante que esse carregando seja personalizado, ou seja, fazer estilo o status de carregamento quando estamos cadastrando um cartão no app de carteira do google, é uma tela toda que mostra ícones se mexendo, aqui eu pensei em algo como vinculando ao paciente, carregando informações, fazendo ajustes finais e por ai vai, assim o usuário fica com o carregamento bem grande na frente dele e esse carregamento fica dinâmico. Ao final do carregamento abre a tela de concite aceito com sucesso, os detalhes do convite aceito e o botão abrir home care assistant e vamos colocar um contador automático que ao final desse contador o usuário é redirecionado automaticamente ao home care assistant, minha ideia dar um tempo legal para o usuário poder ler a tela tranquilamente antes do redirecionamento automático, e para o usuário acompanhar esse progresso pensei no formato de barra de progresso na borda superior do botão \"abrir home care...\" achei ótimo esse recurso Mas é importante que no aviso de sucesso de aceite do convite apareça junto o tempo em que ele vai ser encaminhado automaticamente", "status": "comment", "category": "access", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Recompor decisão de convite, usar processamento dinâmico pertinente e conclusão com redirecionamento contado."}, "implementationRequirement": ["Refinar hierarquia e composição da tela de conferir/aceitar convite.", "Após aceitar, sobreposição de processamento em toda a área do produto, com ícones/mensagens de etapas compreensíveis quando a duração justificar.", "Mensagens de processamento não devem afirmar vínculo ou conclusão antes de confirmação; não exibir percentual fictício.", "Após confirmação, mostrar sucesso, detalhes autorizados do convite aceito e botão “Abrir Home Care Assistant”.", "Mostrar tempo até o redirecionamento automático e progresso temporal na borda superior do botão; esse progresso representa a espera de redirecionamento, não o processamento do servidor.", "Duração exata é proposta de interação da v2, com leitura suficiente e respeito aos controles de inspeção do laboratório."], "backendBoundary": "Confirmação de vínculo exige consulta/resultado autorizado. Tempo do redirecionamento pode ser mensurado; progresso do backend não deve ser inventado.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 19, "id": "note-1794542831750", "scenario": "E01-18", "scenarioTitle": "Convite já aceito", "view": "invite", "text": "Para convite ja aceito eu apenas colocaria o redirecionamento automático igual falei no item anterior", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Aplicar redirecionamento contado também ao convite já aceito."}, "implementationRequirement": ["No estado comprovado de convite já aceito, reutilizar o resultado e o contador de abertura definidos na nota 18.", "Não executar um segundo aceite para produzir essa tela."], "backendBoundary": "Reabrir resultado confirmado, sem novo aceite.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 20, "id": "note-1794542857849", "scenario": "E01-19", "scenarioTitle": "Convite recusado", "view": "invite", "text": "", "status": "approved", "category": "access", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovado o cenário de convite recusado."}, "implementationRequirement": ["Preservar a conclusão de recusa e seus comandos; aplicar apenas padrões compartilhados coerentes."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 21, "id": "note-1794542909313", "scenario": "E01-20", "scenarioTitle": "Convite expirado", "view": "invite", "text": "", "status": "approved", "category": "access", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovado o cenário de convite expirado."}, "implementationRequirement": ["Preservar o estado de convite expirado e o encaminhamento correspondente, sem revelar conteúdo protegido."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 22, "id": "note-1794542922764", "scenario": "E01-21", "scenarioTitle": "Convite revogado", "view": "invite", "text": "", "status": "approved", "category": "access", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovado o cenário de convite revogado."}, "implementationRequirement": ["Preservar revogação como condição distinta de expiração ou edição do convite."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 23, "id": "note-1794542937681", "scenario": "E01-22", "scenarioTitle": "Link de convite inválido", "view": "invite", "text": "", "status": "approved", "category": "access", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovado o cenário de link de convite inválido."}, "implementationRequirement": ["Preservar a recusa de link inválido sem divulgar dados da residência ou da pessoa convidada."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 24, "id": "note-1794542990537", "scenario": "E01-23", "scenarioTitle": "Cadastrar a conta convidada", "view": "invite", "text": "Ja falei sobre colocarmos acordeons nessa tela", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Aplicar os acordeões já solicitados ao cadastro da conta convidada."}, "implementationRequirement": ["Reutilizar a estrutura e as regras da nota 16; não criar uma segunda variante independente do cadastro por convite."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 25, "id": "note-1794543386626", "scenario": "E01-24", "scenarioTitle": "Aceite sem confirmação da resposta", "view": "invite", "text": "Mesmo problema de exibir avisos no topo da tela, eu fiquei um bom tempo parado sem saber o que fazer pois o resultado não confirmado estava aparecendo no topo da tela que não estava visível para mim, a correção deve ser arrumar o local em que o aviso aprece, arrumar o status de carregamento e colocar o foco do usuário no aviso novo.\nEssa função ficou meio confusa, um usuário leigo não vai entender recuperação de tentativa, consultar em reenviar, não vai entender a explicação \"A tentativa de aceite está preservada...\" acho que o melhor é melhor simplificar para não deu certo tente novamente clicando em aceitar novamente ou etão algo como atualizar, ou então o próprio sistema fica tentando reenviar por algumas vezes de forma automática enquanto exibimos aquela tela de carregamento dinâmica que falei em que ocupa a tela toda com ícones, mensagens personalizadas e afins, estilo adicionar um cartão no app da carteira google", "status": "comment", "category": "shared", "relatedCategories": ["access"], "userDecision": {"classification": "change_requested", "summary": "Simplificar resultado incerto de aceite e torná-lo visível, sem expor termos técnicos."}, "implementationRequirement": ["Mostrar processamento e resultado no mesmo fluxo perceptível, com foco e rolagem apropriados.", "Trocar termos como “recuperação de tentativa”, “referência” e “consultar sem reenviar” por ação humana compreensível, por exemplo verificar o resultado ou tentar concluir.", "Pode haver verificações automáticas limitadas durante processamento; recuperar/consultar a mesma intenção, sem repetir efeito de aceite.", "Enquanto resultado for desconhecido, não afirmar “não deu certo” nem sucesso; explicar que ainda não foi possível confirmar e dar próximo passo.", "Evitar novo comando irreversível de aceite só para simplificar o rótulo do botão."], "backendBoundary": "Mesma intenção e confirmação autorizada; não converter resultado incerto em falha comprovada nem repetir efeito oficial.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 26, "id": "note-1794543526762", "scenario": "E01-25", "scenarioTitle": "Convite mudou durante a decisão", "view": "invite", "text": "Não vejo necessidade de ter essa função aqui, pois um convite não muda após ser emitido, se o sistema tiver essa possibilidade vamos retirar isso do sistema para então nos casos em que for necessário alterar algo do convite ele seja revogado/cancelado e iniciado outro", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Convite emitido deve ser imutável; mudança de conteúdo exige revogar e emitir outro.", "contractDecision": "Decisão explícita nova: substituir mudança de conteúdo de convite emitido por revogação e nova emissão."}, "implementationRequirement": ["Remover a ideia de editar silenciosamente paciente, destinatário, função ou conteúdo de um convite já emitido.", "Se o cenário E01-25 representava alteração de conteúdo, marcá-lo como substituído pela decisão e manter rastreabilidade do ID; não o apresentar como fluxo normal aprovado.", "Preservar revogação, expiração, aceite/recusa concorrentes, mudança da conta consultante e revalidação de autoridade: imutabilidade de conteúdo não impede alteração legítima de estado.", "Registrar a necessidade de comparar/adequar contratos no futuro lote; este laboratório não altera o serviço real."], "backendBoundary": "Decisão nova de produto: conteúdo de convite emitido imutável. Verificar comandos/RPC no lote futuro; estados de revogação/expiração e identidade concorrente continuam válidos.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 27, "id": "note-1794543776528", "scenario": "E01-26", "scenarioTitle": "Sem referência local do aceite", "view": "invite", "text": "Oura vez que um aviso aprece em outro lugar incomum na tela, ou seja, só aqui em login/convite/senha e afins eu ja vi avisos em lugares diferentes a cada tela/contexto/modelo, isso não tem como continuar assim\nSem contar que nesse caso esse erro aqui é totalmente incompreensível para o usuário no formato atual, como eu ja disse que seria interessante colocar aquele carregamento dinamico nessa etapa de aceite do convite o ideal é que usamos o fato de ter esse carregamento dinamico para fazer mais de uma tentativa ou algo do tipo e então ser mais claro sobre deu certo ou não e a solução, ao invés de falar em \"Não foi possível guardar a referência desta decisão neste aparelho...\" como se isso fizesse sentido, para o usuário ele quer saber se deu certo ou não se pode tentar novamente ou precisa começar novamente ou precisa falar com alguém", "status": "comment", "category": "shared", "relatedCategories": ["access"], "userDecision": {"classification": "change_requested", "summary": "Simplificar ausência de referência local e comunicar resultado/ação, sem conceitos internos."}, "implementationRequirement": ["Concentrar feedback na região consistente do fluxo e preservar a superfície dinâmica quando pertinente.", "Explicar se a decisão foi confirmada, ainda está sendo verificada ou exige nova autenticação/apoio; não usar falha de armazenamento local como mensagem principal ao usuário.", "A falta de referência local não prova que o aceite falhou. Consultar o estado autorizado antes de oferecer nova decisão.", "Tentativas automáticas, se demonstradas, devem ser limitadas e manter a mesma intenção."], "backendBoundary": "Persistência local não prova resultado do servidor. Não refazer aceite cego quando falta referência local.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 28, "id": "note-1794544131925", "scenario": "E01-27", "scenarioTitle": "Escolher vínculo na sessão", "view": "context", "text": "1. Essa mensagem aqui \"Escolha um contexto autorizado para esta sessão.\" está péssima em termos de ser entendida ou não pelo usuário\n2. Caso o usuário tenha apenas um papel um paciente essa tela nem deve aparecer, mas se ele tem mais de um ela ficou ótima, apenas tem que colocar carregamento simples mas que pegue a tela toda, não precisa ser dinâmico mas precisa pegar a tela toda (ATENÇÃO: QUANDO FALO EM CARREGAMENTO DE TELA TODA É DIFERENTE DE DINÂMICO A IDEIA DO DINAMICO SÃO EM MOMENTO QUE PRECISAMOS DE MASI TEMPO PARA PROCESSAR ALGO OU QUE ELE SEJA APLICÁVEL DE FATO, JA O CARREGAMENTO SIMPLES DE TELA TODA PODE SER UM MODAL SOBREPOSTO COM O LOADING E O FUNDO ATR´S DELE APAGADO E OPACO, APENAS PARA MOSTRAR QUE ESTÁ CARREGANDO OU PODE SER OUTRO TIPO, MAS DE FORMA QUE O USUÁRIO SAIBA QUE ESTÁ CARREGANDO E NÃO POSSA FAZER OUTRA AÇÃO NA TELA (SALVO QUANDO ELE ABRIU ALGO ERRADO E A TELA PERMITE O VOLTAR)", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Selecionar paciente/função apenas quando houver mais de uma opção; carregar de forma bloqueante simples."}, "implementationRequirement": ["Substituir “contexto autorizado” por linguagem de paciente e função de acesso.", "Com um único vínculo/função elegível, entrar diretamente; com mais de um, mostrar seleção; com nenhum, usar a tela específica sem vínculo.", "Durante a troca, sobreposição simples com fundo opaco e ações bloqueadas; animação dinâmica só se a duração justificar.", "Não tratar o número de pacientes como equivalente ao número de vínculos/funções; duas funções no mesmo paciente podem exigir escolha."], "backendBoundary": "Escolha deriva de vínculos/funções efetivamente autorizados, não só número de pacientes nem nome do papel.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 29, "id": "note-1794544461332", "scenario": "E01-28", "scenarioTitle": "Muitos vínculos e busca", "view": "context", "text": "1. No celular está com muito espaço entre \"escolha um contexto....\", campo de busca e \"Exibindo x vínculos....\" \n2. Quando tiver paginação o usuário pode mudar de página logo no começo e no final e não apenas no final \n3. O aviso de exibindo x de ...\" tem que ter hierarquia menor\nO campo de busca tem que usar o termo busca para o usuário entender que é um campo de busca\n4. no desktop essa tela deveria ser sobreposta ao sistema para que o usuário não possa fazer nada sem escolher o paciente/função de acesso, a única coisa que pode estar liberada é o menu suspenso da foto dele, fora isso nem o sino deve aparecer", "status": "comment", "category": "access", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Compactar seleção de vínculos, paginação nas duas extremidades e modal bloqueante no desktop."}, "implementationRequirement": ["Reduzir espaço entre instrução, busca e contagem no celular; rótulo do campo deve explicitar Busca.", "Contagem de resultados em hierarquia secundária; oferecer paginação no início e no fim quando necessária.", "No desktop, seleção de paciente/função sobreposta e impeditiva da navegação de trabalho; apenas menu da conta pode permanecer disponível.", "Ocultar sino e não deixar ações do paciente anterior acessíveis enquanto a escolha ainda não foi concluída."], "backendBoundary": "Nenhuma área local utilizável sem contexto validado; exceções globais dependem de identidade/capacidades reais.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 30, "id": "note-1794544681813", "scenario": "E01-29", "scenarioTitle": "Nenhum vínculo disponível", "view": "context", "text": "Se não tem vínculo disponível deve aparecer em amarelo ou vermelho sem mostrar campo de busca, mas é importe diferenciar o usuário que não tem nenhum vinculo (Aparecer como falei) de um usuário que digitou algo no campo de busca e não achou nada, pois aí foi problema com a busca (Digitação errada ou alfo do tipo) e não que ele não tem paciente, portanto se ele não tem nenhum paciente vinculado aparece no formato que falei mas se ele digitou errado aparece o texto de você não tem nenhum paciente vinculado com esse nome/busca (veja o melhor texto)", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Distinguir conta sem vínculo de busca sem correspondência."}, "implementationRequirement": ["Ausência real de vínculos: aviso âmbar/vermelho, sem campo de busca inútil.", "Busca sem resultado: preservar busca e explicar que nenhum paciente/vínculo corresponde ao termo, permitindo corrigir ou limpar.", "Não apresentar busca vazia como ausência de autorização nem ausência de autorização como erro de digitação."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 31, "id": "note-1794544878301", "scenario": "E01-30", "scenarioTitle": "Ficha de outro paciente", "view": "context", "text": "Caso o usuário esteja logado com um paciente e ele esteja tentando abrir algo de outro paciente o ideal é que seja um modal falando que ele está logado com X e o que está tentando abrir é de y, e perguntar se ele quer voltar ou mudar o para y, aí tem o botão voltar para x, mudar para y, creio que isso vai acontecer mais se ele estiver logado em um paciente e abrir no celular o arquivo de outro paciente e tentar usar o link de acesso ao sistema dentro do pdf gerado, então será mais raro", "status": "comment", "category": "access", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Confirmar mudança de paciente para abrir recurso de outro contexto."}, "implementationRequirement": ["Mostrar modal que identifica paciente ativo e paciente do destino autorizado, com voltar ao atual ou mudar para o destino.", "Após mudança confirmada, abrir o recurso exato e manter retorno coerente; cancelar preserva contexto atual.", "Só identificar o paciente do destino quando a autorização permitir essa informação; link de PDF não concede acesso."], "backendBoundary": "Nome e conteúdo do paciente de destino só podem ser mostrados se autorizados; PDF/link não ampliam permissão.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 32, "id": "note-1794544990279", "scenario": "E01-31", "scenarioTitle": "Falha ao mudar perfil", "view": "context", "text": "O carregamento na mudança deve de perfil deve ser na tela toda (Se for algo que gasta muito tempo e coisa do tipo pode até ser aquele dinâmico que falei) e o erro não tem que ser impresso na tela em si mas sim sobreposto com o botão tentar novamente", "status": "comment", "category": "shared", "relatedCategories": ["access"], "userDecision": {"classification": "change_requested", "summary": "Troca de perfil com carregamento sobreposto e erro também sobreposto."}, "implementationRequirement": ["Usar sobreposição simples durante mudança de paciente/função; dinâmica somente se pertinente à duração.", "Se falhar, apresentar erro com Tentar novamente em superfície sobreposta; manter o contexto anterior consistente até confirmação da troca."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 33, "id": "note-1794545248182", "scenario": "E01-32", "scenarioTitle": "Paciente inativo", "view": "dashboard", "text": "Esse aqui sim é o tipo de aviso que deve ser na tela de fato e não uma sobreposição total na tela, então agora sabe a minha visão sobre o que deve ir na tela, sobreposto e afins, mas eu colocaria ele como um banner que sai debaixo do cabeçalho do sistema e que fica fixo em todo lugar, assim o usuário vai saber que aquele paciente está inativo, esse aviso que eu quero é igual o aviso que o word tem quando um arquivo está bloqueado para edição, ela aprece logo abaixo do cabeçalho de ferramentas como se tivesse embaixo do cabeçalho mas a parte de baixo suspensa na tela,", "status": "comment", "category": "shared", "relatedCategories": ["access", "dashboard", "history", "documents"], "userDecision": {"classification": "change_requested", "summary": "Paciente inativo deve permanecer visível em banner fixo sob o cabeçalho."}, "implementationRequirement": ["Mostrar faixa contextual persistente abaixo do cabeçalho do produto nas páginas do paciente inativo.", "Não usar modal bloqueante para esse aviso; permitir leitura autorizada e suspender comandos conforme o contrato.", "Reservar espaço e z-index para não encobrir navegação ou botões; sinalização persiste ao trocar abas/páginas."], "backendBoundary": "Paciente inativo mantém somente ações/leitura previstas no contrato.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 34, "id": "note-1794545348499", "scenario": "E01-33", "scenarioTitle": "Sessão expirada", "view": "session", "text": "A sessão expirada deve ter apenas uma forma de resolver que seria entrar novamente, portante apenas esse botão deve ser exibido", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Sessão expirada deve ter uma única ação resolutiva: entrar novamente."}, "implementationRequirement": ["Exibir apenas Entrar novamente como ação principal desse estado.", "Preservar o destino desejado para retorno após autenticação e não deixar informação privada navegável enquanto a sessão está expirada."], "backendBoundary": "Sessão expirada retira acesso privado até autenticar novamente; destino guardado não equivale a autorização.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 35, "id": "note-1794545617622", "scenario": "E01-34", "scenarioTitle": "Perfil sem acesso ativo", "view": "session", "text": "Essa tela se mistura um pouco com aquela em que eu falei que ao logar aparece um aviso de falta de vínculo para aquele usuário, que deveria ser um aviso em amarelo/âmbar ou vermelho e diferenciar a falta de vinculo de busca errada na barra de busca de pacientes, então acho que o melhor é você unificar as coisas, ou seja se o usuário não tem vínculo algum ele vem para essa tela aqui mas colocamos nessa tela a parte em vermelho pode ser ícone, fundo ou sei lá o que e deixamos a regra que o modal de seleção de vínculo só aprece para quem tem mais de um vínculo/função de acesso) caso não tenha nenhum aprece esse aqui", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Unificar ausência de vínculo ativo e reservar seleção para múltiplas opções."}, "implementationRequirement": ["Consolidar estados de conta sem vínculos ativos em tela própria com hierarquia de atenção âmbar/vermelha.", "Seleção aparece somente para várias opções; uma opção segue diretamente.", "Não confundir perfil local sem vínculo com administrador global autorizado a uma área global."], "backendBoundary": "Falta de vínculo local não retira uma capacidade global válida nem cria capacidade global.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 36, "id": "note-1794545806815", "scenario": "E01-35", "scenarioTitle": "Confirmar autenticador", "view": "mfa", "text": "A configuração do autenticador tem 2 caminhos possíveis, pode ser no primeiro acesso após o login e nesse momento não deve ser dentro de meu perfil, mas uma etapa própria que não faça o usuário entrar dentro do perfil dele ou então o usuário pode fazer isso a qualquer momento acessando o perfil dele e aí sim é nessa tela aqui, essa diferença é importante pois evita que na jornada do primeiro acesso o usuário venha parar nessa tela e ache que já está livre para mexer em tudo isso aqui sendo que ainda está fazendo a jornada de primeiro acesso entende?", "status": "comment", "category": "access", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Separar ativação de MFA no primeiro acesso da configuração voluntária no perfil."}, "implementationRequirement": ["No percurso inicial, oferecer etapa própria de configuração/confirmacão de autenticador, sem navegar para o perfil completo.", "No uso voluntário posterior, a mesma capacidade permanece em Meu perfil.", "A entrada por primeiro acesso não deve sugerir que as demais áreas já estão disponíveis antes de concluir as verificações realmente exigidas."], "backendBoundary": "Separação visual de onboarding/perfil não altera quais funções exigem AAL2 nem os contratos oficiais de TOTP.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 37, "id": "note-1794546064619", "scenario": "E01-36", "scenarioTitle": "Falha na consulta do autenticador", "view": "mfa", "text": "Apenas ver se está certo e padronizado o local do aviso de erro e para o autenticador seria bom que a família possa decidir se ela quer exigir que os usuários tenham ou se é facultativo", "status": "comment", "category": "access", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Padronizar erro de MFA; considerar política configurável pela família sem tratá-la como já fechada.", "proposalNotApproved": "Política familiar e periodicidade de lembrete de MFA permanecem propostas."}, "implementationRequirement": ["Alinhar posição e hierarquia do erro de consulta de autenticador ao padrão compartilhado.", "Registrar como proposta de produto a possibilidade de a família decidir exigência ou faculdade de MFA para usuários vinculados.", "Não introduzir configuração real, escolher autoridade exata nem enfraquecer requisito administrativo existente nesta v2; o escopo e a política exigem definição no recorte de governança/perfil."], "backendBoundary": "Política de MFA por residência não foi definida. Não alterar requisitos administrativos existentes nem presumir autoridade familiar para todos os papéis.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 38, "id": "note-1794546166745", "scenario": "E01-37", "scenarioTitle": "Administração aguarda MFA", "view": "home", "text": "", "status": "approved", "category": "access", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovado o bloqueio administrativo aguardando MFA."}, "implementationRequirement": ["Preservar a verificação adicional requerida para administração e a separação entre fator cadastrado e sessão efetivamente verificada."], "backendBoundary": "Distinguir fator existente, ativado e sessão AAL2, conforme docs/current/SECURITY.md.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 39, "id": "note-1794546496129", "scenario": "E01-38", "scenarioTitle": "Autenticador ainda não ativado", "view": "mfa", "text": "Em relação a autenticador acho que ainda vamos alterar uma coisa ou outra pois ele vai estar diretamente ligado a parte de perfil do usuário, mas acho importante separarmos a função de habilitar a autenticação na jornada do primeiro acesso (Ou toda vez que um usuário fizer login, sim podemos reutilizar a mesma aparência que exibe um modal algo do tipo sobreposto que logo após o login aparece essa parte de autenticador para insistir com o usuário que ele ative, isso pode ser configuração de produto mas podemos ter algo como a cada 30 dias aprece esse aviso para dar a chance dele ativar sem ter que ir até dentro de meu perfil) da ativação dentro de meu perfil que é a configuração do autenticador mas feita pelo usuário quando ele acessa o perfil dele, entende como a função é a mesma mas o momento que aprece e a sobreposição tem ideia diferente", "status": "comment", "category": "access", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Distinguir convite à ativação de MFA no acesso da configuração no perfil; frequência continua proposta.", "proposalNotApproved": "Política familiar e periodicidade de lembrete de MFA permanecem propostas."}, "implementationRequirement": ["Manter etapa/sobreposição contextual após login mas alterações sobre essa parte de convite la nos meus comentários anteriores, então essa etapa tem que ficar coerente com o que falei acima, com o carregamento dinâmico e tudo mais que ja falei", "status": "comment", "category": "access", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Atualizar resposta de convite não confirmada de modo coerente com as decisões anteriores."}, "implementationRequirement": ["Reutilizar notas 18, 25 e 27: processamento perceptível, texto humano e consulta/recuperação sem duplicar aceite.", "Não criar terceira linguagem ou posição de feedback só para esse cenário."], "backendBoundary": "Mesmo princípio das notas25/27: resultado confirmado antes de declarar sucesso, consulta da mesma intenção e sem repetição de efeito.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 42, "id": "note-1794546686154", "scenario": "E01-41", "scenarioTitle": "Acesso preparando os controles", "view": "login", "text": "", "status": "approved", "category": "access", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovado o estado que prepara os controles de acesso."}, "implementationRequirement": ["Preservar a indisponibilidade de ações enquanto dependências de autenticação ainda não estiverem prontas, aplicando o padrão visual transversal."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 43, "id": "note-1794546799236", "scenario": "E01-42", "scenarioTitle": "Saída com falha de conexão", "view": "dashboard", "text": "Apenas padronizar o espaçamento da borda inferior do aviso com os dados do usuário.\nEm relação ao menu do usuário como um todo eu ainda preferia ele como menu suspenso e não como modal sobreposto", "status": "comment", "category": "shared", "relatedCategories": ["access"], "userDecision": {"classification": "change_requested", "summary": "Ajustar respiro do aviso de saída e usar menu suspenso para a conta."}, "implementationRequirement": ["Regularizar espaço entre o aviso e os dados do usuário.", "Menu da foto deve ser suspenso/ancorado, sem abrir um modal central para ações ordinárias da conta.", "Falha de saída deve informar estado real da sessão; não afirmar que encerrou se a confirmação não ocorreu."], "backendBoundary": "Falha de logout não autoriza afirmar sessão encerrada.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 44, "id": "note-1794547876589", "scenario": "E02-01", "scenarioTitle": "Início da família", "view": "dashboard", "text": "1. Retirar o texto \"Decisões e acompanhamento de Helena Oliveira.\"\n2. Colocar o bloco de o que precisa de sua atenção antes dos botões e melhorar a aparência desse bloco pois ele está bem feito e rústico\n3. Para a família os botões deveriam ser nova entrega e nova compra, a devolução não é família que começa\n4. Os cards de requisições abertas, entregas e etc... ficaram bem feios, um card gigante para um conteúdo pequeno dentro com uma seta simples, enfim, não precisa de uma seta trbalhada, mas essa aqui sumiu dentro do car desse tamanho, talvez colocar ao lado da seta (antes dela) o texto ver, ou ir ou algo do tipo, assim explica pro usuário o que vai acontecer\n5. Vamos separar o bloco oque precisa de atenção do bloco \"Ações que precisam de você\" pois o primeiro deve focar em importância, ou seja, o mais importante/urgente/relevante fica no primeiro e o outro é lista de pendências do usuário\n6. o Card de atendimento da Requisição deveria ser um card de Requisições em aberto e então aprece as Requisições em aberto com nível de atendimento de cada uma e ao clicar na requisição ela é aberta, ja o car de movimentações recentes precisa ter cuidado para no celular as quebras de linhas não quebrar a aparência de cada histórico e manter coerência visual em cada movimentação\n7. Não vejo necessidade de um car de próximo plantão previsto, acho que seria melhor colocar aqui um calendário, pois no futuro eu pretendo incluir um módulo de agenda do paciente, então esse card vai ser ótimo para mostrar a agenda do paciente, por agora podemos colocar aqui apenas a escala prevista da semana ou apenas calendário com botão que leva para os plantões/escala, veja o que acha melhor\n8. Na tela como um todo é importante o uso de ícones, elementos visuais de fácil compressão e contexto, hierarquia coerente, coesão, dinamismo, e quem sabe possamos colocar aqui algo como menções, pois como temos a opção de mencionar alguém em um andamento aqui pode aparecer esse aviso\n9. Acho que um card de avisos seria interessante, dentro dele entram menções e avisos que achar pertinente", "status": "comment", "category": "dashboard", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Recompor o Início da família com prioridade real, atalhos corretos, requisições e avisos."}, "implementationRequirement": ["Remover a frase “Decisões e acompanhamento de …”.", "Atenção relevante vem antes dos botões, com composição refinada e distinta da lista pessoal de pendências.", "Atalhos da família: Nova entrega e Nova compra; não expor início de devolução equipe→família como ação da família.", "Compactar indicadores e tornar navegação evidente com texto como Ver junto ao ícone.", "Mostrar requisições em aberto com nível de atendimento por ficha e abertura da ficha exata, em vez de um único card genérico.", "Organizar movimentos recentes com alinhamento e quebras controladas no celular.", "Substituir próximo plantão isolado por escala semanal/calendário simples com acesso ao domínio de horários; não implementar módulo futuro de agenda do paciente.", "Incluir composição pertinente de avisos/menções e ícones coerentes, preservando autorização e sem criar comunicação real."], "backendBoundary": "Família não inicia devolução equipe→família. Calendário atual usa horários auxiliares existentes, não gestão completa de agenda. Avisos/menções não geram ciência ou envio externo automático.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 45, "id": "note-1794548201867", "scenario": "E02-02", "scenarioTitle": "Início do profissional", "view": "dashboard", "text": "1. Gostei do card de atenção logo no começo\n2. retirar o texto \"Suas próximas tarefas no cuidado de Helena Oliveira.\"\n3. Botão nova requisição deve ficar abaixo do card de precisa da sua atenção e não precisa ser tão grande, o destaque é pela localização e não apenas ser gigante\n4. O card \"O que precisa de atenção\" tem que ser usado com responsabilidade, se não for algo realmente importante/relevante/urgente não tem porque ele aparecer, e ele pode ser dividido em no máximo dois itens dentro dele\n5. Retire o card de plantão previsto pra agora, a tela inicial do profissional tem que ter pouca coisa\n6. Reorganize o tamanho, estilo e localização do botão registar ocorrências, ou seja, o menu de ações rápidas não pode ficar não para baixo na rolagem,", "status": "comment", "category": "dashboard", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Enxugar o Início do profissional e priorizar atenção e ações rápidas."}, "implementationRequirement": ["Manter atenção no início, mas só quando houver fato relevante/urgente; no máximo dois itens nessa área.", "Remover a frase “Suas próximas tarefas no cuidado de …”.", "Nova requisição logo abaixo da atenção, com tamanho moderado; destaque decorre da posição.", "Retirar card de plantão previsto desta composição inicial.", "Trazer Registrar ocorrência e outras ações rápidas para uma posição alta, sem aumentar desnecessariamente botões e rolagem."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 46, "id": "note-1794548262533", "scenario": "E02-03", "scenarioTitle": "Profissional com balanço disponível", "view": "dashboard", "text": "As correções dessa tela são a base do que ja falei, o card \"O que precisa de atenção\" serve para esse tipo de coisa mesmo", "status": "comment", "category": "dashboard", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Aplicar o padrão de atenção ao balanço disponível."}, "implementationRequirement": ["Balanço disponível é exemplo pertinente de atenção prioritária; aplicar a hierarquia e os limites da nota 45.", "A indicação não executa contagem, revisão ou aplicação de estoque."], "backendBoundary": "Ver disponibilidade de balanço não realiza contagem/revisão/aplicação.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 47, "id": "note-1794548316651", "scenario": "E02-04", "scenarioTitle": "Início do supervisor", "view": "dashboard", "text": "Aprovado em geral, apenas fazer com coerência igual falei para família e profissional, não vou dar muita atenção para essa parte de supervisão por agora", "status": "approved", "category": "dashboard", "relatedCategories": ["shared"], "userDecision": {"classification": "conditional_approval", "summary": "Aprovado o Início da supervisão em geral, condicionado à coerência dos padrões comuns.", "condition": "Aprovação geral da supervisão, com coerência visual condicionada às mudanças de família/profissional; sem revisão profunda da supervisão."}, "implementationRequirement": ["Preservar a composição/capacidades pertinentes da supervisão.", "Aplicar refinamentos compartilhados da família/profissional; não promover essa aprovação geral a revisão detalhada de todo o domínio de supervisão."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_
