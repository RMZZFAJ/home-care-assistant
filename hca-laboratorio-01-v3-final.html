a nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 53, "id": "note-1794548554828", "scenario": "E02-10", "scenarioTitle": "Início carregando", "view": "dashboard", "text": "Carregamento ocupa tela toda e não algo impresso na tela, pode ser os compoentes ja organizados e carregando dentro deles, o carregamento pode ser bem melhor que esse atual que está recomendando", "status": "comment", "category": "shared", "relatedCategories": ["dashboard"], "userDecision": {"classification": "change_requested", "summary": "Melhorar carregamento do Início, com sobreposição ou skeleton estruturado."}, "implementationRequirement": ["Substituir a faixa de texto isolada por carregamento perceptível ocupando a superfície pertinente.", "O comentário admite componentes já organizados com skeleton; não exige animação dinâmica em toda primeira consulta.", "Usar padrão escolhido de forma consistente, sem texto de laboratório no produto nem salto desnecessário de layout."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 54, "id": "note-1794548575350", "scenario": "E02-11", "scenarioTitle": "Falha ao consultar o início", "view": "dashboard", "text": "", "status": "approved", "category": "dashboard", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovada a falha de consulta do Início."}, "implementationRequirement": ["Preservar significado e recuperação do cenário; ajustar apenas estilo transversal coerente."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 55, "id": "note-1794548625066", "scenario": "E02-12", "scenarioTitle": "Mais opções do profissional", "view": "more", "text": "O profissional pode ter a opção de escolher se quer a visão completa/detalhada ou essa mais simples", "status": "comment", "category": "dashboard", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Oferecer escolha entre Início simples e detalhado ao profissional."}, "implementationRequirement": ["Representar opção de composição simples/detalhada para o Início do profissional, com escolha compreensível e sem perder tarefas relevantes.", "Essa preferência não autoriza criar fichas com estrutura diferente por perfil, nem expandir o escopo de permissões.", "Persistência real da preferência é assunto de implementação posterior; o laboratório pode mantê-la apenas na simulação."], "backendBoundary": "Preferência de composição do Início não altera capacidades nem a estabilidade das fichas; persistência real ainda não implementada neste laboratório.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 56, "id": "note-1794548664284", "scenario": "E02-13", "scenarioTitle": "Histórico com quatro tipos", "view": "history", "text": "Arrumar para não ter quebra de linhas entre cada acompanhamento que deixe desproporcional, incoerente e quebrado", "status": "comment", "category": "history", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Corrigir quebras de linha e proporções do histórico de quatro tipos."}, "implementationRequirement": ["Organizar identidade, metadados, status e ação em áreas estáveis de cada linha/cartão, com adaptação coerente ao celular.", "Evitar títulos, etiquetas e datas se alternando em posições arbitrárias conforme o tamanho do texto."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 57, "id": "note-1794548875947", "scenario": "E02-14", "scenarioTitle": "Histórico sem compras para o profissional", "view": "history", "text": "1. Pesquisas e filtros ficam em botões/botão de ícone e não abertos na tela toda, ocupa muito espaço em telas menores\n2. Se tem filtros aplicados eles aprecem como etiquetas assim o usuário sabe que tem filtro mas não ocupa muito espaço\n3. Aqui vejo um problema igual tinha nas movimentações na tela inicial, linhas quebradas, muito rústico, tags de ciência da família faltando enfm, falta refinar muita coisa", "status": "comment", "category": "history", "relatedCategories": ["documents"], "userDecision": {"classification": "change_requested", "summary": "Recolher filtros, mostrar etiquetas aplicadas e refinar linhas com ciência familiar."}, "implementationRequirement": ["Filtros em botão/painel recolhível para poupar espaço no celular; usar ícone identificado.", "Após aplicar, mostrar etiquetas removíveis/identificáveis dos filtros ativos.", "Refinar composição das linhas e mostrar ciência familiar nas REQ quando pertinente, sem confundir dispensa com confirmação pessoal.", "Preservar ausência de compras quando o perfil não possui acesso a COM."], "backendBoundary": "Selo de ciência é fato próprio; ausência de COM respeita autorização.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 58, "id": "note-1794548972366", "scenario": "E02-15", "scenarioTitle": "Pesquisar código ou protocolo", "view": "history", "text": "ja falei sobre o espaço gigante que busca e filtro estão ocupando em permanecer abertos mesmo após aplicar eles, a busca pode se manter sempre aberta, de resto expande e reprime de acordo com estado", "status": "comment", "category": "history", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Manter busca acessível e recolher filtros depois de aplicados."}, "implementationRequirement": ["Busca pode permanecer aberta; demais filtros expandem para editar e recolhem após aplicar.", "Manter consulta e filtros visíveis por resumo/etiquetas sem reservar um formulário grande permanentemente."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 59, "id": "note-1794548983994", "scenario": "E02-16", "scenarioTitle": "Filtros e página preservados no voltar", "view": "history", "text": "", "status": "approved", "category": "history", "relatedCategories": [], "userDecision": {"classification": "unconditional_approval", "summary": "Aprovada a preservação de filtros e página ao voltar."}, "implementationRequirement": ["Preservar pesquisa, filtros, página e destino de retorno ao abrir ficha e voltar ao histórico.", "A reorganização visual de filtros não pode apagar essa continuidade aprovada."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 60, "id": "note-1794549009915", "scenario": "E02-17", "scenarioTitle": "Nenhuma ficha encontrada", "view": "history", "text": "Usar ícone e usar cor", "status": "comment", "category": "history", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Dar iconografia e cor ao resultado vazio de busca."}, "implementationRequirement": ["Usar ícone e tom pertinente para a ausência de correspondência, com texto e ação para ajustar/limpar busca.", "Não usar aparência de falha de servidor ou de falta de permissão para uma busca legitimamente vazia."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 61, "id": "note-1794549032313", "scenario": "E02-18", "scenarioTitle": "Lista em primeira consulta", "view": "history", "text": "Padronizar carregamento em todo sistema", "status": "comment", "category": "shared", "relatedCategories": ["history"], "userDecision": {"classification": "change_requested", "summary": "Uniformizar carregamento da primeira consulta da lista."}, "implementationRequirement": ["Aplicar ao histórico o padrão de carregamento escolhido para consulta, com superfície e foco coerentes.", "Não exibir lista vazia nem erro enquanto a consulta ainda está pendente."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 62, "id": "note-1794549058702", "scenario": "E02-19", "scenarioTitle": "Falha de lista sem resultado anterior", "view": "history", "text": "Qual contexto? Usuário novo vai saber?", "status": "comment", "category": "history", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Tornar a falha inicial de histórico compreensível sem falar genericamente em contexto."}, "implementationRequirement": ["Dizer que não foi possível carregar as fichas do paciente/consulta autorizada, qual o efeito e como tentar novamente.", "Não exigir que usuário novo entenda “contexto”; preservar ausência de resultado anterior como fato distinto de lista vazia."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 63, "id": "note-1794549086205", "scenario": "E02-20", "scenarioTitle": "Lista anterior durante atualização", "view": "history", "text": "Enquanto consulta não aprece nada além do carregamento", "status": "comment", "category": "history", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Ocultar a lista durante atualização, mantendo apenas carregamento perceptível."}, "implementationRequirement": ["Enquanto a atualização está em andamento, a área de conteúdo deve mostrar carregamento, sem deixar a lista anterior visível como atual.", "Preservar internamente filtros, página e conteúdo anterior para retorno legítimo; a mudança visual não autoriza apagar preenchimentos.", "Não cancelar/repetir mutações ao usar o comando Atualizar."], "backendBoundary": "Ocultação visual durante consulta não apaga estado e não dispara mutação.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 64, "id": "note-1794549120545", "scenario": "E02-21", "scenarioTitle": "Falha com lista preservada", "view": "history", "text": "Apenas falha sem aparecer lista, pode por botão de retornar lista anterior", "status": "comment", "category": "history", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Em falha de atualização, mostrar falha e oferecer retorno explícito à lista anterior."}, "implementationRequirement": ["Após falha, não exibir automaticamente a lista antiga sob o aviso; oferecer ação “Ver lista anterior” ou equivalente.", "Ao escolher retornar, identificar a consulta como anterior/desatualizada.", "Só permitir retorno quando autorização corrente mantiver o acesso; dado revogado não é lista anterior recuperável."], "backendBoundary": "Fallback só para conteúdo cuja autorização permanece válida; estado revogado não pode ser restaurado.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 65, "id": "note-1794549178416", "scenario": "E02-22", "scenarioTitle": "Autorização perdida na lista", "view": "history", "text": "Se foi acesso revogado, remoção de permissão enquanto usuário estava navegando tem que ser melhor trabalhada", "status": "comment", "category": "history", "relatedCategories": ["access", "shared"], "userDecision": {"classification": "change_requested", "summary": "Tratar perda de autorização durante navegação de forma específica."}, "implementationRequirement": ["Retirar a informação local assim que o estado de acesso revogado for conhecido e explicar que o acesso foi removido.", "Oferecer retorno seguro, escolha de outro vínculo autorizado ou orientação ao responsável conforme as capacidades existentes.", "Não reaproveitar fallback de lista antiga nem caracterizar a revogação como simples falha temporária de rede."], "backendBoundary": "Revogação retira dados; não disponibilizar cache antigo como alternativa.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 66, "id": "note-1794549216743", "scenario": "E02-23", "scenarioTitle": "Resposta não corresponde à consulta", "view": "history", "text": "Erro pode ser mais simples, apenas falar que não deu certo e dar opção de tentar novamente", "status": "comment", "category": "history", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "Simplificar resposta de consulta incompatível para o usuário."}, "implementationRequirement": ["Mensagem humana de que não foi possível carregar/atualizar a lista e ação de tentar novamente.", "Continuar descartando resposta fora de ordem ou de outro contexto; simplificar o texto não autoriza aceitar dados incompatíveis."], "backendBoundary": "Resposta fora de ordem continua sendo descartada mesmo com texto de erro simplificado.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 67, "id": "note-1794549299006", "scenario": "E02-24", "scenarioTitle": "Endereço indisponível", "view": "not-found", "text": "Apenas botão para voltar ao início é suficiente, pois erro 404 pode ser por vários motivos, não vejo necessidade de ter botão de entrar na minha conta a menos que o erro foi durante login", "status": "comment", "category": "history", "relatedCategories": [], "userDecision": {"classification": "change_requested", "summary": "404 comum precisa apenas de retorno ao Início."}, "implementationRequirement": ["Em endereço indisponível fora da autenticação, oferecer uma ação de voltar ao Início.", "Não adicionar Entrar na minha conta sem relação com o estado; erros de login continuam nos próprios fluxos."], "backendBoundary": "Ajuste de apresentação/simulação dentro das capacidades existentes; não autoriza alteração remota nem regra nova de negócio.", "coverageStatus": "mapped_not_implementation_verified"}, {"sequence": 68, "id": "note-1794549727739", "scenario": "E03-06", "scenarioTitle": "Consulta indisponível", "view": "document", "text": "1. o cabeçalho no celular ficou completamente quebrado, totalmente desalinhado o cabeçalho\n2. Não vejo motivo para uma tag de versão, isso não precisa\n3. As tags de ciência, urgência e status também estão péssima assim\n4. A timaline de macroetapas ficou péssima\n5. Os botões de ações estão péssimos, mal organizados, \n6. Botão mais precisa ter compartilhar em que abre função que compartilha o link de acesso a ficha\n7. As abas estão sem ícone no nav delas\n8. A navegação dentro das ficahs ficou ridicula, realmente muito ruim", "status": "comment", "category": "documents", "relatedCategories": ["shared"], "userDecision": {"classification": "change_requested", "summary": "Reprojetar composição comum das fichas; este comentário não aprova E03.", "approvalScope": "Crítica à estrutura comum; E03 permanece aberto e nenhum dos demais cenários E03 foi aprovado por este arquivo."}, "implementationRequirement": ["Corrigir alinhamento do cabeçalho móvel com agrupamento claro de tipo/código/descrição e etiquetas; usar o Modelo Integral como referência de composição.", "Retirar etiqueta de versão do cabeçalho; manter Versões e integridade, histórico documental e uso de versão em decisões que precisam dela.", "Refinar ciência, urgência e situação com hierarquia e semântica distintas; não remover fatos aprovados por causa da aparência.", "Reorganizar macroetapas, títulos, indicadores e ações; manter Emissão → Ciência familiar → Atendimento → Conclusão da REQ, ciência podendo ocorrer depois de entregas e arquivamento como subetapa.", "Mais deve incluir Compartilhar link da ficha, com compartilhamento nativo se disponível e cópia como alternativa; isso compartilha referência e não concede acesso ao destino.", "Adicionar ícones coerentes às abas e recuperar navegação clara entre as áreas; preservar ordem/capacidades e a distinção Arquivos gerados/Anexos/Versões/Auditoria.", "Aplicar melhorias estruturais às quatro fichas sem criar desenho por perfil/status e sem introduzir novas regras de REQ/COM/ENT/BAL.", "Preservar integralmente rascunhos congelados, sua apresentação explícita e os quatro campos salvos; nenhuma aprovação do restante de E03 pode ser inferida."], "backendBoundary": "Mudança de apresentação e compartilhamento de link não muda contratos de fichas, documentos ou rascunhos; manter escopo de quatro campos do progressContent.", "coverageStatus": "mapped_not_implementation_verified"}]};

cenário."], "contractFindingIds": [], "state": "decision_mapped_not_implementation_verified"}, "needsReviewInFinal": false, "substantiveChange": false, "approvedVersion": "L01.v2", "v3Approval": "not_inferred"}, {"id": "note-1794554989656", "version": "L01.v2", "sourceCommit": "7e277958f8ee6a3a3a7484d9f8ca9a9e4e89d17a", "scenario": "E02-24", "scenarioTitle": "Endereço indisponível", "view": "not-found", "doc": null, "tab": "overview", "element": "", "status": "comment", "text": "talvez usar ícone e um formato que o usuário consiga identificar claramente que é um erro de sistema, a página não foi encontrada, teve um problema e então existe um erro de fato, depois podemos pensar em colocar um acordeon com detalhes para o usuário copiar e encaminhar ao suporte técnico", "at": "2026-11-13T07:29:49.656Z", "sequence": 69, "classification": "adjustment", "decision": "Tornar 404 claramente reconhecível e preparar detalhe útil para suporte.", "implementation": {"action": "adjust_in_v3", "requirements": ["Usar ícone e hierarquia visual que expliquem Página não encontrada, mantendo a ação de voltar.", "Acordeão de detalhes copiáveis é proposta futura aceitável, sem expor dados privados nem inventar erro técnico real na simulação.", "Não converter todo 404 em falha do servidor; endereço inválido/ausente continua descrito corretamente."], "contractFindingIds": [], "state": "decision_mapped_not_implementation_verified"}, "needsReviewInFinal": true, "substantiveChange": true, "approvedVersion": null, "v3Approval": "not_inferred"}, {"id": "note-1794557119058", "version": "L01.v2", "sourceCommit": "7e277958f8ee6a3a3a7484d9f8ca9a9e4e89d17a", "scenario": "E03-01", "scenarioTitle": "REQ · acompanhamento e ciência", "view": "document", "doc": "REQ-0042", "tab": "communications", "element": "", "status": "comment", "text": "1. Ficou muito melhor, seguindo assim vamos ter poucas revisões e comentários da minha parte\n2. O acompanhamento de uma ficha é a parte mais sensível em relação a atualização pois ela precisa refletir ao usuário o estado atual da ficha e precisa atualizar em tempo real os anadmentos, ciencia status e afins, com isso eu acho que a ficha não pode ter atualização manual (Até pode existir como segunda opção) o ideal é que seja atualizada em tempo real mesmo com usuário navegando por ela, se achar muito forçado pode fazer com estilo o aviso de paciente inativo, que fica preso a borda inferir do cabeçalho com botão atualizar agora, ou seja, sempre que um usuário estiver navegando e alguém mudou algo na ficha esse aviso aprece até a pessoa atualizar ou sair da ficha (Voltar, fechar app ou outro tipo de saída que vá atualizar quando ele voltar), assim quem está navegando dentro dela vai saber que tem informação desatualizada\n3. Alguns andamentos precisam ser comprimidos, ou seja, tem andamentos que são automáticos e os detalhes não são importantes, então podemos deixar eles menores com uma seta ao lado que ao clicar expande ele um pouco mais para ter essas informações, assim o usuário consegue ter uma visão compacta e completa de tudo, a ideia aqui não é agrupar em etapas, grupos, módulos oi coisas do tipo, mas sim mostrar andamentos em ordem cronológicas com as informações principais  mas que podem ser expandidos para mostrar detalhes secundários para o usuário entender melhor (Veja que não é auditoria ou dados técnicos, mas sim informações do andamento em si)\n4. Nos andamentos eu quero que para citar alguém basta digitar @ com o nome da pessoa para citação da pessoa e também se colocar @todos cita todos os envolvidos com aquele paciente, ja para referenciar fichas do paciente vamos usar / ou # ou outra coisa que você precisa ver a melhor opção\n5. Ainda sobre andamentos, eu quero que a família possa fazer andamentos privados entre eles, ou seja na hora de fazer um andamento ela marca como privado ou público e o privado fica apenas para a família ou então se no privado alguém de fora da família for citado aquela pessoa citada pode acessar aquele andamento privado, é importante que se tiver andamento privado quem não pode ver nem saiba que existe\n6. Ainda em andamentos, veja que temos andamentos automáticos, manuais, de marcos importantes como ciência, confirmação de recebimento e por ai vai, então nos arquivos pdf gerados pelo sistema já temos uma classificação visual para facilitar ver andamentos importantes com mais destaque, aqui seria a ideia também , ou seja, andamentos automáticos e sem importância ficam com cinza, muito importante com ciência fica com verde, outros tipo com âmbar/amarelo, cancelamentos e afins ficam com vermelho e por ai vai, não precisa seguir essa regra estritamente, mas veja que temos tipos diferentes de andamentos e alguns merecem mais destaque que outros, então seria bom se você pudesse fazer essa separação e deixar isso visual também\n7. A parte de progresso da ficha ficou ruim e ocupa muito espaço, vamos fazer assim, um acordeon que fechado mostra apenas barra de progresso e quando clica ela expande para mostrar a etapas em si, mantemos horizontal mesmo, apenas damos mais espaço para o usuário ver outros pontos importantes\n8. O cabeçalho da ficha tem que andar conforme a tela, ou seja, quando o usuário faz rolagem vertical o cabeçalho anda para cima e vai diminuindo o tamanho e ficando mais compacto e com algumas informações importantes mas resumidas como o número da ficha, tag apena ícone se tiver urgência e ciência familiar, assim o usuário pode rolar verticalmente para qualquer lugar que vai ter o básico de informação fixa na tela \n9. Próximo passo tem que ser próximo passo sugerido e com botão de fechar, e ficar abaixo dos botões, assim o usuário pode ver logo no começo e se quiser ignorar e fechar é só clicar no X\n10. nas observações da emissão elas precisam ser numeradas, durante o preenchimento de uma ficha o usuário pode colocar observações e elas aprecem aqui e se for mais de uma tem que aparecer cada uma numerada par saber que são diferentes\n11. Andamentos precisa ter foltros além de todos e automáticos, tem que ser possível filtrar por data, escolher período e também o card de andamentos tem que ser recolhível e expansível e ter tamanho máximo que após chegar nesse tamanho ele começa a ter rolagem vertical dentro dele (apenas vertical e não horizontal)\n12. A aba de materiais ainda não está como eu quero talvez uma tabela ou outra forma de exibir seja melhor o mesmo vale para aba de atendimento\n13. A aba de comunicações está boa mas ainda não vejo como uma aba funcional pois muita coisa está faltando, então precisa corrigir isso,", "at": "2026-11-13T08:05:19.058Z", "sequence": 70, "classification": "contract_divergence", "decision": "Consolidar o novo acompanhamento: atualização perceptível, cabeçalho compacto, andamento legível e privacidade proposta.", "implementation": {"action": "adjust_in_v3", "requirements": ["Adotar aviso persistente de informação nova/desatualizada sob o cabeçalho com Atualizar agora; conservar preenchimentos durante atualização.", "Andamentos continuam em ordem cronológica, com registros individuais compactos/expansíveis e destaque semântico para fatos relevantes.", "Editor oferece @nome e @todos; referências de fichas usam #, com seleção de destino autorizado.", "Família pode escolher andamento visível aos participantes autorizados ou privado familiar; pessoa de fora mencionada recebe acesso somente à nota segundo a regra nova. Quem não vê não recebe indicador de existência.", "Progresso em acordeão: fechado mostra resumo/barra, aberto mostra macroetapas horizontais. Não inventar percentual agregado sem significado.", "Cabeçalho acompanha a rolagem em forma compacta, conservando número e ícones identificáveis de urgência/ciência.", "Próximo passo sugerido fica abaixo das ações e pode ser fechado; sugestão não vira obrigação nem realiza ato.", "Observações da emissão numeradas e preservadas como conteúdo de origem.", "Feed recolhível com altura máxima, rolagem vertical interna e filtros de data/período além de origem.", "Recompor Materiais e Atendimento em tabela/estrutura legível com responsividade.", "Comunicações deve ter conteúdo e comandos representados de modo útil no recorte; não prometer envio, recebimento ou ciência real.", "A nova apresentação não altera atendimento por linhas de REQ, quantidades da ENT, autoria, recebimento ou ordem temporal."], "contractFindingIds": ["CF-07", "CF-09"], "state": "decision_mapped_not_implementation_verified"}, "needsReviewInFinal": true, "substantiveChange": true, "approvedVersion": null, "v3Approval": "not_inferred"}, {"id": "note-1794557160622", "version": "L01.v2", "sourceCommit": "7e277958f8ee6a3a3a7484d9f8ca9a9e4e89d17a", "scenario": "E03-02", "scenarioTitle": "COM · aquisição e recebimento", "view": "document", "doc": "COM-0018", "tab": "overview", "element": "", "status": "comment", "text": "Usar meus comentários de REQ como base pois muita coisa vale aqui para com", "at": "2026-11-13T08:06:00.622Z", "sequence": 71, "classification": "adjustment", "decision": "Aplicar os padrões compartilhados ao acompanhamento COM.", "implementation": {"action": "adjust_in_v3", "requirements": ["Reutilizar atualização, cabeçalho compacto, progresso recolhível, feed, observações, tabelas e comunicações da REQ onde pertinentes.", "Preservar as distinções compra/aquisição, chegada e validação/entrada; não transportar ciência familiar de REQ como regra da COM."], "contractFindingIds": ["CF-07", "CF-09"], "state": "decision_mapped_not_implementation_verified"}, "needsReviewInFinal": true, "substantiveChange": true, "approvedVersion": null, "v3Approval": "not_inferred"}, {"id": "note-1794557302865", "version": "L01.v2", "sourceCommit": "7e277958f8ee6a3a3a7484d9f8ca9a9e4e89d17a", "scenario": "E03-03", "scenarioTitle": "ENT · destinatário e recebimento", "view": "document", "doc": "ENT-0027", "tab": "history", "element": "", "status": "comment", "text": "Usar meus comentários de REQ como base pois muita coisa vale aqui para ENT.\nSeparar Fluxo de ENT com devolução, pois devolução não tem vínculo algum com entrada, uma ENT pode ter itens devolvidos sim, mas nem toda devolução vem de uma ENt, isso tem que ficar totalmente separo e ficha de devolução não pode consumir a aparência, nome, numeração e afins de uma ENT, como disse, elas são independentes", "at": "2026-11-13T08:08:22.865Z", "sequence": 72, "classification": "contract_divergence", "decision": "Aplicar os padrões comuns e separar a identidade da devolução da ENT.", "implementation": {"action": "adjust_in_v3", "requirements": ["ENT mantém destinatário, expedição, recebimento pessoal, divergências e conciliação próprios.", "Devolução independente usa identificação e numeração DEV na proposta de produto, sem depender de uma ENT de origem.", "Não confundir devolução de itens vinculados a uma ENT com a existência autônoma de uma DEV.", "Não renumerar exemplares históricos nem afirmar que o backend já aceita quinto tipo técnico; registrar a implementação futura."], "contractFindingIds": ["CF-03", "CF-07", "CF-09"], "state": "decision_mapped_not_implementation_verified"}, "needsReviewInFinal": true, "substantiveChange": true, "approvedVersion": null, "v3Approval": "not_inferred"}, {"id": "note-1794557332714", "version": "L01.v2", "sourceCommit": "7e277958f8ee6a3a3a7484d9f8ca9a9e4e89d17a", "scenario": "E03-04", "scenarioTitle": "BAL · contagem, parecer e aplicação", "view": "document", "doc": "BAL-0011", "tab": "overview", "element": "", "status": "comment", "text": "Usar meus comentários de REQ e outras ficahs como base pois o conceito é o mesmo aqui", "at": "2026-11-13T08:08:52.714Z", "sequence": 73, "classification": "adjustment", "decision": "Aplicar os padrões comuns ao BAL sem alterar atos de contagem/revisão/aplicação.", "implementation": {"action": "adjust_in_v3", "requirements": ["Reutilizar cabeçalho, atualização, progresso, feed, observações, materiais e comunicações no mesmo sistema visual.", "Manter parecer separad dsReviewInFinal": false, "substantiveChange": false, "sharedChangesMayApply": true, "reviewInstruction": "Aprovação/observação preservada; revisão integral não solicitada."}], "materialDecisions": [{"id": "MD-01", "decision": "Nova política de senha no modelo: mínimo 8, maiúscula, minúscula, número e símbolo.", "classification": "new_product_decision", "scenarios": ["E01-11", "E01-15", "E01-23"], "requiresFutureImplementation": true, "contractFindingIds": ["CF-06"]}, {"id": "MD-02", "decision": "Família pode ocultar atenção por 24 horas; profissional não fecha atenção obrigatória.", "classification": "new_product_decision", "scenarios": ["E02-01", "E02-03"], "requiresFutureImplementation": true, "notes": "Ocultar não conclui tarefa nem muda sua prioridade intrínseca. Estado por pessoa/paciente e retorno enquanto pendente."}, {"id": "MD-03", "decision": "Adiamento BAL escolhe plantão elegível e justificativa, aguardando decisão familiar.", "classification": "current_contract_clarified", "scenarios": ["E02-03"], "requiresFutureImplementation": false, "contractFindingIds": ["CF-02"]}, {"id": "MD-04", "decision": "DEV tem identidade, nome, numeração e jornada próprios no modelo; devolução continua independente de uma ENT de origem.", "classification": "new_product_decision", "scenarios": ["E03-03"], "requiresFutureImplementation": true, "contractFindingIds": ["CF-03"]}, {"id": "MD-05", "decision": "Andamento privado familiar e convidados por menção, com existência totalmente oculta a quem não vê; menções por @nome/@todos e fichas por#.", "classification": "new_product_decision", "scenarios": ["E03-01", "E03-14"], "requiresFutureImplementation": true, "contractFindingIds": ["CF-07"]}, {"id": "MD-06", "decision": "Atualização por aviso fixo de informação nova, preservando edição; bloquear nova geração de arquivo enquanto a consulta estiver antiga.", "classification": "user_selected_direction_with_lab_design_choice", "scenarios": ["E03-01", "E03-07", "E03-45"], "requiresFutureImplementation": true, "contractFindingIds": ["CF-09"], "notes": "O usuário aceita essa alternativa ao refresh integral em tempo real. Não prometer sincronização real comprovada."}, {"id": "MD-07", "decision": "Rascunho abre decisão de retomada em modal; abandona-se o painel permanente rejeitado.", "classification": "explicit_user_override_of_prior_visual_freeze", "scenarios": ["E03-14", "E03-15", "E03-36", "E03-37", "E03-38"], "requiresFutureImplementation": true, "contractFindingIds": ["CF-08"], "notes": "Mudança de apresentação autorizada agora. Escopo salvo, recuperação e integridade não são ampliados por consequência."}, {"id": "MD-08", "decision": "Verificador público e anexos privados são percursos diferentes; a checagem de upload permanece na ficha.", "classification": "contract_clarification", "scenarios": ["E03-31", "E03-32", "E03-33", "E03-34"], "requiresFutureImplementation": false, "contractFindingIds": ["CF-05"]}, {"id": "MD-09", "decision": "Uma ficha atual mantém memória técnica de estados anteriores; reformular apresentação sem eliminar história.", "classification": "contract_clarification", "scenarios": ["E03-40"], "requiresFutureImplementation": false, "contractFindingIds": ["CF-04"]}, {"id": "MD-10", "decision": "Preferência Simples/Completa fica em Meu perfil; posição definitiva pertence a E11.", "classification": "new_placement_decision", "scenarios": ["E02-12"], "requiresFutureImplementation": true}, {"id": "MD-11", "decision": "Retorno de autenticação, cancelamento de troca de paciente e Voltar da ficha preservam origem exata quando válida.", "classification": "continuity_fix", "scenarios": ["E01-08", "E01-30", "E02-16"], "requiresFutureImplementation": true}, {"id": "MD-12", "decision": "MFA por família e periodicidade de 30 dias continuam propostas anteriores não convertidas em regra por estas aprovações.", "classification": "preserved_boundary", "scenarios": ["E01-35", "E01-37", "E01-38", "E01-45"], "requiresFutureImplementation": false}], "contractFindings": [{"id": "CF-01", "topic": "Referência atual e branch default", "kind": "verified_source_boundary", "scenarios": [], "fact": "A branch default é master em 8ec979aac340bbc19ec64288bf0acf3abea4711a, de 05/11/2026, cujo README declara a Fase D não iniciada. O candidato D-B atual está em feat/phase-d-implementation, 77acdfcebbe7a346ba02d72f95be1216a1697ab3, de 13/11/2026.", "implication": "Usar master como fotografia da branch default, mas responder contratos D-B pelo candidato atual explicitamente identificado. Não misturar essa inspeção com a baseline histórica 7e277958 do laboratório.", "currentLabTreatment": "Manter a baseline de aparência/fluxos da v2 e registrar as verificações contratuais pontuais neste SHA; nenhuma atualização integral da aplicação foi feita.", "evidence": ["https://api.github.com/repos/RMZZFAJ/home-care-assistant", "https://api.github.com/repos/RMZZFAJ/home-care-assistant/branches/master", "https://api.github.com/repos/RMZZFAJ/home-care-assistant/branches/feat/phase-d-implementation", "https://github.com/RMZZFAJ/home-care-assistant/blob/8ec979aac340bbc19ec64288bf0acf3abea4711a/README.md"], "requiresBackendChange": false}, {"id": "CF-02", "topic": "Adiamento de BAL e próximo plantão", "kind": "verified_current_contract", "scenarios": ["E02-03"], "fact": "request_deferral recebe assignmentId, targetShiftId e justificativa de 3 a 1000 unidades UTF-16. Atribuição deve estar ativa, com versão atual e prazo ainda vigente. Solicita o profissional atribuído ou supervisor ativo com bal.defer.request. O destino é plantão published do mesmo paciente, iniciado no fim ou depois do fim da atribuição atual, com profissional ativo e capacidade bal.count; pode ser outra pessoa.", "decision": "Mostrar Fazer balanço e Solicitar adiamento na atenção do profissional; sem fechar o card e sem ação rápida duplicada.", "implication": "Solicitar não altera prazo/responsabilidade nem gera por si só a transferência. A família/administração local com autoridade efetiva decide; supervisão não substitui essa aprovação. Aprovação revalida versão, período e pessoa do destino, mantém prazo original e registra prazo efetivo. Recusa não muda prazos, atribuição ou estoque. Falta/ambiguidade de cobertura exige decisão explícita.", "currentLabTreatment": "Diálogo local com destino elegível e justificativa; resultado Aguardando decisão familiar, mantendo obrigação original. Não simular transferência automática ao próximo horário nem ajuste de estoque.", "evidence": ["BAL-payload", "BAL-regime", "BAL-destino", "BAL-solicitacao", "BAL-decisao", "API-BAL"], "requiresBackendChange": false}, {"id": "CF-03", "topic": "Devolução autônoma e identidade DEV", "kind": "new_product_decision_diverges_from_current_contract", "scenarios": ["E03-03"], "fact": "O candidato atual já permite devolução independente CARE_TEAM→FAMILY sem ENT de origem obrigatória; a rota /fichas/devolucao usa TransferConsole source CARE_TEAM. AUTONOMOUS_RETURNS.md preserva protocolo ENT e declara que não cria quinto tipo técnico. createSupplySchema aceita COM, ENT e BAL.", "decision": "O usuário agora determina fluxo, nome, numeração e aparência próprios de devolução, independentes de ENT. A v3 pode usar DEV como identidade de produto proposta para materializar essa decisão.", "implication": "Autonomia operacional já existe; identidade/numeração DEV própria exige alteração futura de contratos e consumidores. Não renomear retroativamente exemplares ENT existentes nem anunciar suporte nativo de DEV no servidor.", "currentLabTreatment": "Separar navegação/identificação demonstrativa DEV e ENT; marcar a mudança como decisão de produto para implementação. ENT com itens retornados e uma DEV independente continuam fatos distintos.", "evidence": ["DEV-atual", "DEV-rota", "Tipos-atuais", "API-DEV"], "requiresBackendChange": true}, {"id": "CF-04", "topic": "Uma ficha e seu histórico documental", "kind": "terminology_mismatch_resolved_by_current_contract", "scenarios": ["E03-40"], "fact": "GET /api/documents/:id/history consulta snapshots imutáveis de versões da mesma ficha, escolhendo evento exato e referência anterior. Não cria outra ficha, não reemite PDF e não torna passado editável. Reconte de BAL pode produzir nova contagem formal na mesma identidade, preservando contagens anteriores.", "decision": "Apresentar uma ficha atual ao usuário. Explicar/reorganizar a consulta de histórico sem comunicar a existência de várias fichas concorrentes.", "implication": "O comentário não é autorização inequívoca para destruir histórico, hashes, recibos ou versões técnicas. Renomear a apresentação para Histórico da ficha/Registros preservados pode resolver a compreensão; a decisão final sobre visibilidade pertence ao modelo.", "currentLabTreatment": "Manter identificação única e mostrar registros anteriores como memória preservada, com linguagem operacional e acesso autorizado. Conservar o exemplar histórico exato e não chamar revisão técnica de nova ficha.", "evidence": ["Historico-ficha", "API-Historico"], "requiresBackendChange": false, "consolidationNote": "Se o responsável depois decidir eliminar qualquer acesso a esse histórico, tratar como nova decisão explícita de produto; não inferir remoção técnica desta dúvida."}, {"id": "CF-05", "topic": "Verificação pública de PDF versus anexos privados", "kind": "terminology_mismatch_resolved_by_current_contract", "scenarios": ["E03-31", "E03-32", "E03-33", "E03-34", "E03-50", "E03-51", "E03-52"], "fact": "GET /api/verification consulta código e POST analisa PDF público sem conta, de 100 bytes a 4 MiB, com metadados mínimos e sem persistir o upload no acervo. /api/attachments usa authenticate, patientContext e vínculo exato a ficha/movimento/contingência; reserva, sanitização, envio, recuperação e rejeição de anexo são outro processo.", "decision": "A validação de autenticidade deve estar em página pública, fora da ficha; isso corresponde ao contrato verificado.", "implication": "Os cenários 3  explicitamente mencionadas; quem não tiver acesso não deve perceber sua existência. Menções por @nome/@todos e referência por #ficha serão modeladas.", "implication": "São contratos novos de autorização, consultas, contagens, pesquisa, acervos/PDF e comunicação. @todos pode ultrapassar 8 pessoas; não é apenas estilo do editor. Uma menção autorizada à nota não concede acesso indiscriminado à ficha ou residência.", "currentLabTreatment": "Simular exclusivamente com pessoas/dados fictícios elegíveis e esconder completamente notas não autorizadas, inclusive totais/indicadores. Registrar comportamento novo sem alegar RLS/ACL implementadas.", "evidence": ["Andamentos-schema"], "requiresBackendChange": true, "consolidationNote": "Política de membros ativos, revogação e propagação da privacidade a PDF/avisos precisa de implementação explícita; não bloqueia avaliar a v3."}, {"id": "CF-08", "topic": "Rascunhos: mudança expressa de apresentação, escopo preservado", "kind": "new_user_decision_supersedes_previous_visual_freeze", "scenarios": ["E03-14", "E03-15", "E03-36", "E03-37", "E03-38", "E03-54"], "fact": "A ordem anterior congelava apresentação e abrangência. Os novos comentários rejeitam o painel fixo e pedem modal de retomada ao abrir uma função que tenha rascunho.", "decision": "A instrução posterior autoriza alterar a apresentação: perguntar continuar ou começar de novo, e prosseguir sem painel permanente ocupando o formulário.", "implication": "Isso não autoriza apagar rascunho sem decisão clara, perder conflito/comparação, confundir resultado privado incerto com publicação oficial, criar autosave ou ampliar o payload persistido. category/stage/text/references continuam o escopo atual; privacidade/menções novas não entram automaticamente no draft.", "currentLabTreatment": "Modal contextual de retomada e superfícies próprias de conflito/recuperação; resultado já publicado permanece no histórico e limpa só preparação quando reconhecido.", "evidence": ["Andamentos-schem object({ cycleId: id, targetShiftId: id, reason }).strict() }).strict(),\n]) }).strict();", "verifiedOnGitHub": true}, {"id": "BAL-regime", "path": "docs/ui-ux/BALANCES.md", "commit": "77acdfcebbe7a346ba02d72f95be1216a1697ab3", "url": "https://github.com/RMZZFAJ/home-care-assistant/blob/77acdfcebbe7a346ba02d72f95be1216a1697ab3/docs/ui-ux/BALANCES.md", "startLine": 19, "endLine": 55, "excerpt": "\nO regime novo é opt-in por paciente. Nenhuma migration ativa pacientes ou cria\nplantões. Família/administração local configura dia, tipo, fuso, início e,\nopcionalmente, profissional designado. Administração global não assume esse\nvínculo. A configuração não cria obrigações anteriores à primeira ativação.\n\nAdministrar escalas, contar estoque e aprovar adiamentos são competências\ndistintas. Contagem exige profissional/supervisor ativo, capacidade efetiva e\natribuição vigente dentro da janela de um plantão real. Aprovação familiar não\npode ser delegada à supervisão por uma exceção da matriz. A própria pessoa que\ncontou não pode revisar sua contagem. Esses limites são aplicados no banco,\nprojetados no contexto e explicitados nas células restritas da matriz.\n\n## Obrigações e histórico\n\nCada semana tem uma obrigação com prazo original preservado. Um ciclo aberto\nacumula obrigações ainda não contadas; perder um prazo preserva a atribuição e o\natraso e transfere a responsabilidade para um próximo plantão elegível.\nAusência de cobertura ou cobertura ambígua exige resolução explícita. O sistema\nnão escolhe uma pessoa arbitrariamente nem trata programação como presença.\n\nSolicitar adiamento não altera prazo nem responsabilidade. A decisão familiar\nrevalida versões da atribuição e do plantão de destino. Aprovação conserva o\nprazo original e registra o prazo efetivo; o prazo aprovado não é apresentado\ncomo atraso. Troca de horário ou cancelamento de plantão com BAL vigente exige\na decisão familiar antes da alteração. Uma substituição no mesmo período pode\ntransferir a atribuição sem deslocar a janela. Versões antigas ficam auditáveis.\n\nNa decisão de um adiamento, destino, prazo e versão propostos permanecem em\nleitura nas duas etapas. Situação atual do plantão é uma comparação separada;\num alvo obsoleto não pode ser aprovado, mas a recusa do pedido pendente permanece\ndisponível com justificativa própria. A recusa não muda prazo, atribuição ou\nestoque. Conflito preserva a justificativa, e nova consulta não troca o destino.\nResultado incerto mantém corpo/chave congelados. Após confirmação ou fechamento,\no foco retorna a um controle válido ou ao título estável quando o acionador\ndesapareceu/perdeu elegibilidade. A consulta conserva nome e motivo do decisor.\n", "verifiedOnGitHub": true}, {"id": "BAL-destino", "path": "src/components/balances/balance-preparation-fields.tsx", "commit": "77acdfcebbe7a346ba02d72f95be1216a1697ab3", "url": "https://github.com/RMZZFAJ/home-care-assistant/blob/77acdfcebbe7a346ba02d72f95be1216a1697ab3/src/components/balances/balance-preparation-fields.tsx", "startLine": 74, "endLine": 92, "excerpt": "  const targets = (data?.targets ?? []).filter(\n    (t) =>\n      ((purpose !== \"defer\" && purpose !== \"request_deferral\") ||\n        !a ||\n        Date.parse(t.starts_at) >= Date.parse(a.ends_at)) &&\n      (purpose !== \"assign\" ||\n        allowDeferral ||\n        Date.parse(t.ends_at) \u003c= deadline),\n  );\n  const selected = targets.find((t) => t.id === values.targetShiftId),\n    type = (data?.types ?? []).find(\n      (t) => t.id === values.shiftTypeId && t.is_active,\n    ),\n    person = (data?.professionals ?? []).find(\n      (p) => p.id === values.professionalId,\n    );\n  const label = (t: (typeof targets)[number]) =>\n    `${t.professional_name} · ${t.type_name} · ${fmt(t.starts_at)} → ${fmt(t.ends_at)}`;\n  const decisionAvailable =", "verifiedOnGitHub": true}, {"id": "BAL-solicitacao", "path": "supabase/migrations/20261024222909_balance_assignment_resolution.sql", "co are_recipients where id=d.care_recipient_id and is_active);\n v_target_state:=case when s.id is null then 'unavailable'\n   when s.status\u003c>'published' or s.version is distinct from d.target_shift_version then 'changed'\n   when not v_target then 'ineligible' else 'unchanged' end;\n return jsonb_build_object('canApprove',d.status='pending' and v_authority and v_source and v_target,\n   'canReject',d.status='pending' and v_authority,'sourceCurrent',v_source,'sourceDeadline',a.ends_at,\n   'targetState',v_target_state,'proposedVersion',d.target_shift_version,\n   'currentTarget',case when s.id is not null then to_jsonb(s)||jsonb_build_object('professional_name',(select full_name from public.profiles where id=s.professional_id),'type_name',(select name from public.shift_types where id=s.shift_type_id)) end);", "verifiedOnGitHub": true}, {"id": "DEV-atual", "path": "docs/audits/D/D-B/AUTONOMOUS_RETURNS.md", "commit": "77acdfcebbe7a346ba02d72f95be1216a1697ab3", "url": "https://github.com/RMZZFAJ/home-care-assistant/blob/77acdfcebbe7a346ba02d72f95be1216a1697ab3/docs/audits/D/D-B/AUTONOMOUS_RETURNS.md", "startLine": 7, "endLine": 16, "excerpt": "\nA devolução segue somente de CARE_TEAM para FAMILY. Não exige uma entrega de\norigem, não desfaz uma entrada e não cria um quinto tipo técnico de documento.\nO protocolo ENT, as identidades, os movimentos e os documentos anteriores ficam\npreservados. O vínculo com uma ENT conhecida continua opcional e autorizado.\n\nA nova entrada /fichas/devolucao usa o console bilateral existente com origem\nfixa na equipe. Está na navegação, em Mais, no painel administrativo diário,\nna Central de fichas e no acompanhamento de entregas. O console genérico e os\npreenchimentos anteriores continuam disponíveis. Pessoas, materiais, referência", "verifiedOnGitHub": true}, {"id": "DEV-rota", "path": "src/app/fichas/devolucao/page.tsx", "commit": "77acdfcebbe7a346ba02d72f95be1216a1697ab3", "url": "https://github.com/RMZZFAJ/home-care-assistant/blob/77acdfcebbe7a346ba02d72f95be1216a1697ab3/src/app/fichas/devolucao/page.tsx", "startLine": 1, "endLine": 6, "excerpt": "import { AuthenticatedPage } from \"@/components/authenticated-page\";\nimport { TransferConsole } from \"@/components/documents/transfer-console\";\n\nexport default function Page() {\n  return \u003cAuthenticatedPage>\u003cTransferConsole source=\"CARE_TEAM\" />\u003c/AuthenticatedPage>;\n}", "verifiedOnGitHub": true}, {"id": "Tipos-atuais", "path": "src/lib/validation/documents.ts", "commit": "77acdfcebbe7a346ba02d72f95be1216a1697ab3", "url": "https://github.com/RMZZFAJ/home-care-assistant/blob/77acdfcebbe7a346ba02d72f95be1216a1697ab3/src/lib/validation/documents.ts", "startLine": 80, "endLine": 94, "excerpt": "    draftCommit: draftCommitSchema.optional(),\n    draftKind: z.enum([\"COM\", \"ENT\", \"BAL\"]).default(\"BAL\"),\n  })\n  .strict();\nexport const createSupplySchema = z\n  .object({\n    careRecipientId: identifier,\n    type: z.enum([\"COM\", \"ENT\", \"BAL\"]),\n    payload: supplyPayload,\n    idempotencyKey: identifier,\n    draft: z.boolean().default(false),\n    draftCommit: draftCommitSchema.optional(),\n  })\n  .strict()\n  .superRefine((value, ctx) => {", "verifiedOnGitHub": true}, {"id": "Historico-ficha", "path": "docs/audits/D/D-B/DOCUMENT_VERSION_HISTORY.md", "commit": "77acdfcebbe7a346ba02d72f95be1216a1697ab3", "url": "https://github.com/RMZZFAJ/home-care-assistant/blob/77acdfcebbe7a346ba02d72f95be1216a1697ab3/docs/audits/D/D-B/DOCUMENT_VERSION_HISTORY.md", "startLine": 8, "endLine": 35, "excerpt": "\nUma consulta Auth por versão escolhe o evento exato e uma referência anterior.\nO contrato operacional existente e o RLS do próprio cliente limitam a leitura;\no servidor revalida a autorização depois da consulta. Não usa service-role nem\nadiciona grants, migrations ou escrita de negócio. Versão ausente/referência\ninvertida são recusadas, sem substituição pela atual.\n\nAutoria vem exclusivamente do nome preservado no evento. Ausência permanece\ndesconhecida; evento sem autor pessoal é identificado como sistema. Nome de\nperfil ou catálogo atual não recompõe o passado. Dados de autoridade e chaves\nde transporte não são publicados pela projeção de leitura.\n\nO corpo JSONB é consultado como texto pelo cast do PostgREST; Node24 conserva\no token de cada número ao decodificá-lo. Quantidades são formatadas por Decimal,\npreservando casas significativas em vez de passar pelo arredondamento binário.\n[Contrato do cast](https://docs.postgrest.org/en/stable/references/api/tables_views.html#casting-columns).\n\nA comparação associa linhas pela identidade preservada, separa antes/depois,\nmotivo e ressalva, mostra fatos completos que já têm descrição e oferece o\narquivo da versão indicada. Campos adicionais ainda sem descrição são avisados\nexplicitamente; a leitura não se declara um resumo exaustivo nessa condição.\nFatos são texto/listas, sem textarea, aria-invalid ou pedido de correção de\nconteúdo histórico. Falha oferece Atualizar somente para a seção.\n\nSeleção e referência ficam no endereço. Abrir o acervo e voltar recupera essa\nconsulta. Controles permanecem montados durante a espera para preservar foco;\nresultado de outra seleção não é mostrado como o atual. Consultar o histórico\nnão emite outro exemplar nem altera evento, ledger ou assinatura.", "verifiedOnGitHub": true}, {"id": "Verificacao-publica", "path": "src/app/api/verification/route.ts", "commit": "77acdfcebbe7a346ba02d72f95be1216a1697ab3", "url": "https://github.com/RMZZFAJ/home-care-assistant/blob/77acdfcebbe7a346ba02d72f95be1216a1697ab3/src/app/api/verification/route.ts", "startLine": 1, "endLine": 24, "excerpt": "import { z } from \"zod\";\nimport { api, parseQuery } from \"@/lib/server/api\";\nimport { verificationCodeSchema } from \"@/lib/documents/public-verification\";\nimport { publicPdfReference, publicPdfUpload } from \"@/lib/server/public-pdf\";\nexport const runtime = \"nodejs\";\nexport const maxDuration = 20;\nexport async function GET(request: Request) {\n  return api(\"verification.reference\", async () => {\n    const query = parseQuery(\n      z.object({ code: verificationCodeSchema }).strict(),\n      Object.fromEntries(new URL(request.url).searchParams),\n    );\n    return Response.json(await publicPdfReference(request, query.code));\n  });\n}\nexport async function POST(request: Request) {\n  return api(\"verification.upload\", async () => {\n    const query = parseQuery(\n      z.object({ code: verificationCodeSchema.optional() }).strict(),\n      Object.fromEntries(new URL(request.url).searchParams),\n    );\n    return Response.json(await publicPdfUpload(request, query.code ?? null));\n  });\n}", "verifiedOnGitHub": true}, {"id": "Anexos-autenticados", "path": "src/app/api/attachments/route.ts", "commit": "77acdfcebbe7a346ba02d72f95be1216a1697ab3", "url": "https://github.com/RMZZFAJ/home-care-assistant/blob/77acdfcebbe7a346ba02d72f95be1216a1697ab3/src/app/api/attachments/route.ts", "startLine": 24, "endLine": 53, "excerpt": "}\nfunction reply(body: unknown, status = 200) { return NextResponse.json(body, { status, headers: { \"cache-control\": \"private, no-store\" } }); }\n\nexport async function GET(request: Request) {\n  return api(\"attachments.read\", async () => {\n    const auth = await authenticate(), params = new URL(request.url).searchParams;\n    const parsed = parent.safeParse(Object.fromEntries(params));\n    if (!parsed.success) throw new ApiError(\"VALIDATION_ERROR\", \"Documento ou movimentação inválido.\");\n    await patientContext(auth, parsed.data.careRecipientId);\n    const key = params.get(\"attemptKey\");\n    if (key && !uuid.safeParse(key).success) throw new ApiError(\"VALIDATION_ERROR\", \"Tentativa inválida.\");\n    const data = await rpc(auth.client, parsed.data.contingencyId?\"contingency_attachment_attempts\":\"attachment_attempts\", lookup(parsed.data, key)) as Attempt[];\n    const files = await Promise.all(data.map(
