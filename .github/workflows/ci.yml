name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run lint
      - run: npm run lint:markdown
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reserve the local Supabase ports
        run: |
          # Exclude the stack from automatic outbound port allocation.
          hca_reserved_ports="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${hca_reserved_ports:+$hca_reserved_ports,}54320-54329"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - run: npm run test:db:prepare
      - name: Back up the local CI database before explicit replay
        run: |
          node --input-type=module -e "import {backupLocalDatabase} from './scripts/backup-local-database.mjs'; import {appendFileSync} from 'node:fs'; const {file}=await backupLocalDatabase(); appendFileSync(process.env.GITHUB_ENV,'HCA_LOCAL_BACKUP='+file+'\n');"
      - run: npm run test:migrations -- --replay-local --backup "$HCA_LOCAL_BACKUP"
      - run: npm run test:integration

  browser:
    needs: database
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: mobile
            engine: chromium
          - project: ios
            engine: webkit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reserve the local Supabase ports
        run: |
          # Exclude the stack from automatic outbound port allocation.
          hca_reserved_ports="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${hca_reserved_ports:+$hca_reserved_ports,}54320-54329"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - run: npm run test:db:prepare
      - run: npm run test:db:seed
      - name: Use official Ubuntu archives for browser dependencies
        run: |
          # Avoid throttled Azure mirrors; keep APT signature verification intact.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i -E \
                -e 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' \
                -e 's#http://security\.ubuntu\.com/ubuntu/?#https://security.ubuntu.com/ubuntu/#g' \
                "$apt_source_file"
            fi
          done
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: browser-test-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  database-and-browser:
    if: always()
    needs: [database, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require database and every browser project
        env:
          DATABASE_RESULT: ${{ needs.database.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$DATABASE_RESULT" = success && test "$BROWSER_RESULT" = success
