name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run lint
      - run: npm run lint:markdown
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - run: npm run test:db:prepare
      - name: Back up the local CI database before explicit replay
        run: |
          node --input-type=module -e "import {backupLocalDatabase} from './scripts/backup-local-database.mjs'; import {appendFileSync} from 'node:fs'; const {file}=await backupLocalDatabase(); appendFileSync(process.env.GITHUB_ENV,'HCA_LOCAL_BACKUP='+file+'\n');"
      - run: npm run test:migrations -- --replay-local --backup "$HCA_LOCAL_BACKUP"
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
